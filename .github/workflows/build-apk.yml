name: Build Offline Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Web App
        run: |
          npm install
          npm run build -- --base=./
      - name: Wrap into Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PU ProbStat" "com.pu.probstat" --web-dir=dist
          npx cap add android
          npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PU-ProbStat-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
