(−z²/2) and prove f″(x) = 0 at x = μ ± σ.","steps":[{"step":1,"title":"Change of Variable from X to Z = (X − μ)/σ","equation":"x = μ + σz  ⇒  dx = σ dz,   and   f_Z(z) = f_X(μ + σz) · |dx/dz| = [1/(σ√(2π))] e^(−z²/2) · σ = (1/√(2π)) e^(−z²/2)","note":"The σ factors cancel, leaving a parameter-free universal density φ(z) ~ N(0, 1)."},{"step":2,"title":"First Derivative f′(x) to Locate Peak (Mode)","equation":"f′(x) = f(x) · [ −(x − μ) / σ² ] = 0   ⇒   x = μ","note":"Since f(x) > 0 everywhere, the unique stationary point (peak/mode) occurs at x = μ."},{"step":3,"title":"Second Derivative f″(x) by Product Rule","equation":"f″(x) = f′(x)[ −(x − μ)/σ² ] + f(x)[ −1/σ² ] = [ f(x) / σ² ] · [ (x − μ)²/σ² − 1 ]","note":"Set f″(x) = 0 for points of inflection:"},{"step":4,"title":"Solve f″(x) = 0 for Inflection Coordinates","equation":"(x − μ)² / σ² = 1   ⇒   x = μ ± σ   (equivalently z = ±1)","note":"At x = μ, f″(μ) = −f(μ)/σ² < 0 (concave down maximum); at x = μ ± σ, curvature flips sign."}],"result":"Z = (X − μ)/σ ~ N(0, 1) with inflection points at x = μ ± σ (z = ±1)."},"keyTakeawayN":"Always sketch a quick bell curve centered at 0, plot your z-values on the left/right of 0, and shade the target interval before looking up tables."},{"id":"ch6-sub-2","code":"6.2","title":"Properties of the Normal Distribution (Moments, Deviations & Linear Sums)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A Normal distribution N(μ, σ²) is completely specified by two parameters—mean μ and variance σ²—and exhibits exact symmetry, zero skewness, mesokurtic kurtosis, constant ratios among dispersion measures, and closure under linear combinations.","descriptionD":"Core Properties: (1) Mean = Median = Mode = μ; (2) Skewness β₁ = 0, Kurtosis β₂ = 3; (3) Odd central moments μ_{2k+1} = 0, even central moments μ_{2k} = 1·3·5···(2k−1)σ^{2k} (so μ₂ = σ², μ₄ = 3σ⁴); (4) Mean Deviation MD = √(2/π)·σ ≈ 0.7979σ ≈ (4/5)σ; (5) Quartiles Q₁ = μ − 0.6745σ, Q₃ = μ + 0.6745σ, so QD ≈ 0.6745σ ≈ (2/3)σ; (6) Ratio QD : MD : SD ≈ 10 : 12 : 15; (7) Reproductive property: if Xᵢ ~ N(μᵢ, σᵢ²) independently, then ∑aᵢXᵢ ~ N(∑aᵢμᵢ, ∑aᵢ²σᵢ²).","explanationE":"Notice that for any Normal variable, knowing any single dispersion metric (SD, MD, or QD) immediately recovers the other two via σ ≈ 1.2533·MD ≈ 1.4826·QD. Also note that variance adds even when subtracting two independent normals: Var(X − Y) = σ_X² + σ_Y².","illustrationI":"If resistor R₁ ~ N(100, 3²) Ω and R₂ ~ N(200, 4²) Ω are wired in series independently, total resistance R₁ + R₂ ~ N(300, 3² + 4²) = N(300, 5²) Ω—standard deviation is √(9 + 16) = 5 Ω, NOT 3 + 4 = 7 Ω.","applicationA":"Tolerance stack-up in electrical circuits, mechanical shaft-and-bearing clearance analysis, and establishing control limits (±3σ) in Statistical Quality Control.","derivationDR":{"title":"Derivation (DR): Mean E(X) = μ, Variance Var(X) = σ² & Mean Deviation MD ≈ 0.7979σ","goal":"Prove E(X) = μ, Var(X) = σ², and MD = √(2/π)σ directly from the Normal PDF.","steps":[{"step":1,"title":"Show E(Z) = 0 and E(X) = μ via Odd Symmetry","equation":"E(Z) = (1/√(2π)) ∫_{−∞}^∞ z · e^(−z²/2) dz = 0   ⇒   E(X) = E(μ + σZ) = μ + σ·0 = μ","note":"The integrand z·e^(−z²/2) is an odd function integrated over symmetric limits (−∞, ∞), so it vanishes identically."},{"step":2,"title":"Evaluate E(Z²) = 1 by Integration by Parts","equation":"E(Z²) = (1/√(2π)) ∫_{−∞}^∞ z · (z e^(−z²/2)) dz = (1/√(2π)) [ −z e^(−z²/2) ]_{−∞}^∞ + (1/√(2π)) ∫_{−∞}^∞ e^(−z²/2) dz = 0 + 1 = 1","note":"Using u = z, dv = z e^(−z²/2) dz ⇒ v = −e^(−z²/2), and the Gaussian integral ∫_{−∞}^∞ e^(−z²/2) dz = √(2π)."},{"step":3,"title":"Conclude Var(X) = σ²","equation":"Var(X) = Var(μ + σZ) = σ² · Var(Z) = σ² · [ E(Z²) − (E(Z))² ] = σ²(1 − 0) = σ²","note":"Since Variance is shift-invariant and scales by σ²."},{"step":4,"title":"Derive Mean Deviation About Mean (MD)","equation":"MD = E(|X − μ|) = σ E(|Z|) = (2σ/√(2π)) ∫_0^∞ z e^(−z²/2) dz = √(2/π) · σ · [ −e^(−z²/2) ]_0^∞ = √(2/π)·σ ≈ 0.7979σ","note":"Exploits even symmetry of |z|e^(−z²/2) and substitution u = z²/2."}],"result":"E(X) = μ,   Var(X) = σ²,   MD = √(2/π)σ ≈ 0.7979σ,   QD ≈ 0.6745σ."},"keyTakeawayN":"In theory/short-answer exams, remember the 10 : 12 : 15 rule (QD ≈ ⅔σ, MD ≈ ⅘σ, SD = σ) and that Var(X − Y) = σ₁² + σ₂² (always PLUS!)."},{"id":"ch6-sub-3","code":"6.3","title":"Computing Normal Probabilities & Measurement of Areas Under the Normal Curve","depths":["SD","D","I","E","A","N"],"definitionSD":"Computing a normal probability P(a ≤ X ≤ b) converts endpoints into standard z-scores z₁ = (a − μ)/σ and z₂ = (b − μ)/σ and measures the area under the Standard Normal density φ(z) between z₁ and z₂: P(a ≤ X ≤ b) = Φ(z₂) − Φ(z₁).","descriptionD":"Empirical Area Rule (68–95–99.7%): P(μ − σ ≤ X ≤ μ + σ) = 0.6827 (68.27%), P(μ − 2σ ≤ X ≤ μ + 2σ) = 0.9545 (95.45%), and P(μ − 3σ ≤ X ≤ μ + 3σ) = 0.9973 (99.73%). Two standard table conventions appear in PU exams: (1) Cumulative table Φ(z) = P(Z ≤ z) from −∞ to z; (2) Half-area table A(z) = P(0 ≤ Z ≤ z) from 0 to z, where Φ(z) = 0.5 + A(z) for z ≥ 0.","explanationE":"Because φ(z) is continuous, P(X = c) = 0, so P(X < b) = P(X ≤ b). For negative z, symmetry gives Φ(−z) = 1 − Φ(z) and A(−z) = A(z) on the left side of 0. When a and b sit on opposite sides of μ (like z₁ < 0 < z₂), ADD their half-areas: A(|z₁|) + A(z₂). When both sit on the same side of μ (0 < z₁ < z₂), SUBTRACT: A(z₂) − A(z₁).","illustrationI":"For PU Model Q10 (z₁ = −0.50, z₂ = +1.00), the two limits lie on opposite sides of the mean 0, so total area = A(0.50) + A(1.00) = 0.1915 + 0.3413 = 0.5328.","applicationA":"Quality control yield calculations, finding warranty limits or cutoff scores (inverse Z-lookup), and Normal approximation to Binomial B(n, p) with continuity correction ±0.5 when np ≥ 5 and nq ≥ 5.","keyTakeawayN":"Check which Z-table your exam booklet supplies! If table entry at z = 0 is 0.0000, it is half-area A(z) = P(0 ≤ Z ≤ z); if entry at z = 0 is 0.5000, it is cumulative Φ(z) = P(Z ≤ z)."},{"id":"ch6-sub-4","code":"6.4","title":"Student's t-Distribution and Its Application","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"If Z ~ N(0, 1) and V ~ χ²_ν are independent, the ratio T = Z / √(V / ν) follows Student's t-distribution with ν degrees of freedom. For a random sample of size n from a normal population N(μ, σ²) with unknown σ, t = (X̄ − μ) / (S / √n) follows a t-distribution with ν = n − 1 degrees of freedom.","descriptionD":"Properties of the t-curve: (1) Symmetric and bell-shaped around t = 0 (Mean = Median = Mode = 0 for ν > 1); (2) Flatter peak and noticeably heavier (\"fatter\") tails than Standard Normal N(0, 1) because estimating σ by S introduces extra uncertainty; (3) Variance = ν / (ν − 2) > 1 for ν > 2; (4) As ν → ∞ (practically n ≥ 30), the t-distribution converges rapidly to N(0, 1).","explanationE":"Student's t is the workhorse continuous distribution for small-sample engineering inference (n < 30) when the true population standard deviation σ is unknown and must be estimated by unbiased sample SD S = √[∑(xᵢ − x̄)² / (n − 1)].","illustrationI":"At 95% two-tailed confidence (α = 0.05), the Normal critical value is z₀.₀₂₅ = 1.96, whereas for n = 5 (ν = 4), t₀.₀₂₅,₄ = 2.776—wider tails require a larger multiplier to guarantee 95% coverage.","applicationA":"Small-sample confidence intervals for mean μ and difference of two means (Unit 7); single-sample t-test, two-sample pooled t-test, paired t-test (Unit 8); and testing significance of correlation coefficient r.","derivationDR":{"title":"Derivation (DR): Constructing Student's t Statistic from Z and χ²_{n−1}","goal":"Show how (X̄ − μ)/(S/√n) reduces to the canonical Z / √(V/ν) definition.","steps":[{"step":1,"title":"Standardize Sample Mean Using True σ","equation":"Z = (X̄ − μ) / (σ / √n) ~ N(0, 1)","note":"Valid exactly for any n when Xᵢ ~ N(μ, σ²)."},{"step":2,"title":"Identify Independent Chi-Square Pivot for Sample Variance","equation":"V = (n − 1)S² / σ² = ∑(Xᵢ − X̄)² / σ² ~ χ²_{n−1},   independent of X̄","note":"Degrees of freedom ν = n − 1 (1 df lost estimating μ by X̄)."},{"step":3,"title":"Substitute Z and V into Canonical Ratio T = Z / √(V/ν)","equation":"T = [ (X̄ − μ) / (σ/√n) ] / √[ ((n−1)S²/σ²) / (n−1) ] = (X̄ − μ) / (S / √n)","note":"The unknown σ cancels completely, yielding an observable pivot t ~ t_{n−1}."}],"result":"t = (X̄ − μ) / (S / √n) ~ t_{n−1},   with E(t) = 0 (ν > 1) and Var(t) = ν/(ν − 2) (ν > 2)."},"keyTakeawayN":"Always use df ν = n − 1 for a single sample and ν = n₁ + n₂ − 2 for two independent samples with equal unknown variances."},{"id":"ch6-sub-5","code":"6.5","title":"Chi-Square (χ²) Distribution and Its Application","depths":["SD","D","I","E","A","N"],"definitionSD":"If Z₁, Z₂, …, Z_ν are independent Standard Normal random variables N(0, 1), the sum of their squares χ² = ∑_{i=1}^ν Zᵢ² follows a Chi-Square distribution with ν degrees of freedom, having PDF f(x) = [1 / (2^(ν/2) Γ(ν/2))] · x^(ν/2 − 1) e^(−x/2) for x > 0.","descriptionD":"Properties of χ²_ν: (1) Strictly non-negative support x ∈ [0, ∞); (2) Positively (right) skewed, with skewness √(8/ν) decreasing as ν increases; (3) Mean = ν, Variance = 2ν, Mode = ν − 2 (for ν ≥ 2, else 0); (4) Additive property: if U ~ χ²_{ν₁} and V ~ χ²_{ν₂} independently, then U + V ~ χ²_{ν₁ + ν₂}; (5) Approaches Normal N(ν, 2ν) for large ν (> 30).","explanationE":"Unlike the symmetric Z and t curves, χ² is asymmetric and single-tailed toward positive values, so both lower and upper critical values (χ²_{1−α/2, ν} and χ²_{α/2, ν}) must be read separately when building two-sided confidence intervals for variance σ².","illustrationI":"For ν = 6 degrees of freedom, Mean = 6, Variance = 12 (SD = √12 ≈ 3.464), Mode = 6 − 2 = 4, and the upper 5% critical cutoff is χ²_{0.05, 6} = 12.592.","applicationA":"Chi-square test of goodness of fit (comparing observed vs. Binomial/Poisson/Normal expected frequencies), test of independence of attributes in r × c contingency tables (Model Q3, Unit 8), and confidence intervals/tests for population variance σ² via (n − 1)S²/σ² ~ χ²_{n−1}.","keyTakeawayN":"Remember the two-parameter moment shortcut: for χ²_ν, Mean = ν and Variance = 2ν (twice the degrees of freedom!)."}],"formulas":[{"id":"ch6-f-norm-pdf","category":"Location","quantity":"Normal & Standard Normal PDF","symbol":"f(x), φ(z)","formula":"f(x) = [1/(σ√(2π))] e^(−½[(x−μ)/σ]²);   φ(z) = (1/√(2π)) e^(−z²/2)","assumptionOrConstant":"1/√(2π) ≈ 0.39894; Z = (X − μ)/σ ~ N(0, 1); −∞ < x < ∞","unit":"Density (unit⁻¹)"},{"id":"ch6-f-norm-moments","category":"Location","quantity":"Normal Moments, Skewness & Kurtosis","symbol":"μ, β₁, β₂","formula":"Mean = Median = Mode = μ;   β₁ = 0;   β₂ = 3;   μ₄ = 3σ⁴","assumptionOrConstant":"All odd central moments μ_{2k+1} = 0; inflection points at μ ± σ","unit":"μ: data unit; β₁, β₂: dimensionless"},{"id":"ch6-f-norm-disp","category":"Location","quantity":"Normal Dispersion Ratios (10 : 12 : 15)","symbol":"QD, MD, σ","formula":"QD ≈ 0.6745σ ≈ (2/3)σ;   MD = √(2/π)σ ≈ 0.7979σ ≈ (4/5)σ","assumptionOrConstant":"Quartiles: Q₁ = μ − 0.6745σ, Q₃ = μ + 0.6745σ; σ ≈ 1.2533·MD ≈ 1.4826·QD","unit":"Same unit as X"},{"id":"ch6-f-norm-area","category":"Dispersion","quantity":"Empirical Rule & Area Under Curve","symbol":"Φ(z), A(z)","formula":"P(μ ± 1σ) = 68.27%;   P(μ ± 2σ) = 95.45%;   P(μ ± 3σ) = 99.73%","assumptionOrConstant":"P(a ≤ X ≤ b) = Φ(z₂) − Φ(z₁); Φ(−z) = 1 − Φ(z); Φ(z) = 0.5 + A(z) (z ≥ 0)","unit":"Probability ∈ [0, 1]"},{"id":"ch6-f-norm-sum","category":"Dispersion","quantity":"Linear Combination of Independent Normals","symbol":"aX ± bY","formula":"E(aX ± bY) = aμ₁ ± bμ₂;   Var(aX ± bY) = a²σ₁² + b²σ₂²","assumptionOrConstant":"Requires X and Y independent; variances ALWAYS add for X − Y","unit":"Mean: unit; Var: unit²"},{"id":"ch6-f-t-dist","category":"Properties & Constants","quantity":"Student's t-Distribution","symbol":"t_ν","formula":"t = (X̄ − μ) / (S / √n) ~ t_{n−1};   E(t) = 0;   Var(t) = ν / (ν − 2)","assumptionOrConstant":"ν = n − 1 (single sample); Var defined for ν > 2; converges to N(0,1) as ν → ∞","unit":"Dimensionless"},{"id":"ch6-f-chi-dist","category":"Properties & Constants","quantity":"Chi-Square Distribution & Moments","symbol":"χ²_ν","formula":"χ² = ∑ Zᵢ²;   E(χ²) = ν;   Var(χ²) = 2ν;   Mode = ν − 2 (ν ≥ 2)","assumptionOrConstant":"Support [0, ∞); additive: χ²_{ν₁} + χ²_{ν₂} ~ χ²_{ν₁+ν₂}; (n−1)S²/σ² ~ χ²_{n−1}","unit":"Dimensionless (≥ 0)"}],"categoryLabels":{"Location":"Normal Curve & Moments","Dispersion":"Areas & Linear Sums","Properties & Constants":"Student's t & Chi-Square"},"questions":[{"id":"pu-model-q10","tag":"PU Model Set · Group B, Q10","title":"Normal Probability: Breaking Strength of Wooden Beams","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"A certain type of wooden beam has a mean breaking strength of 1500 kgs and a standard deviation of 100 kgs. Find the relative frequency of all such beams whose breaking strengths lie between 1450 and 1600 kgs.","given":["Let X = breaking strength of a randomly chosen wooden beam (in kgs).","Mean μ = 1500 kgs, Standard Deviation σ = 100 kgs, so X ~ N(1500, 100²).","Required relative frequency: P(1450 ≤ X ≤ 1600)."],"steps":[{"heading":"Step 1: Convert Endpoints to Standard Normal Variates Z = (X − μ)/σ","work":["For lower limit x₁ = 1450 kgs:   z₁ = (1450 − 1500) / 100 = −50 / 100 = −0.50","For upper limit x₂ = 1600 kgs:   z₂ = (1600 − 1500) / 100 = +100 / 100 = +1.00"]},{"heading":"Step 2: Measure Area Under Standard Normal Curve (Opposite Sides of Mean 0)","work":["P(1450 ≤ X ≤ 1600) = P(−0.50 ≤ Z ≤ +1.00) = P(−0.50 ≤ Z ≤ 0) + P(0 ≤ Z ≤ 1.00)","By symmetry, P(−0.50 ≤ Z ≤ 0) = P(0 ≤ Z ≤ 0.50) = 0.19146 ≈ 0.1915","From Standard Normal table, P(0 ≤ Z ≤ 1.00) = 0.34134 ≈ 0.3413","Alternatively using cumulative Φ(z): Φ(1.00) − Φ(−0.50) = 0.8413 − (1 − 0.6915) = 0.8413 − 0.3085 = 0.5328"]},{"heading":"Step 3: Combine Areas","work":["P(1450 ≤ X ≤ 1600) = 0.1915 + 0.3413 = 0.5328  (exact: 0.532807)","Relative frequency percentage = 0.5328 × 100% = 53.28%"]}],"finalAnswer":["Relative frequency P(1450 ≤ X ≤ 1600) = 0.5328 (or 53.28% of all beams)"]},{"id":"ch6-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Forward & Inverse Normal Calculations: Precision Resistor Batch","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Normal Probability & Quantile Cutoff)","statement":"A manufacturing process produces precision resistors whose resistance R follows a normal distribution with mean μ = 100 Ω and standard deviation σ = 4 Ω. (a) What percentage of resistors are rejected if specifications require resistance between 94 Ω and 106 Ω? (b) Find the maximum resistance R₀ of the lowest 10% of resistors.","given":["R ~ N(μ = 100 Ω, σ = 4 Ω).","Acceptable tolerance band: [94 Ω, 106 Ω].","Standard Normal table values: A(1.50) = P(0 ≤ Z ≤ 1.50) = 0.4332; Φ(−1.2816) = 0.10 (standard z₀.₁₀ ≈ 1.28)."],"steps":[{"heading":"Part (a): Acceptance & Rejection Percentages for [94 Ω, 106 Ω]","work":["z₁ = (94 − 100) / 4 = −1.50,   z₂ = (106 − 100) / 4 = +1.50","P(94 ≤ R ≤ 106) = P(−1.50 ≤ Z ≤ +1.50) = 2 × P(0 ≤ Z ≤ 1.50) = 2 × 0.4332 = 0.8664 (86.64% accepted)","Rejection probability = 1 − 0.8664 = 0.1336  ⇒  13.36% rejected"]},{"heading":"Part (b): Inverse Lookup for Lowest 10% Cutoff R₀","work":["We need P(R ≤ R₀) = 0.10, which lies in the left tail below μ (so z₀ < 0).","Area between μ and R₀ is 0.50 − 0.10 = 0.4000  ⇒  from Z-table, A(1.28) = 0.3997 ≈ 0.4000 (exact z = −1.2816).","Using z₀ = −1.2816: R₀ = μ + z₀·σ = 100 + (−1.2816)(4) = 100 − 5.126 = 94.87 Ω  (with z₀ = −1.28: 94.88 Ω)"]}],"finalAnswer":["(a) Rejected resistors = 13.36% (0.1336)","(b) Maximum resistance of lowest 10% = 94.87 Ω (or 94.88 Ω using 2-decimal z = −1.28)"]},{"id":"ch6-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Recovering Unknown Mean (μ) & SD (σ) From Normal Tail Proportions","marks":"10 Marks Pattern","source":"Classic PU Engineering Exam Pattern (Simultaneous Normal Equations)","statement":"In a large batch of high-voltage capacitors whose breakdown voltage X is normally distributed, 10% fail below 40 kV and 20% withstand more than 70 kV. (a) Find the mean μ and standard deviation σ of breakdown voltage. (b) Estimate the percentage of capacitors with breakdown voltage between 50 kV and 65 kV.","given":["X ~ N(μ, σ²) with unknown μ and σ.","P(X < 40) = 0.10  (left tail area 0.10 ⇒ A(z) = 0.4000 on left).","P(X > 70) = 0.20  (right tail area 0.20 ⇒ A(z) = 0.3000 on right)."],"steps":[{"heading":"Step 1: Find Corresponding Standard Normal z-Scores","work":["For P(X < 40) = 0.10: z₁ = −1.2816  (approx −1.28 since A(1.28) = 0.3997)","For P(X > 70) = 0.20: P(0 ≤ Z ≤ z₂) = 0.50 − 0.20 = 0.3000  ⇒  z₂ = +0.8416  (approx +0.84 since A(0.84) = 0.2995)"]},{"heading":"Step 2: Set Up & Solve Simultaneous Equations for μ and σ","work":["(1) (40 − μ) / σ = −1.2816   ⇒   μ − 1.2816σ = 40","(2) (70 − μ) / σ = +0.8416   ⇒   μ + 0.8416σ = 70","Subtract (1) from (2): (0.8416 + 1.2816)σ = 30  ⇒  2.1232σ = 30  ⇒  σ = 14.13 kV  (14.15 kV with 2-dec z)","Substitute σ = 14.13 into (1): μ = 40 + 1.2816(14.13) = 40 + 18.11 = 58.11 kV"]},{"heading":"Step 3: Find P(50 ≤ X ≤ 65)","work":["z_a = (50 − 58.11) / 14.13 = −0.574  ⇒  A(0.574) ≈ 0.2170","z_b = (65 − 58.11) / 14.13 = +0.488  ⇒  A(0.488) ≈ 0.1872","P(50 ≤ X ≤ 65) = 0.2170 + 0.1872 = 0.4042 (40.42%)"]}],"finalAnswer":["(a) Mean μ = 58.11 kV,   Standard Deviation σ = 14.13 kV","(b) Proportion between 50 kV and 65 kV = 40.42% (0.4042)"]}],"traps":[{"id":"ch6-trap-sign-1","category":"Sign Convention","title":"Using Wrong Sign on z-Score for Left-Tail Inverse Lookup","wrongApproach":"For \"lowest 10% of items\", setting z = +1.28 instead of −1.28, giving a cutoff ABOVE the mean.","correctRule":"Anything below the 50th percentile (left of μ) MUST have a NEGATIVE z-score. Write x = μ + zσ with z < 0.","examTip":"Sanity check: if the problem asks for the lowest 10%, your final x must be strictly less than μ!"},{"id":"ch6-trap-sign-2","category":"Sign Convention","title":"Subtracting Variances When Computing X − Y for Independent Normals","wrongApproach":"Writing Var(X − Y) = σ_X² − σ_Y² instead of σ_X² + σ_Y².","correctRule":"For independent random variables, Var(aX ± bY) = a²σ_X² + b²σ_Y²—variances ALWAYS ADD, even when subtracting X − Y!","examTip":"Remember Var(−Y) = (−1)²Var(Y) = +σ_Y²."},{"id":"ch6-trap-geom-1","category":"Boundary & Slope Geometry","title":"Half-Area Table A(z) vs. Cumulative Table Φ(z) Confusion","wrongApproach":"Reading P(0 ≤ Z ≤ 1.00) = 0.3413 from a half-area table and treating it as P(Z ≤ 1.00), or adding 0.5 twice when limits span 0.","correctRule":"Same side of μ (0 < z₁ < z₂): SUBTRACT A(z₂) − A(z₁). Opposite sides of μ (z₁ < 0 < z₂): ADD A(|z₁|) + A(z₂). With cumulative Φ(z): always Φ(z₂) − Φ(z₁).","examTip":"Look at the table value at z = 0.00 first: 0.0000 means half-area A(z); 0.5000 means cumulative Φ(z)."},{"id":"ch6-trap-geom-2","category":"Boundary & Slope Geometry","title":"Confusing Normal Inflection Points (μ ± σ) with Control Limits (μ ± 3σ)","wrongApproach":"Stating that the normal curve inflection points lie at μ ± 2σ or at 0.6745σ (which are quartiles).","correctRule":"Points of inflection (f″(x) = 0) lie at μ ± σ (68.27% area); Quartiles lie at μ ± 0.6745σ (50% area); Practical 3σ span lies at μ ± 3σ (99.73% area).","examTip":"PU examiners frequently ask a 2-mark/5-mark theory question on properties and points of inflection of the normal curve."},{"id":"ch6-trap-pu-1","category":"High-Yield PU Topic","title":"Simultaneous Equations for Unknown μ and σ (10-Mark Classic)","wrongApproach":"Using the given percentage directly as z (e.g., plugging 0.10 as z instead of looking up the inverse z = −1.28).","correctRule":"Convert each given tail percentage into its standard normal z-score FIRST, then solve (x₁ − μ)/σ = z₁ and (x₂ − μ)/σ = z₂.","examTip":"Draw two shaded tail sketches so you never mix up \"10% below x₁\" (z₁ < 0) with \"20% above x₂\" (z₂ > 0)."},{"id":"ch6-trap-pu-2","category":"High-Yield PU Topic","title":"Comparing Normal, Student's t, and Chi-Square Properties","wrongApproach":"Applying z = 1.96 for n < 30 with unknown σ, or forgetting that χ² has Mean = ν and Variance = 2ν.","correctRule":"Use t_{n−1} whenever n < 30 and σ is unknown (t is symmetric, heavier-tailed, Var = ν/(ν−2)). Use χ²_ν on [0, ∞) with Mean = ν, Var = 2ν.","examTip":"Unit 6 carries 10/60 marks in PU—expect one Normal area/inverse numerical (like Model Q10) plus t/χ² properties or a second Normal problem."}]},"ch7":{"id":"ch7","shortLabel":"Ch 7 · Estimation","unitLabel":"Unit 7","formulaUnitLabel":"Chapter 7","headline":"Probability & Statistics — Unit 7: Estimation","intro":"B.E. Exam-mastery reference covering sampling, unbiased/consistent/efficient/sufficient estimators, standard error, confidence intervals (means & proportions), and sample size determination.","weightage":"5 / 60 Marks","hours":"4 Hours","derivations":"3 Step-by-Step","solvedCount":"Model Q8, Q12b + 2 Extra","solvedSubtitle":"Complete step-by-step solutions for every Unit 7 question in the attached 2024 PU Model Question Set (Group B Q8 & Q12b), plus two high-yield confidence interval & sample size numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 7: Estimation","lectureHours":"4 Hrs","finalMarks":5,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Concept of sample, sampling, determination of sample size, population, statistic, parameter","Estimation and its types (point & interval estimation); criteria for good estimator","Confidence interval and standard error","Confidence interval for single mean and for the difference of two means","Confidence interval for single proportion and for the difference of two proportions"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF (pp. 3–6), Unit 7 is allocated 4 lecture hours and 5/60 final exam marks (Model Q8 & Q12b on p. 9; note Detailed Contents p. 6 explicitly includes \"sampling, determination of sample size\"). Every subtopic is covered across SD, D, DR, I, E, A, and N with step-by-step derivations."},"notes":[{"id":"ch7-sub-1","code":"7.1","title":"Population, Sample, Sampling, Parameter, Statistic & Sample Size Determination","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A Population is the complete totality of all units under study (size N), described by fixed unknown constants called Parameters (μ, σ², P). A Sample is a representative subset of size n selected via Sampling, whose numerical summaries are random variables called Statistics (x̄, s², p̂).","descriptionD":"Because a statistic varies from sample to sample, it forms a Sampling Distribution characterized by its Standard Error (SE)—the standard deviation of that statistic. Before collecting data, engineers determine the required Sample Size n to bound the maximum allowable Margin of Error E at confidence level 100(1 − α)%.","explanationE":"For estimating mean μ within ±E when σ is known: n = (z_{α/2}·σ / E)². For estimating proportion p within ±E: n = z_{α/2}²·p̂q̂ / E². If no prior estimate p̂ is available, use the worst-case maximum p̂q̂ = 0.5 × 0.5 = 0.25, giving n = z_{α/2}² / (4E²). ALWAYS round n UP to the next whole integer.","illustrationI":"To estimate mean transformer oil breakdown voltage within E = ±1.5 kV at 95% confidence (z = 1.96) with σ = 6 kV, n = (1.96 × 6 / 1.5)² = (7.84)² = 61.47 ⇒ we must test at least n = 62 samples (never round down to 61).","applicationA":"Sizing reliability test batches, quality inspection plans, opinion polls, and engineering sensor calibration campaigns.","derivationDR":{"title":"Derivation (DR): Sample Size Formula n = (z_{α/2}·σ / E)² and Worst-Case Proportion Bound","goal":"Derive minimum sample size n directly from maximum allowable Margin of Error E.","steps":[{"step":1,"title":"Set Margin of Error E Equal to Half-Width of Confidence Interval","equation":"E = | X̄ − μ |_{max} = z_{α/2} · SE(X̄) = z_{α/2} · (σ / √n)","note":"Solve algebraically for √n:"},{"step":2,"title":"Isolate n for Mean Estimation","equation":"√n = (z_{α/2} · σ) / E   ⇒   n = [ (z_{α/2} · σ) / E ]²","note":"Always apply ceiling ⌈n⌉ because n − 1 would violate the error bound E."},{"step":3,"title":"Derive Proportion Sample Size & Conservative Maximum pq ≤ 0.25","equation":"E = z_{α/2} √(pq / n)   ⇒   n = (z_{α/2}² · p · q) / E²","note":"Since p(1 − p) = ¼ − (p − ½)² attains its maximum ¼ = 0.25 at p = 0.5, the worst-case bound is n = z_{α/2}² / (4E²)."}],"result":"n_mean = ⌈ (z_{α/2}·σ / E)² ⌉,   n_prop = ⌈ z_{α/2}² pq / E² ⌉ ≤ ⌈ z_{α/2}² / (4E²) ⌉."},"keyTakeawayN":"Remember two rules: (1) Cutting Margin of Error E in HALF requires 4× the sample size n; (2) Always round fractional n UP."},{"id":"ch7-sub-2","code":"7.2","title":"Estimation Types & Criteria for a Good Estimator","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Statistical Estimation infers unknown population parameters (θ) from sample data. It has two forms: Point Estimation (a single numerical value θ̂ = T(X₁,…,Xₙ)) and Interval Estimation (a random range [L, U] constructed to capture θ with stated probability 1 − α).","descriptionD":"Four Classical Criteria for a Good Point Estimator θ̂: (1) Unbiasedness: E(θ̂) = θ across repeated samples; (2) Consistency: θ̂ₙ converges in probability to θ as n → ∞ (sufficient conditions: bias → 0 and Var(θ̂ₙ) → 0); (3) Efficiency: among all unbiased estimators, θ̂ has the smallest variance (MVUE); (4) Sufficiency: θ̂ extracts all information about θ contained in the sample.","explanationE":"Sample mean X̄ and sample proportion p̂ = X/n are unbiased, consistent, and efficient estimators of μ and p. Crucially, the naive sample variance (1/n)∑(Xᵢ − X̄)² is BIASED downward by (n − 1)/n, which is why Bessel's correction S² = [1/(n − 1)]∑(Xᵢ − X̄)² is used as the unbiased estimator of σ².","illustrationI":"Both sample mean X̄ and sample median are unbiased and consistent for the center μ of a Normal population N(μ, σ²), yet Var(X̄) = σ²/n while Var(Median) ≈ 1.57·σ²/n—making X̄ more efficient (relative efficiency ≈ 63.7% for median vs. mean).","applicationA":"Choosing optimal estimators in signal estimation (Kalman/least-squares filtering), reliability engineering (MTBF estimation), and PU theory short notes (Model Q12b).","derivationDR":{"title":"Derivation (DR): Unbiasedness of X̄ and Why S² Requires Denominator (n − 1)","goal":"Prove E(X̄) = μ and E[ ∑(Xᵢ − X̄)² ] = (n − 1)σ², establishing S² = ∑(Xᵢ − X̄)²/(n − 1) as unbiased.","steps":[{"step":1,"title":"Prove Unbiasedness & Consistency of Sample Mean X̄","equation":"E(X̄) = (1/n) ∑_{i=1}^n E(Xᵢ) = (1/n)(nμ) = μ;   Var(X̄) = (1/n²) ∑ σ² = σ²/n → 0 as n → ∞","note":"E(X̄) = μ proves Unbiasedness; Var(X̄) → 0 additionally proves Consistency."},{"step":2,"title":"Expand Sum of Squared Deviations About X̄","equation":"∑(Xᵢ − X̄)² = ∑[ (Xᵢ − μ) − (X̄ − μ) ]² = ∑(Xᵢ − μ)² − n(X̄ − μ)²","note":"Cross-term −2(X̄ − μ)∑(Xᵢ − μ) equals −2n(X̄ − μ)², combining cleanly."},{"step":3,"title":"Take Expectation Term by Term","equation":"E[ ∑(Xᵢ − X̄)² ] = ∑ E[(Xᵢ − μ)²] − n·E[(X̄ − μ)²] = nσ² − n(σ²/n) = (n − 1)σ²","note":"Dividing by n gives (n − 1)σ²/n ≠ σ² (biased); dividing by (n − 1) gives E(S²) = σ²!"}],"result":"E(X̄) = μ (unbiased)   and   E[ ∑(Xᵢ − X̄)² / (n − 1) ] = σ² (unbiased)."},"keyTakeawayN":"For Model Q12(b) short notes on Estimation, ALWAYS state: Definition + Point vs. Interval Estimation + the 4 Good Estimator Criteria (U-C-E-S) + Standard Error."},{"id":"ch7-sub-3","code":"7.3","title":"Standard Error & Confidence Intervals for Mean (μ) and Difference of Two Means (μ₁ − μ₂)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A 100(1 − α)% Confidence Interval (CI) for a parameter θ is a random interval [L, U] = θ̂ ± (Critical Value × Standard Error) constructed so that in repeated sampling, 100(1 − α)% of such intervals contain the true parameter θ.","descriptionD":"Single Mean μ: (a) Known σ or large sample (n ≥ 30): x̄ ± z_{α/2}·(σ/√n) (using s if σ unknown and n ≥ 30); (b) Small sample (n < 30, unknown σ, normal population): x̄ ± t_{α/2, n−1}·(s/√n). Difference of Two Means (μ₁ − μ₂): (a) Large independent samples: (x̄₁ − x̄₂) ± z_{α/2}·√(σ₁²/n₁ + σ₂²/n₂); (b) Small independent samples with equal unknown variances: (x̄₁ − x̄₂) ± t_{α/2, n₁+n₂−2} · s_p√(1/n₁ + 1/n₂), where s_p² = [(n₁−1)s₁² + (n₂−1)s₂²]/(n₁ + n₂ − 2).","explanationE":"Key Confidence Constants (two-tailed z_{α/2}): 90% → 1.645; 95% → 1.96; 98% → 2.326 (or 2.33); 99% → 2.576 (or 2.58). Higher confidence (99% vs. 95%) widens the interval; larger sample size n narrows it by 1/√n. Note the PU syllabus wording \"confidential interval of mean for mean\" simply refers to the confidence interval for μ.","illustrationI":"Comparing Brand A (n₁=10, x̄₁=1420, s₁=60) and Brand B (n₂=12, x̄₂=1350, s₂=50) LED lifetimes gives pooled s_p = 54.73 hrs, t_{0.025,20} = 2.086, and 95% CI for (μ₁ − μ₂) = (21.12, 118.88) hrs. Because 0 lies outside this interval, Brand A is demonstrably longer-lasting.","applicationA":"Reporting measurement uncertainty tolerances, A/B reliability benchmarking between two suppliers, and clinical/biomedical device efficacy intervals.","derivationDR":{"title":"Derivation (DR): 100(1 − α)% Confidence Interval for Population Mean μ","goal":"Derive the exact interval [ x̄ − z_{α/2}σ/√n, x̄ + z_{α/2}σ/√n ] from the Standard Normal pivot.","steps":[{"step":1,"title":"Write Probability Statement for Pivotal Quantity Z","equation":"P( −z_{α/2} ≤ (X̄ − μ) / (σ / √n) ≤ +z_{α/2} ) = 1 − α","note":"Because X̄ ~ N(μ, σ²/n) (or approximately so for n ≥ 30 by Central Limit Theorem)."},{"step":2,"title":"Multiply Through by Positive Standard Error σ/√n","equation":"P( −z_{α/2}·(σ/√n) ≤ X̄ − μ ≤ +z_{α/2}·(σ/√n) ) = 1 − α","note":"Inequality directions stay unchanged since σ/√n > 0."},{"step":3,"title":"Isolate Unknown Parameter μ in the Center","equation":"P( X̄ − z_{α/2}·(σ/√n) ≤ μ ≤ X̄ + z_{α/2}·(σ/√n) ) = 1 − α","note":"Replacing random variable X̄ with observed sample mean x̄ yields the realized 100(1 − α)% CI."}],"result":"CI(μ) = x̄ ± z_{α/2}·(σ / √n)   (or   x̄ ± t_{α/2, n−1}·(s / √n)   when n < 30, σ unknown)."},"keyTakeawayN":"Decision tree: n ≥ 30 or σ known ⇒ Z-interval; n < 30 and σ unknown ⇒ t-interval! Check if variance is small-sample pooled before computing."},{"id":"ch7-sub-4","code":"7.4","title":"Confidence Intervals for Proportion (p) and Difference of Two Proportions (p₁ − p₂)","depths":["SD","D","I","E","A","N"],"definitionSD":"For a large random sample of size n with x successes (p̂ = x/n, q̂ = 1 − p̂), the 100(1 − α)% Wald Confidence Interval for population proportion p is p̂ ± z_{α/2}√(p̂q̂ / n). For two independent large samples, the CI for (p₁ − p₂) is (p̂₁ − p̂₂) ± z_{α/2}√(p̂₁q̂₁/n₁ + p̂₂q̂₂/n₂).","descriptionD":"These intervals rely on the Normal approximation to Binomial X ~ B(n, p), requiring large samples (typically np̂ ≥ 5 and nq̂ ≥ 5). If sampling without replacement from a finite population of size N where sampling fraction n/N > 5% (0.05), multiply the standard error by the Finite Population Correction (FPC) factor √[(N − n)/(N − 1)].","explanationE":"Because a true proportion p must physically satisfy 0 ≤ p ≤ 1, whenever the lower confidence limit p̂ − E turns negative (which happens in PU Model Q8 at 99% confidence!) or the upper limit exceeds 1, report the algebraic value and truncate to [0, 1]. Notice also that in hypothesis testing of p₁ = p₂ (Unit 8), a pooled p̄ is used in SE, whereas in Confidence Intervals (Unit 7), NO pooling is done—each sample keeps p̂₁q̂₁/n₁ and p̂₂q̂₂/n₂ separately!","illustrationI":"In PU Model Q8 (n = 100, x = 5 defectives), p̂ = 0.05, q̂ = 0.95, and SE = √(0.05 × 0.95 / 100) = 0.02179. At 95% (z = 1.96), CI = (0.0073, 0.0927). At 99% (z = 2.576), p̂ − E = −0.0061, so the physical 99% CI is [0, 0.1061].","applicationA":"Lot defective-rate estimation in electronics QA (Model Q8), network packet-loss confidence bounds, and comparing two manufacturing lines.","keyTakeawayN":"In Confidence Intervals for p₁ − p₂, NEVER pool p̂₁ and p̂₂ (pooling is ONLY for H₀: p₁ = p₂ hypothesis tests in Unit 8)!"}],"formulas":[{"id":"ch7-f-good-est","category":"Location","quantity":"Unbiased Estimators (X̄, p̂, S²)","symbol":"θ̂, S²","formula":"E(X̄) = μ;   E(p̂) = p;   S² = ∑(xᵢ − x̄)² / (n − 1)  ⇒  E(S²) = σ²","assumptionOrConstant":"Sample variance divides by (n − 1), NOT n, to avoid −σ²/n bias","unit":"Same unit (or unit²)"},{"id":"ch7-f-se","category":"Location","quantity":"Standard Error (Mean & Proportion)","symbol":"SE(X̄), SE(p̂)","formula":"SE(X̄) = σ / √n  (or s/√n);   SE(p̂) = √(p̂q̂ / n)","assumptionOrConstant":"Multiply by FPC √[(N−n)/(N−1)] if population size N finite and n/N > 0.05","unit":"Mean: unit; Prop: dimensionless"},{"id":"ch7-f-sample-size","category":"Location","quantity":"Sample Size Determination","symbol":"n","formula":"n_mean = ⌈ (z_{α/2}·σ / E)² ⌉;   n_prop = ⌈ z_{α/2}²·p̂q̂ / E² ⌉ ≤ ⌈ z_{α/2}² / (4E²) ⌉","assumptionOrConstant":"Use p̂ = q̂ = 0.5 when no pilot proportion is known; ALWAYS round UP","unit":"Integer count (samples)"},{"id":"ch7-f-ci-mean","category":"Dispersion","quantity":"Confidence Interval for Single Mean (μ)","symbol":"CI(μ)","formula":"Large/known σ: x̄ ± z_{α/2}(σ/√n);   Small/unknown σ: x̄ ± t_{α/2, n−1}(s/√n)","assumptionOrConstant":"z vs t split at n ≥ 30 vs n < 30 (unknown σ, normal population)","unit":"Data unit"},{"id":"ch7-f-ci-diff-mean","category":"Dispersion","quantity":"CI for Difference of Two Means (μ₁ − μ₂)","symbol":"CI(μ₁ − μ₂)","formula":"Large: (x̄₁ − x̄₂) ± z_{α/2}√(σ₁²/n₁ + σ₂²/n₂);   Small: (x̄₁ − x̄₂) ± t_{α/2,ν}·s_p√(1/n₁ + 1/n₂)","assumptionOrConstant":"Pooled s_p² = [(n₁−1)s₁² + (n₂−1)s₂²]/(n₁+n₂−2), ν = n₁ + n₂ − 2","unit":"Data unit"},{"id":"ch7-f-ci-prop","category":"Properties & Constants","quantity":"CI for Single & Two Proportions","symbol":"CI(p), CI(p₁ − p₂)","formula":"Single: p̂ ± z_{α/2}√(p̂q̂/n);   Diff: (p̂₁ − p̂₂) ± z_{α/2}√(p̂₁q̂₁/n₁ + p̂₂q̂₂/n₂)","assumptionOrConstant":"No pooling in CI(p₁ − p₂); clip single proportion limits inside [0, 1]","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch7-f-z-crit","category":"Properties & Constants","quantity":"Standard Two-Tailed Confidence Constants","symbol":"z_{α/2}","formula":"90%: 1.645;   95%: 1.96;   98%: 2.326 (2.33);   99%: 2.576 (2.58)","assumptionOrConstant":"Used for large samples (n ≥ 30), known σ, and all proportion CIs","unit":"Dimensionless"}],"categoryLabels":{"Location":"Estimators & Sample Size","Dispersion":"Mean & Two-Mean CIs","Properties & Constants":"Proportions & Critical z"},"questions":[{"id":"pu-model-q8","tag":"PU Model Set · Group B, Q8","title":"95% and 99% Confidence Limits for Proportion of Defective Items","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"A random sample of 100 items drawn from a large batch of articles contain 5 defective items. Find 95% and 99% confidence limits for the proportion of defective items.","given":["Sample size n = 100 (large batch ⇒ no FPC needed, and n ≥ 30 ⇒ Z-interval applies).","Number of defectives x = 5.","Sample proportion p̂ = x / n = 5 / 100 = 0.05;   q̂ = 1 − p̂ = 0.95.","Critical z-values: z₀.₀₂₅ = 1.96 (95% CI);   z₀.₀₀₅ = 2.576 (or 2.58 in 2-dec tables for 99% CI)."],"steps":[{"heading":"Step 1: Compute Standard Error of Sample Proportion SE(p̂)","work":["SE(p̂) = √(p̂ · q̂ / n) = √(0.05 × 0.95 / 100) = √(0.0475 / 100) = √0.000475 = 0.021794"]},{"heading":"Step 2: 95% Confidence Limits for Population Proportion p","work":["Margin of Error E₉₅ = z₀.₀₂₅ · SE(p̂) = 1.96 × 0.021794 = 0.042717 ≈ 0.0427","Lower 95% limit = p̂ − E₉₅ = 0.05 − 0.042717 = 0.007283 ≈ 0.0073  (0.73%)","Upper 95% limit = p̂ + E₉₅ = 0.05 + 0.042717 = 0.092717 ≈ 0.0927  (9.27%)"]},{"heading":"Step 3: 99% Confidence Limits (Showing Physical [0, 1] Boundary Handling)","work":["Using z₀.₀₀₅ = 2.576:   E₉₉ = 2.576 × 0.021794 = 0.056143 ≈ 0.0561","Algebraic limits: 0.05 ± 0.056143 = (−0.00614,  0.10614)","Because a proportion p cannot be negative (0 ≤ p ≤ 1), truncate lower limit at 0:","Physical 99% CI = [0, 0.1061]  (or [0, 0.1062] if using 2-decimal z = 2.58 where E = 0.05623)"]}],"finalAnswer":["95% Confidence Limits: (0.0073, 0.0927)  or  [0.73%, 9.27%]","99% Confidence Limits: [0, 0.1061]  (algebraic lower limit −0.0061 clipped to 0; 0.1062 with z = 2.58)"]},{"id":"pu-model-q12b","tag":"PU Model Set · Group B, Q12(b)","title":"Short Notes: Statistical Estimation, Estimator Criteria & Confidence Intervals","marks":"2.5 Marks (Half of Q12)","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"Write short notes on the following: (b) Estimation.","given":["Aim: Summarize all core Unit 7 concepts cleanly in crisp PU short-note format."],"steps":[{"heading":"1. Definition & Purpose","work":["Statistical estimation is the branch of inferential statistics that determines approximate values or plausible ranges for unknown population parameters (such as μ, σ², or p) using observed sample statistics (x̄, s², p̂)."]},{"heading":"2. Two Types of Estimation","work":["(i) Point Estimation: Produces a single numerical estimate θ̂ of the parameter θ (e.g., x̄ = 90 as a point estimate of μ), without indicating precision.","(ii) Interval Estimation: Constructs a range [L, U] = θ̂ ± (Critical Value × Standard Error) expected to capture θ with confidence level 100(1 − α)% (e.g., 95%)."]},{"heading":"3. Four Criteria for a Good Estimator","work":["(i) Unbiasedness: E(θ̂) = θ (expected value equals the true parameter).","(ii) Consistency: θ̂ₙ → θ in probability as sample size n → ∞ (Var(θ̂ₙ) → 0).","(iii) Efficiency: Has the minimum variance among all unbiased estimators.","(iv) Sufficiency: Uses all relevant information contained in the sample regarding θ."]}],"finalAnswer":["Key summary: Point Estimate gives one value (θ̂); Interval Estimate gives θ̂ ± Margin of Error at confidence (1 − α); an ideal estimator is Unbiased, Consistent, Efficient, and Sufficient."]},{"id":"ch7-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Small-Sample t-Confidence Interval for Difference of Two Means (Pooled s_p)","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Two-Mean Confidence Interval with n < 30)","statement":"To compare the operating life of two LED bulb brands, a test yields Brand A: n₁ = 10, x̄₁ = 1420 hrs, s₁ = 60 hrs; Brand B: n₂ = 12, x̄₂ = 1350 hrs, s₂ = 50 hrs. Assuming both populations are normal with equal variances, construct a 95% confidence interval for the true difference in mean lifetimes (μ₁ − μ₂).","given":["Sample 1 (Brand A): n₁ = 10, x̄₁ = 1420 hrs, s₁ = 60 hrs.","Sample 2 (Brand B): n₂ = 12, x̄₂ = 1350 hrs, s₂ = 50 hrs.","Small samples (n₁, n₂ < 30), equal unknown variances ⇒ pooled t-interval with ν = n₁ + n₂ − 2 = 20 df.","From t-table at α = 0.05 (two-tailed), ν = 20: t₀.₀₂₅,₂₀ = 2.086."],"steps":[{"heading":"Step 1: Compute Pooled Sample Variance s_p² and Standard Deviation s_p","work":["s_p² = [ (n₁ − 1)s₁² + (n₂ − 1)s₂² ] / (n₁ + n₂ − 2)","s_p² = [ 9(60²) + 11(50²) ] / 20 = [ 9(3600) + 11(2500) ] / 20 = (32400 + 27500) / 20 = 59900 / 20 = 2995","s_p = √2995 = 54.7266 hrs"]},{"heading":"Step 2: Compute Standard Error & Margin of Error","work":["SE(x̄₁ − x̄₂) = s_p · √(1/n₁ + 1/n₂) = 54.7266 · √(1/10 + 1/12) = 54.7266 × 0.428174 = 23.4325 hrs","Margin of Error E = t₀.₀₂₅,₂₀ · SE = 2.086 × 23.4325 = 48.880 hrs"]},{"heading":"Step 3: Construct 95% Confidence Interval for μ₁ − μ₂","work":["Point estimate: x̄₁ − x̄₂ = 1420 − 1350 = 70.00 hrs","95% CI = 70.00 ± 48.88 = (21.12, 118.88) hrs","Since 0 is NOT inside (21.12, 118.88), Brand A has a significantly higher mean lifetime at 95% confidence."]}],"finalAnswer":["Pooled s_p = 54.73 hrs;   95% CI for (μ₁ − μ₂) = (21.12, 118.88) hours"]},{"id":"ch7-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Sample Size Determination & Difference of Two Proportions CI","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Sample Size & Two-Proportion Interval)","statement":"(a) An electrical engineer needs to estimate the mean breakdown voltage of transformer oil within ±1.5 kV at 95% confidence. Past records give σ = 6 kV. What minimum sample size is required? (b) In cable quality audits, Supplier 1 showed 18 defective segments out of 200 and Supplier 2 showed 10 defective segments out of 250. Find the 95% confidence interval for the difference of defective proportions (p₁ − p₂).","given":["Part (a): Margin of error E = 1.5 kV, σ = 6 kV, confidence = 95% (z₀.₀₂₅ = 1.96).","Part (b): n₁ = 200, x₁ = 18 ⇒ p̂₁ = 0.09, q̂₁ = 0.91;   n₂ = 250, x₂ = 10 ⇒ p̂₂ = 0.04, q̂₂ = 0.96."],"steps":[{"heading":"Part (a): Minimum Sample Size n","work":["n = [ (z_{α/2} · σ) / E ]² = [ (1.96 × 6) / 1.5 ]² = (7.84)² = 61.4656","Always round UP to guarantee error ≤ 1.5 kV  ⇒  n = 62 samples"]},{"heading":"Part (b): 95% Confidence Interval for (p₁ − p₂)","work":["Point estimate: p̂₁ − p̂₂ = 0.09 − 0.04 = 0.05","SE(p̂₁ − p̂₂) = √( p̂₁q̂₁/n₁ + p̂₂q̂₂/n₂ ) = √( (0.09 × 0.91)/200 + (0.04 × 0.96)/250 )","SE = √(0.0004095 + 0.0001536) = √0.0005631 = 0.023730","Margin of Error E = 1.96 × 0.023730 = 0.04651 ≈ 0.0465","95% CI = 0.05 ± 0.0465 = (0.0035, 0.0965)  or  [0.35%, 9.65%]"]}],"finalAnswer":["(a) Minimum sample size required n = 62 tests","(b) 95% CI for (p₁ − p₂) = (0.0035, 0.0965)  or  [0.35%, 9.65%]"]}],"traps":[{"id":"ch7-trap-sign-1","category":"Sign Convention","title":"Reporting a Negative Lower Limit for Proportion Confidence Interval (Model Q8!)","wrongApproach":"Writing 99% CI = (−0.0061, 0.1061) as the final proportion answer without noting physical bounds.","correctRule":"A true proportion p ∈ [0, 1]. If p̂ − E < 0 (as in PU Model Q8 at 99% confidence), state the algebraic limit and explicitly truncate the lower bound to 0: [0, 0.1061].","examTip":"Examiners love Model Q8 specifically because p̂ = 0.05 is small enough that 99% Wald lower bound crosses zero!"},{"id":"ch7-trap-sign-2","category":"Sign Convention","title":"Dividing Sample Variance by n Instead of (n − 1) in Small-Sample t-Intervals","wrongApproach":"Using biased sample variance σ̂² = ∑(xᵢ − x̄)²/n when calculating t-confidence intervals.","correctRule":"Unbiased sample variance S² ALWAYS divides by (n − 1). If a problem gives s computed with denominator n, convert via S = s·√[n/(n − 1)] before applying t.","examTip":"Verify whether raw data or precomputed s is given—with raw data, always use n − 1."},{"id":"ch7-trap-geom-1","category":"Boundary & Slope Geometry","title":"Using z_{α} (One-Tailed) Instead of z_{α/2} (Two-Tailed) for Confidence Intervals","wrongApproach":"Using z = 1.645 for a 95% confidence interval instead of 1.96.","correctRule":"Two-sided confidence intervals split α equally across BOTH tails (α/2 each side): 90% → 1.645, 95% → 1.96, 99% → 2.576 (2.58).","examTip":"Sketch the curve with α/2 in each tail so you never accidentally pull a one-tailed critical value."},{"id":"ch7-trap-geom-2","category":"Boundary & Slope Geometry","title":"Pooling Proportions in a Confidence Interval for (p₁ − p₂)","wrongApproach":"Computing p̄ = (x₁ + x₂)/(n₁ + n₂) when building a CI for p₁ − p₂.","correctRule":"NEVER pool proportions for a Confidence Interval—use √(p̂₁q̂₁/n₁ + p̂₂q̂₂/n₂). Pooled p̄ is ONLY used in Unit 8 hypothesis tests under H₀: p₁ = p₂.","examTip":"Contrast clearly: Unit 7 CI keeps separate p̂₁ and p̂₂; Unit 8 z-test pools p̄."},{"id":"ch7-trap-pu-1","category":"High-Yield PU Topic","title":"Rounding Fractional Sample Size n Down Instead of Up","wrongApproach":"Obtaining n = 61.47 and rounding to n = 61 (or 61.1 → 61).","correctRule":"Always take the ceiling ⌈n⌉ (e.g., 61.01 → 62), because any smaller integer makes the Margin of Error strictly larger than the specified bound E.","examTip":"Write the unrounded value (61.47) then state \"Rounding up to ensure E ≤ 1.5 kV: n = 62\"."},{"id":"ch7-trap-pu-2","category":"High-Yield PU Topic","title":"Model Q8 & Q12(b): Mastering Both Numerical Proportions & Estimation Theory","wrongApproach":"Writing only \"Point and Interval\" for Q12(b) without stating Unbiasedness, Consistency, Efficiency, Sufficiency, and Standard Error.","correctRule":"Even though Unit 7 carries 5/60 marks, PU Model Set pairs a proportion CI numerical (Q8) with short notes on Estimation (Q12b)—memorize the 4 U-C-E-S criteria cold.","examTip":"Checking whether 0 lies inside a (μ₁ − μ₂) or (p₁ − p₂) CI earns bonus clarity in engineering conclusions."}]},"ch8":{"id":"ch8","shortLabel":"Ch 8 · Hypothesis","unitLabel":"Unit 8","formulaUnitLabel":"Chapter 8","headline":"Probability & Statistics — Unit 8: Testing of Hypothesis","intro":"B.E. Exam-mastery reference covering null/alternative hypotheses, Type I & II errors, α & df, z-tests, t-tests (single, two-sample & paired), and chi-square (χ²) goodness-of-fit & independence tests.","weightage":"15 / 60 Marks","hours":"8 Hours","derivations":"3 Step-by-Step","solvedCount":"Model Q3, Q9 + 2 Extra","solvedSubtitle":"Complete step-by-step solutions for every Unit 8 question in the attached 2024 PU Model Question Set (Group A Q3 & Group B Q9), plus two high-yield paired-t, two-proportion Z & Goodness-of-Fit numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 8: Testing of Hypothesis","lectureHours":"8 Hrs","finalMarks":15,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Concept of hypothesis testing; hypothesis and its types, level of significance, degree of freedom, error in testing of hypothesis","z-test: for single proportion, for the difference of two proportions, for single mean, for the difference of two means","t-test: for single mean, t-test for the difference of two means, paired t-test","chi-square test: for goodness of fit, for independence of attributes, validity of chi-square test"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, Probability & Statistics (pp. 3–6) allocates the joint-highest 15/60 final exam marks and 8 lecture hours to Unit 8 (Group A Q3 [10 Marks] and Group B Q9 [5 Marks] in the 2024 Model Question Set). Below, every subtopic is covered across SD, D, DR, I, E, A, and N with step-by-step derivations and a critical-value decision sheet."},"notes":[{"id":"ch8-sub-1","code":"8.1","title":"Concept of Hypothesis Testing, Types of Hypotheses, Errors, α & Degrees of Freedom","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A statistical hypothesis is a quantitative statement or assumption about a population parameter (such as μ, p, or independence of attributes). Hypothesis testing is a formal sample-based decision procedure that evaluates whether observed sample evidence is sufficiently improbable under the Null Hypothesis (H₀) to reject H₀ in favor of the Alternative Hypothesis (H₁).","descriptionD":"Null Hypothesis (H₀): Statement of \"no effect / no difference / status quo\" containing equality (=, ≤, ≥), assumed true until disproved. Alternative Hypothesis (H₁ or Hₐ): Research claim containing strict inequality: Two-tailed (H₁: θ ≠ θ₀), Right-tailed (H₁: θ > θ₀), or Left-tailed (H₁: θ < θ₀). Level of Significance (α): Maximum tolerable probability of rejecting a true H₀ (typically 0.05 or 0.01). Degree of Freedom (df or ν): Number of independent observations/comparisons free to vary after estimating constraints or parameters.","explanationE":"Two Errors in Hypothesis Testing: Type I Error (α) = P(Reject H₀ | H₀ is true) (\"false positive\"); Type II Error (β) = P(Fail to reject H₀ | H₀ is false) (\"false negative\"). Statistical Power = 1 − β = P(Reject H₀ | H₁ is true). Fixing sample size n, lowering α widens the acceptance region and increases β; only increasing n reduces α and β simultaneously. The 6-step PU exam format is: (1) State H₀ & H₁, (2) Specify α & tail type, (3) Select & compute Test Statistic, (4) Determine df & Critical Region, (5) Compare |calc| vs. critical (or p-value vs. α), (6) State statistical decision and plain-language conclusion.","illustrationI":"In a quality-control inspection, H₀: μ = 100 Ω (batch meets spec). Rejecting a good batch is a Type I error (α, producer risk); accepting a bad batch whose true mean shifted to 95 Ω is a Type II error (β, consumer risk).","applicationA":"Relay trip-time validation, clinical efficacy trials, production batch acceptance testing, and verifying whether training improves industrial worker output.","derivationDR":{"title":"Derivation (DR): Type II Error (β) & Power Function (1 − β) for Single-Mean Z-Test","goal":"Derive the exact probability of Type II error β(μ₁) and power (1 − β) when testing H₀: μ = μ₀ vs. H₁: μ ≠ μ₀ at significance level α with known σ.","steps":[{"step":1,"title":"Write the Two-Tailed Acceptance Region Under H₀","equation":"Fail to reject H₀  ⇔  −z_{α/2} ≤ (X̄ − μ₀) / (σ / √n) ≤ +z_{α/2}  ⇔  μ₀ − z_{α/2}(σ/√n) ≤ X̄ ≤ μ₀ + z_{α/2}(σ/√n)","note":"By definition, P(X̄ falls outside [A_L, A_U] | μ = μ₀) = α (Type I error)."},{"step":2,"title":"Condition on True Alternative Mean μ = μ₁ ≠ μ₀","equation":"β(μ₁) = P( A_L ≤ X̄ ≤ A_U | μ = μ₁ ) = P( (A_L − μ₁)/(σ/√n) ≤ Z ≤ (A_U − μ₁)/(σ/√n) )","note":"When μ = μ₁, Z = (X̄ − μ₁)/(σ/√n) ~ N(0, 1). Substitute A_L and A_U:"},{"step":3,"title":"Express β and Power in Terms of Standard Normal CDF Φ(·)","equation":"β(μ₁) = Φ( z_{α/2} − Δ ) − Φ( −z_{α/2} − Δ ),   where   Δ = (μ₁ − μ₀) / (σ / √n)","note":"Notice that as n increases or |μ₁ − μ₀| increases, |Δ| grows larger, driving β → 0 and Power = 1 − β → 1."}],"result":"β(μ₁) = Φ(z_{α/2} − Δ) − Φ(−z_{α/2} − Δ);   Power = 1 − β(μ₁)."},"keyTakeawayN":"Never say \"Accept H₀\" in formal statistical phrasing when p > α—state \"Fail to reject H₀ (insufficient evidence against H₀ at level α)\". Also check whether the claim specifies direction (< or > → one-tailed) or mere difference (≠ → two-tailed)."},{"id":"ch8-sub-2","code":"8.2","title":"z-Tests for Single Mean & Difference of Two Means (Large Samples / Known σ)","depths":["SD","D","I","E","A","N"],"definitionSD":"A z-test uses the Standard Normal statistic Z ~ N(0, 1) under H₀ to test hypotheses about a single population mean μ or the difference between two population means (μ₁ − μ₂) when population standard deviation(s) σ are known or sample sizes are large (n ≥ 30).","descriptionD":"Single Mean: H₀: μ = μ₀, Z = (x̄ − μ₀) / (σ / √n). If σ is unknown and n ≥ 30, replace σ with sample s via CLT. Difference of Two Means (independent samples): H₀: μ₁ − μ₂ = δ₀ (usually δ₀ = 0), Z = [(x̄₁ − x̄₂) − δ₀] / √(σ₁²/n₁ + σ₂²/n₂), substituting s₁², s₂² when n₁, n₂ ≥ 30.","explanationE":"Because X̄ ~ N(μ, σ²/n) exactly for Normal populations (and approximately for any population with finite variance when n ≥ 30 by the Central Limit Theorem), standardizing by the Standard Error yields a N(0, 1) pivot whose critical values depend only on α and tail direction (±1.96 for 5% two-tailed; ±1.645 for 5% one-tailed).","illustrationI":"In PU Model Q9, a sample of n = 50 with x̄ = 90 is tested against μ₀ = 100 and σ = 8 at α = 0.05 (two-tailed): SE = 8/√50 = 1.1314, Z = (90 − 100)/1.1314 = −8.839, which lies far outside ±1.96, rejecting H₀.","applicationA":"Checking whether a production run shifted from target voltage/strength specification, or comparing average lifetimes of LED batches from two assembly lines.","keyTakeawayN":"If n < 30 AND σ is unknown, do NOT use a z-test—switch immediately to Student’s t-test (Subtopic 8.4). Use z-test only when σ is explicitly given OR n ≥ 30."},{"id":"ch8-sub-3","code":"8.3","title":"z-Tests for Single Proportion & Difference of Two Proportions","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Large-sample proportion z-tests evaluate claims about a population proportion p (H₀: p = p₀) or equality of two independent population proportions (H₀: p₁ = p₂) using the Normal approximation to the Binomial when np ≥ 5 and nq ≥ 5.","descriptionD":"Single Proportion: p̂ = x/n, Z = (p̂ − p₀) / √(p₀q₀ / n), where q₀ = 1 − p₀. Difference of Two Proportions: p̂₁ = x₁/n₁, p̂₂ = x₂/n₂, pooled proportion p̂ = (x₁ + x₂) / (n₁ + n₂), q̂ = 1 − p̂, and Z = (p̂₁ − p̂₂) / √[ p̂q̂ · (1/n₁ + 1/n₂) ].","explanationE":"Crucial Distinction from Unit 7 (Confidence Intervals): In hypothesis testing for a single proportion, the Null Hypothesis assumes the true parameter is p₀, so Standard Error MUST use p₀q₀ (NOT p̂q̂!). Similarly, under H₀: p₁ = p₂ = p, both samples share a single common proportion, which is best estimated by pooling counts into p̂ = (x₁ + x₂)/(n₁ + n₂).","illustrationI":"Comparing defect rates between Plant A (36/300 = 12%) and Plant B (16/200 = 8%): pooled p̂ = (36 + 16)/(300 + 200) = 52/500 = 0.104, giving SE = √(0.104×0.896×(1/300+1/200)) = 0.02787 and Z = 1.435.","applicationA":"Testing defective-component rates against a supplier guarantee, or comparing pass rates / packet-drop rates across two manufacturing shifts or routers.","derivationDR":{"title":"Derivation (DR): Pooled Two-Proportion Z-Statistic Under H₀: p₁ = p₂","goal":"Derive Z = (p̂₁ − p̂₂) / √[p̂q̂(1/n₁ + 1/n₂)] starting from two independent Binomial proportions.","steps":[{"step":1,"title":"Write Exact Variance of (p̂₁ − p̂₂) for Independent Samples","equation":"E(p̂₁ − p̂₂) = p₁ − p₂;   Var(p̂₁ − p̂₂) = Var(p̂₁) + Var(p̂₂) = (p₁q₁ / n₁) + (p₂q₂ / n₂)","note":"Variances add even when subtracting two independent estimators."},{"step":2,"title":"Impose Null Hypothesis H₀: p₁ = p₂ = p","equation":"Under H₀:  E(p̂₁ − p̂₂) = 0   and   Var₀(p̂₁ − p̂₂) = p(1 − p) · (1/n₁ + 1/n₂)","note":"Since the common null value p is unknown, combine both samples to form its minimum-variance unbiased pooled estimate:"},{"step":3,"title":"Substitute Pooled p̂ = (x₁ + x₂) / (n₁ + n₂)","equation":"p̂ = (n₁p̂₁ + n₂p̂₂) / (n₁ + n₂) = (x₁ + x₂) / (n₁ + n₂)  ⇒  Z = (p̂₁ − p̂₂) / √[ p̂(1 − p̂)(1/n₁ + 1/n₂) ] ~ N(0, 1)","note":"Valid when n₁p̂ ≥ 5, n₁q̂ ≥ 5, n₂p̂ ≥ 5, and n₂q̂ ≥ 5."}],"result":"Z = (p̂₁ − p̂₂) / √[ p̂q̂ (1/n₁ + 1/n₂) ],   where   p̂ = (x₁ + x₂)/(n₁ + n₂)."},"keyTakeawayN":"Always check if the problem gives counts x (e.g., 36 defectives) or percentages p̂ (e.g., 12%). If percentages are given, convert x₁ = n₁p̂₁ and x₂ = n₂p̂₂ before computing pooled p̂ = (n₁p̂₁ + n₂p̂₂)/(n₁ + n₂)!"},{"id":"ch8-sub-4","code":"8.4","title":"Student's t-Tests: Single Mean, Difference of Two Means & Paired t-Test","depths":["SD","D","I","E","A","N"],"definitionSD":"Student's t-tests replace unknown population standard deviation σ with unbiased sample SD s in small Normal samples (typically n < 30), yielding heavier-tailed t_ν statistics parameterized by degrees of freedom ν.","descriptionD":"(1) Single Mean t-Test: t = (x̄ − μ₀) / (s / √n), df = n − 1, where s² = ∑(xᵢ − x̄)²/(n − 1). (2) Independent Two-Mean Pooled t-Test (assuming σ₁² = σ₂²): t = [(x̄₁ − x̄₂) − 0] / [ s_p √(1/n₁ + 1/n₂) ], df = n₁ + n₂ − 2, with s_p² = [(n₁−1)s₁² + (n₂−1)s₂²] / (n₁ + n₂ − 2). (3) Paired t-Test (dependent/before-after observations): let dᵢ = xᵢ − yᵢ, t = (d̄ − 0) / (s_d / √n), df = n − 1.","explanationE":"When two measurements are taken on the SAME subject, circuit, or substation (e.g., Before vs. After regulator installation, or Left vs. Right measurement on n specimens), the observations are correlated, NOT independent! You must collapse the n pairs into n differences dᵢ = xᵢ − yᵢ and run a 1-sample t-test on d̄ with df = n − 1—never an independent two-sample t-test with df = 2n − 2.","illustrationI":"Testing 8 substations before and after capacitor bank installation gives 8 paired differences d = [5, 3, 6, 4, 2, 7, 5, 4] with d̄ = 4.50, s_d = 1.6036, t = 4.50 / (1.6036/√8) = 7.937 against t_{0.05, 7} = 1.895.","applicationA":"Small-lot component destructive testing, comparing two prototype amplifier gains on n = 10 boards each, and before/after calibration drift studies.","keyTakeawayN":"Check sample variance formula carefully: if a PU problem provides ∑(xᵢ − x̄)² or raw data, divide by (n − 1) for s². If a problem gives \"standard deviation of sample S\" defined with divisor n, convert s² = [n/(n − 1)]·S² (or directly t = (x̄ − μ₀) / (S / √(n − 1)))."},{"id":"ch8-sub-5","code":"8.5","title":"Chi-Square (χ²) Tests: Goodness of Fit, Independence of Attributes & Validity","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"The Chi-Square test compares observed cell frequency counts Oᵢ against theoretical expected frequencies Eᵢ via χ² = ∑ [ (Oᵢ − Eᵢ)² / Eᵢ ], following approximately a χ²_ν distribution.","descriptionD":"(1) Goodness of Fit: Tests whether an observed frequency distribution fits a specified theoretical distribution (Uniform, Binomial, Poisson, Normal); df = k − 1 − m, where k is the number of classes AFTER pooling and m is the number of parameters estimated from the sample (m = 0 if given, m = 1 for Poisson λ̂ = x̄ or Binomial p̂, m = 2 for Normal μ̂, σ̂). (2) Independence of Attributes (r × c Contingency Table): Tests H₀: row and column attributes are independent. Expected count E_{ij} = (Row_i Total × Col_j Total) / N, df = (r − 1)(c − 1).","explanationE":"Validity Conditions of Chi-Square Test (High-Yield PU Theory Question): (1) Total sample size must be reasonably large: N ≥ 50; (2) No expected cell frequency should be less than 5 (all Eᵢ ≥ 5; if any Eᵢ < 5, pool/merge that cell with an adjacent category BEFORE computing χ² and subtract 1 df per merged bin); (3) Observations must be randomly drawn and mutually independent; (4) Data MUST be raw frequency counts (integers), NEVER percentages, proportions, or rates. Note: For a 2 × 2 table with 5 ≤ E < 10 or N < 40, Yates’ Continuity Correction subtracts 0.5 from |O − E| before squaring.","illustrationI":"In PU Model Q3, 200 workers are cross-classified by Training (150 Trained, 50 Untrained) and Performance (120 Good, 80 Not Good). All E_{ij} ∈ {90, 60, 30, 20} ≥ 5 and N = 200 ≥ 50, yielding χ² = 11.111 > χ²_{0.05, 1} = 3.841 ⇒ performance depends on training.","applicationA":"Testing whether defective relays are independent of shift/machine/training, and testing whether arrival or failure counts statistically follow Binomial or Poisson models.","derivationDR":{"title":"Derivation (DR): 2 × 2 Contingency Table Shortcut Formula","goal":"Prove that for a 2 × 2 table with cells [[a, b], [c, d]] and total N = a + b + c + d, ∑(O − E)²/E simplifies identically to N(ad − bc)² / [(a+b)(c+d)(a+c)(b+d)].","steps":[{"step":1,"title":"Compute Deviation (O₁₁ − E₁₁) for the First Cell","equation":"O₁₁ − E₁₁ = a − [(a + b)(a + c) / N] = [ a(a + b + c + d) − (a² + ac + ab + bc) ] / N = (ad − bc) / N","note":"Notice that every cell deviation has identical magnitude |ad − bc| / N with alternating signs (±)!"},{"step":2,"title":"Factor Out Common Numerator (ad − bc)² / N²","equation":"χ² = [(ad − bc)² / N²] · [ 1/E₁₁ + 1/E₁₂ + 1/E₂₁ + 1/E₂₂ ]","note":"Substitute E₁₁ = R₁C₁/N, E₁₂ = R₁C₂/N, E₂₁ = R₂C₁/N, E₂₂ = R₂C₂/N where R₁=a+b, R₂=c+d, C₁=a+c, C₂=b+d:"},{"step":3,"title":"Sum Reciprocal Expected Frequencies","equation":"∑(1/E_{ij}) = N · [ (R₂C₂ + R₂C₁ + R₁C₂ + R₁C₁) / (R₁ R₂ C₁ C₂) ] = N · [ (R₁ + R₂)(C₁ + C₂) / (R₁ R₂ C₁ C₂) ] = N³ / (R₁ R₂ C₁ C₂)","note":"Since R₁ + R₂ = N and C₁ + C₂ = N. Multiplying by (ad − bc)² / N² cancels N²:"}],"result":"χ² = [ N (ad − bc)² ] / [ (a + b)(c + d)(a + c)(b + d) ],   with df = 1."},"keyTakeawayN":"Before computing χ² in Goodness-of-Fit, ALWAYS verify two sums: ∑Oᵢ = ∑Eᵢ = N and every Eᵢ ≥ 5. Notice in Chi-Square tests, the rejection region is ALWAYS strictly right-tailed (χ²_calc > χ²_{α, df})!"}],"formulas":[{"id":"ch8-f-z-mean","category":"Location","quantity":"z-Test for Single Mean","symbol":"Z_mean","formula":"Z = (x̄ − μ₀) / (σ / √n)   (use s if σ unknown & n ≥ 30)","assumptionOrConstant":"Normal population or CLT (n ≥ 30); two-tailed if H₁: μ ≠ μ₀","unit":"Standard Normal Z (dimensionless)"},{"id":"ch8-f-z-2mean","category":"Location","quantity":"z-Test for Difference of Two Means","symbol":"Z_{μ₁−μ₂}","formula":"Z = [(x̄₁ − x̄₂) − δ₀] / √(σ₁²/n₁ + σ₂²/n₂)","assumptionOrConstant":"Independent samples; n₁, n₂ ≥ 30 (use s₁², s₂² if σ₁, σ₂ unknown)","unit":"Standard Normal Z"},{"id":"ch8-f-z-prop","category":"Location","quantity":"z-Test for Single Proportion","symbol":"Z_prop","formula":"Z = (p̂ − p₀) / √(p₀ q₀ / n),   q₀ = 1 − p₀","assumptionOrConstant":"MUST use null p₀q₀ in SE; valid for np₀ ≥ 5 and nq₀ ≥ 5","unit":"Standard Normal Z"},{"id":"ch8-f-z-2prop","category":"Location","quantity":"z-Test for Difference of Two Proportions","symbol":"Z_{p₁−p₂}","formula":"Z = (p̂₁ − p̂₂) / √[ p̂q̂ (1/n₁ + 1/n₂) ],   p̂ = (x₁ + x₂)/(n₁ + n₂)","assumptionOrConstant":"Pooled p̂ under H₀: p₁ = p₂; q̂ = 1 − p̂; all nᵢp̂, nᵢq̂ ≥ 5","unit":"Standard Normal Z"},{"id":"ch8-f-t-1mean","category":"Dispersion","quantity":"Single-Mean Student's t-Test","symbol":"t_{n−1}","formula":"t = (x̄ − μ₀) / (s / √n),   s² = ∑(xᵢ − x̄)² / (n − 1)","assumptionOrConstant":"df = n − 1; Normal population; unknown σ; small n (< 30)","unit":"t-statistic (df = n − 1)"},{"id":"ch8-f-t-2mean","category":"Dispersion","quantity":"Two-Mean Independent Pooled t-Test","symbol":"t_{n₁+n₂−2}","formula":"t = (x̄₁ − x̄₂) / [ s_p √(1/n₁ + 1/n₂) ],   s_p² = [(n₁−1)s₁² + (n₂−1)s₂²]/(n₁ + n₂ − 2)","assumptionOrConstant":"df = n₁ + n₂ − 2; independent Normal populations with σ₁ = σ₂","unit":"t-statistic (df = n₁ + n₂ − 2)"},{"id":"ch8-f-t-paired","category":"Dispersion","quantity":"Paired t-Test (Dependent Samples)","symbol":"t_paired","formula":"t = d̄ / (s_d / √n),   dᵢ = xᵢ − yᵢ,   s_d² = ∑(dᵢ − d̄)² / (n − 1)","assumptionOrConstant":"df = n − 1 (NOT 2n − 2); correlated before/after measurements on n pairs","unit":"t-statistic (df = n − 1)"},{"id":"ch8-f-chi-gof","category":"Dispersion","quantity":"Chi-Square Goodness of Fit","symbol":"χ²_GoF","formula":"χ² = ∑_{i=1}^k [ (Oᵢ − Eᵢ)² / Eᵢ ],   df = k − 1 − m","assumptionOrConstant":"k = bins AFTER pooling (Eᵢ ≥ 5); m = params estimated from sample; N ≥ 50","unit":"Chi-Square (df = k − 1 − m)"},{"id":"ch8-f-chi-ind","category":"Dispersion","quantity":"Chi-Square Independence (r × c & 2 × 2)","symbol":"χ²_ind","formula":"E_{ij} = (Rᵢ·C_j)/N, df = (r−1)(c−1);  2×2: χ² = N(ad−bc)² / [(a+b)(c+d)(a+c)(b+d)]","assumptionOrConstant":"Always right-tailed (reject if χ²_calc > χ²_{α, df}); Yates −0.5 if 5 ≤ E < 10 in 2×2","unit":"Chi-Square (df = (r−1)(c−1))"},{"id":"ch8-f-crit-z","category":"Properties & Constants","quantity":"Critical Z-Values (α = 0.10, 0.05, 0.01)","symbol":"z_crit","formula":"Two-tailed: ±1.645 (10%), ±1.96 (5%), ±2.576 (1%)  |  One-tailed: ±1.282, ±1.645, ±2.326","assumptionOrConstant":"Two-tailed splits α/2 in each tail; one-tailed puts full α in one tail","unit":"Critical Z boundary"},{"id":"ch8-f-crit-tchi","category":"Properties & Constants","quantity":"Key Critical t & χ² Values (α = 0.05)","symbol":"t_crit, χ²_crit","formula":"t_{0.025, 7}=2.365, t_{0.05, 7}=1.895, t_{0.025, 10}=2.228  |  χ²_{0.05, df=1..4}: 3.841, 5.991, 7.815, 9.488","assumptionOrConstant":"χ²_{0.01, 1} = 6.635, χ²_{0.01, 2} = 9.210; always check upper tail for χ²","unit":"Critical table value"},{"id":"ch8-f-errors","category":"Properties & Constants","quantity":"Error Matrix & Validity Rules","symbol":"α, β, 1−β","formula":"α = P(Reject H₀ | H₀ true);  β = P(Fail to reject H₀ | H₀ false);  χ² valid ⇔ N ≥ 50 & Eᵢ ≥ 5","assumptionOrConstant":"χ² requires raw integer counts (never %); pool adjacent classes if any Eᵢ < 5","unit":"Probability ∈ [0, 1] / Count"}],"categoryLabels":{"Location":"Concept & z-Tests","Dispersion":"t-Tests & Chi-Square","Properties & Constants":"Critical Values & Validity"},"questions":[{"id":"pu-model-q3","tag":"PU Model Set · Group A, Q3","title":"Chi-Square Test of Independence: Worker Training vs. Performance (2 × 2 Table)","marks":"10 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Pages 7–8","statement":"In an industry, 200 workers employed for a specific job were classified according to their performance (Good / Not Good) and training received (Trained / Untrained): Trained [Good = 100, Not Good = 50, Total = 150]; Untrained [Good = 20, Not Good = 30, Total = 50]; Column Totals [Good = 120, Not Good = 80, N = 200]. Use the chi-square test of independence at 5% level of significance and write your conclusion.","given":["Sample size N = 200 workers; 2 × 2 contingency table (r = 2 rows, c = 2 columns).","Observed counts: a = 100 (Trained, Good), b = 50 (Trained, Not Good), c = 20 (Untrained, Good), d = 30 (Untrained, Not Good).","Marginal totals: R₁ = 150, R₂ = 50; C₁ = 120, C₂ = 80; α = 0.05."],"tableHeaders":["Cell (Training, Perf.)","Observed (O)","Expected E = (R·C)/N","O − E","(O − E)²","(O − E)² / E"],"tableRows":[["Trained · Good","100","(150 × 120) / 200 = 90","+10","100","100 / 90 = 1.1111"],["Trained · Not Good","50","(150 × 80) / 200 = 60","−10","100","100 / 60 = 1.6667"],["Untrained · Good","20","(50 × 120) / 200 = 30","−10","100","100 / 30 = 3.3333"],["Untrained · Not Good","30","(50 × 80) / 200 = 20","+10","100","100 / 20 = 5.0000"]],"tableTotals":["Total (N = 200)","∑O = 200","∑E = 200 (min E = 20 ≥ 5)","∑ = 0","—","χ²_calc = 11.1111"],"steps":[{"heading":"Step 1: State Null & Alternative Hypotheses and Level of Significance","work":["H₀: Performance and training are independent (training has no association with worker performance).","H₁: Performance and training are dependent (training is associated with worker performance).","Level of significance: α = 0.05 (chi-square independence test is always right-tailed)."]},{"heading":"Step 2: Verify Validity Conditions & Compute Expected Frequencies E_{ij} = (Rᵢ · C_j)/N","work":["E₁₁ = (150 × 120)/200 = 90;   E₁₂ = (150 × 80)/200 = 60","E₂₁ = (50 × 120)/200 = 30;    E₂₂ = (50 × 80)/200 = 20","Validity check: N = 200 ≥ 50 and minimum E_{ij} = 20 ≥ 5 → Chi-square test is strictly valid without pooling or Yates’ correction."]},{"heading":"Step 3: Compute χ² Test Statistic & Cross-Check via 2 × 2 Shortcut","work":["χ²_calc = ∑ (O − E)² / E = 1.1111 + 1.6667 + 3.3333 + 5.0000 = 11.1111 (= 100/9)","2 × 2 Shortcut Verification: χ² = [N(ad − bc)²] / [(a+b)(c+d)(a+c)(b+d)]","χ² = [200 · (100×30 − 50×20)²] / (150 × 50 × 120 × 80) = (200 × 2000²) / 72,000,000 = 800/72 = 11.1111 (Verified!)"]},{"heading":"Step 4: Degrees of Freedom, Critical Value & Decision","work":["Degrees of freedom: df = (r − 1)(c − 1) = (2 − 1)(2 − 1) = 1","Tabulated critical value at α = 0.05 and df = 1: χ²_{0.05, 1} = 3.841","Comparison: χ²_calc = 11.1111 > χ²_{0.05, 1} = 3.841  ⇒  Reject H₀ at 5% level of significance.","Interpretation: Trained workers have 100/150 = 66.7% Good performance vs. 20/50 = 40.0% for untrained workers."]}],"finalAnswer":["χ²_calc = 11.111 (df = 1) > χ²_crit(0.05, 1) = 3.841  ⇒  Reject H₀","Conclusion: Worker performance depends significantly on training at α = 0.05 (training boosts Good performance from 40% to 66.7%)."]},{"id":"pu-model-q9","tag":"PU Model Set · Group B, Q9","title":"Single-Mean z-Test: Testing Sample Consistency With N(100, 8²)","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"A random sample of size 50 was drawn and sample mean was found to be 90. Test whether this sample could have come from a normal population with mean 100 and standard deviation 8 at 5% level of significance.","given":["Sample size: n = 50 (≥ 30); Sample mean: x̄ = 90.","Hypothesized population mean: μ₀ = 100; Known population SD: σ = 8.","Level of significance: α = 0.05 (two-tailed test)."],"steps":[{"heading":"Step 1: Formulate Null & Alternative Hypotheses","work":["H₀: μ = 100 (the sample could have come from the normal population N(100, 8²)).","H₁: μ ≠ 100 (the sample mean differs significantly from 100 — two-tailed test)."]},{"heading":"Step 2: Select Test Statistic & Compute Standard Error","work":["Since the population standard deviation σ = 8 is known (and n = 50 ≥ 30), apply the single-mean Z-test:","SE(X̄) = σ / √n = 8 / √50 = 8 / 7.0710678 = 1.131371"]},{"heading":"Step 3: Compute Calculated Z-Statistic","work":["Z_calc = (x̄ − μ₀) / (σ / √n) = (90 − 100) / 1.131371 = −10 / 1.131371 = −8.8388 ≈ −8.839","|Z_calc| = 8.839"]},{"heading":"Step 4: Critical Value & Decision at α = 0.05","work":["For a two-tailed test at α = 0.05, critical values are Z_{α/2} = ±1.96.","Rejection region: |Z| > 1.96 (i.e., Z < −1.96 or Z > +1.96).","Since |Z_calc| = 8.839 > 1.96 (p-value < 0.0001), we reject H₀."]}],"finalAnswer":["Z_calc = −8.839 (|Z_calc| = 8.839 > Z_crit = 1.96)  ⇒  Reject H₀ at α = 0.05","Conclusion: The sample could NOT have reasonably come from the normal population N(100, 8²)."]},{"id":"ch8-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Paired t-Test: Evaluating Substation Reactive Power Loss Reduction","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Small Dependent Samples · Paired t-Test)","statement":"To test whether installing automated capacitor banks reduces feeder reactive power loss (kVAR), measurements were recorded on n = 8 substations Before (X) and After (Y) installation, yielding differences dᵢ = Xᵢ − Yᵢ = [5, 3, 6, 4, 2, 7, 5, 4] kVAR. Test at α = 0.05 whether the capacitor banks significantly reduce reactive power loss.","given":["Number of paired substations: n = 8  ⇒  df = n − 1 = 7.","Paired differences dᵢ = Before − After = [5, 3, 6, 4, 2, 7, 5, 4] kVAR.","Question asks if loss \"reduces\" (Before − After > 0) ⇒ Right-tailed test at α = 0.05."],"tableHeaders":["Substation (i)","dᵢ = Xᵢ − Yᵢ","dᵢ − d̄","(dᵢ − d̄)²"],"tableRows":[["1","5","+0.5","0.25"],["2","3","−1.5","2.25"],["3","6","+1.5","2.25"],["4","4","−0.5","0.25"],["5","2","−2.5","6.25"],["6","7","+2.5","6.25"],["7","5","+0.5","0.25"],["8","4","−0.5","0.25"]],"tableTotals":["n = 8","∑dᵢ = 36 (d̄ = 4.50)","∑ = 0.0","∑(dᵢ − d̄)² = 18.00"],"steps":[{"heading":"Step 1: Hypotheses & Tail Specification","work":["H₀: μ_d = 0 (capacitor banks produce zero mean reduction in reactive loss).","H₁: μ_d > 0 (capacitor banks significantly reduce loss — right-tailed test, α = 0.05)."]},{"heading":"Step 2: Sample Mean d̄ and Sample Standard Deviation s_d","work":["d̄ = ∑dᵢ / n = 36 / 8 = 4.50 kVAR","s_d² = ∑(dᵢ − d̄)² / (n − 1) = 18.00 / (8 − 1) = 18 / 7 = 2.571429","s_d = √2.571429 = 1.603567 kVAR"]},{"heading":"Step 3: Paired t-Statistic & Critical Value Comparison","work":["SE(d̄) = s_d / √n = 1.603567 / √8 = 1.603567 / 2.828427 = 0.566947","t_calc = (d̄ − 0) / SE(d̄) = 4.50 / 0.566947 = 7.937","Critical value (right-tailed, α = 0.05, df = 7): t_{0.05, 7} = 1.895","Since t_calc = 7.937 > 1.895, reject H₀."]}],"finalAnswer":["t_calc = 7.937 (df = 7) > t_crit(0.05, one-tailed) = 1.895  ⇒  Reject H₀","Conclusion: Automated capacitor banks significantly reduce feeder reactive power loss (mean drop = 4.50 kVAR)."]},{"id":"ch8-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Two-Proportion z-Test & Chi-Square Goodness-of-Fit With Validity Pooling","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Two-Proportion Z & χ² Cell-Pooling Rule)","statement":"(a) Plant A produces 36 defective relays out of 300 tested, while Plant B produces 16 defective relays out of 200 tested. Test at α = 0.05 whether the two plants differ in defect proportion. (b) Over N = 150 shifts, observed voltage spikes x = [0, 1, 2, 3, 4] had O = [62, 54, 24, 7, 3] against expected Poisson(λ = 0.90) frequencies E = [60.98, 54.88, 24.70, 7.41, 2.03]. Test goodness-of-fit at α = 0.05 while enforcing χ² validity.","given":["Part (a): n₁ = 300, x₁ = 36 (p̂₁ = 0.12); n₂ = 200, x₂ = 16 (p̂₂ = 0.08); α = 0.05 (two-tailed).","Part (b): N = 150, parameter λ = 0.90 specified a priori (m = 0), notice E₄ = 2.03 < 5 violates χ² validity."],"tableHeaders":["Part (b) Spike Class","Observed (O)","Expected (E ≥ 5)","O − E","(O − E)² / E"],"tableRows":[["x = 0","62","60.98","+1.02","0.0171"],["x = 1","54","54.88","−0.88","0.0141"],["x = 2","24","24.70","−0.70","0.0198"],["x ≥ 3 (pooled 3 & 4)","7 + 3 = 10","7.41 + 2.03 = 9.44","+0.56","0.0332"]],"tableTotals":["k = 4 classes (after pooling)","∑O = 150","∑E = 150.00 (min 9.44 ≥ 5)","∑ = 0.00","χ²_calc = 0.0842"],"steps":[{"heading":"Part (a): Two-Proportion Pooled Z-Test (H₀: p₁ = p₂ vs. H₁: p₁ ≠ p₂)","work":["Pooled proportion: p̂ = (x₁ + x₂) / (n₁ + n₂) = (36 + 16) / (300 + 200) = 52 / 500 = 0.104,   q̂ = 0.896","SE(p̂₁ − p̂₂) = √[ p̂q̂(1/n₁ + 1/n₂) ] = √[ 0.104 × 0.896 × (1/300 + 1/200) ] = √(0.093184 × 0.0083333) = 0.027866","Z_calc = (0.12 − 0.08) / 0.027866 = 0.04 / 0.027866 = +1.435","Critical Z_{0.025} = ±1.96. Since |Z_calc| = 1.435 < 1.96, we FAIL to reject H₀ (no significant difference at 5%)."]},{"heading":"Part (b): Goodness-of-Fit χ² Test With Adjacent Class Pooling","work":["Since E₄ = 2.03 < 5, merge x = 3 and x = 4 into a single class \"x ≥ 3\": O = 10, E = 9.44 ≥ 5.","χ²_calc = 0.0171 + 0.0141 + 0.0198 + 0.0332 = 0.0842","Degrees of freedom after pooling: df = k − 1 − m = 4 − 1 − 0 = 3 (note: df = 2 if λ̂ was estimated from sample).","Critical value χ²_{0.05, 3} = 7.815 (even at df = 2, χ²_{0.05, 2} = 5.991). Since 0.0842 ≪ 7.815, fail to reject H₀."]}],"finalAnswer":["(a) Z_calc = 1.435 < 1.96  ⇒  Fail to reject H₀ (no statistically significant difference between Plant A & Plant B defect rates).","(b) χ²_calc = 0.0842 (df = 3 after pooling) ≪ 7.815  ⇒  Fail to reject H₀ (Poisson(0.90) fits the spike counts well)."]}],"traps":[{"id":"ch8-trap-sign-1","category":"Sign Convention","title":"Using Sample p̂ Instead of Null p₀ in Single-Proportion z-Test Standard Error","wrongApproach":"Computing Z = (p̂ − p₀) / √(p̂q̂ / n), which confuses confidence interval SE (Unit 7) with hypothesis test SE (Unit 8).","correctRule":"In a single-proportion hypothesis test, H₀ assumes p = p₀ is true, so ALWAYS use Z = (p̂ − p₀) / √(p₀q₀ / n).","examTip":"Remember: Confidence Intervals have no H₀ (use p̂q̂); Hypothesis Tests assume H₀ (use p₀q₀ for 1-prop, pooled p̂ for 2-prop)."},{"id":"ch8-trap-sign-2","category":"Sign Convention","title":"One-Tailed vs. Two-Tailed Critical Value & Sign Error (1.645 vs. 1.96)","wrongApproach":"Using ±1.96 when the problem asks \"is mean less than / greater than / reduced?\" or using +1.645 for a left-tailed test H₁: μ < μ₀.","correctRule":"Words like \"differs / changed / could have come from\" (PU Model Q9) ⇒ Two-tailed (5%: ±1.96). \"Greater / improved\" ⇒ Right-tailed (+1.645). \"Less / reduced / dropped\" ⇒ Left-tailed (−1.645; reject if Z_calc < −1.645).","examTip":"Draw a quick bell curve and shade the tail matching the inequality symbol in H₁ before comparing numbers."},{"id":"ch8-trap-sign-3","category":"Sign Convention","title":"Forgetting to Pool Proportions in Two-Proportion z-Test","wrongApproach":"Using unpooled √(p̂₁q̂₁/n₁ + p̂₂q̂₂/n₂) to test H₀: p₁ = p₂.","correctRule":"Under H₀: p₁ = p₂, compute pooled p̂ = (x₁ + x₂)/(n₁ + n₂) and use SE = √[p̂q̂(1/n₁ + 1/n₂)].","examTip":"If given percentages instead of counts, multiply nᵢ·p̂ᵢ first to recover x₁ and x₂."},{"id":"ch8-trap-geom-1","category":"Boundary & Slope Geometry","title":"Using Chi-Square on Percentages or Failing to Pool Cells With Eᵢ < 5","wrongApproach":"Converting observed counts into percentages before running ∑(O−E)²/E, or keeping a tail bin with E = 2.03 in the sum.","correctRule":"χ² is ONLY valid on raw integer counts with N ≥ 50 and every Eᵢ ≥ 5. Pool adjacent categories with E < 5 BEFORE computing χ² and compute df from the FINAL pooled bin count k.","examTip":"Because (O − E)²/E scales linearly with N, running χ² on percentages artificially distorts the test statistic!"},{"id":"ch8-trap-geom-2","category":"Boundary & Slope Geometry","title":"Wrong Degrees of Freedom in Paired t-Test vs. Independent Two-Sample t-Test","wrongApproach":"Using independent two-sample df = n + n − 2 = 14 on 8 paired Before/After measurements.","correctRule":"Dependent before/after pairs use Paired t-Test on dᵢ = xᵢ − yᵢ with df = n − 1 (= 7). Independent groups use pooled t with df = n₁ + n₂ − 2.","examTip":"Check whether the two columns represent the SAME n units measured twice (paired) or two SEPARATE groups (independent)."},{"id":"ch8-trap-geom-3","category":"Boundary & Slope Geometry","title":"Goodness-of-Fit df Trap: Forgetting to Subtract Estimated Parameters (k − 1 − m)","wrongApproach":"Always writing df = k − 1 even when λ̂ (Poisson), p̂ (Binomial), or (μ̂, σ̂) (Normal) were estimated from the data.","correctRule":"df = k_final − 1 − m, where m = 0 (theoretical distribution fully specified), m = 1 (estimated λ̂ or p̂), or m = 2 (estimated μ̂ and σ̂).","examTip":"State the value of m explicitly next to df in Goodness-of-Fit problems so the grader sees you checked parameter estimation."},{"id":"ch8-trap-pu-1","category":"High-Yield PU Topic","title":"PU Model Q3 (10 Marks) & Q9 (5 Marks): Full 6-Step Presentation","wrongApproach":"Writing only the numerical value χ² = 11.11 or Z = −8.84 without stating H₀, H₁, α, df, critical value, or engineering conclusion.","correctRule":"Unit 8 carries 15/60 marks! Every PU hypothesis test requires: (1) H₀ & H₁, (2) α & tail, (3) Formula + substitution, (4) df & critical value, (5) Reject / Fail to reject H₀, (6) Contextual conclusion.","examTip":"In Model Q3, double-check ∑O = ∑E = 200 and verify χ² using the 2 × 2 shortcut N(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]."},{"id":"ch8-trap-pu-2","category":"High-Yield PU Topic","title":"Divisor n vs. (n − 1) in Sample Standard Deviation for Small-Sample t-Test","wrongApproach":"Plugging S = √[∑(x−x̄)²/n] into t = (x̄−μ₀)/(S/√n) instead of unbiased s = √[∑(x−x̄)²/(n−1)].","correctRule":"With unbiased s (divisor n − 1), t = (x̄ − μ₀)/(s/√n). If a textbook gives biased S (divisor n), use t = (x̄ − μ₀)/(S/√(n − 1)).","examTip":"Verify how s was defined in the problem statement; for raw data in exams, always compute s² = ∑(x − x̄)²/(n − 1)."}]}};
      var CHAPTER_IDS = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6', 'ch7', 'ch8'];
      var PROGRESS_KEY = 'pu-probstat-progress-v1';
      var THEME_KEY = 'pu-probstat-theme';

      var state = {
        activeChapter: 'ch8',
        theoryFilter: 'all',
        formulaFilter: 'All',
        solvedFilter: 'all',
        trapFilter: 'All',
        confirmReset: false,
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
        progress: loadProgress(),
        labInputs: {
          ch1: { data: '42, 48, 51, 55, 58, 60, 62, 68, 74, 82' },
          ch2: { x: '10, 20, 30, 40, 50', y: '18, 25, 34, 41, 52' },
          ch3: { pA: '0.6', pBGivenA: '0.03', pBGivenNotA: '0.08' },
          ch4: { xs: '0, 1, 2, 3', ps: '0.125, 0.375, 0.375, 0.125', a: '4', b: '5' },
          ch5: { mode: 'binomial', n: '8', p: '0.25', lambda: '3.2', k: '2' },
          ch6: { mu: '65', sigma: '8', x: '75' },
          ch7: { xbar: '72.5', sigma: '12', n: '64', conf: '1.96', err: '2.5' },
          ch8: { xbar: '104.2', mu0: '100', sigma: '12', n: '36', zcrit: '1.96' }
        }
      };

      function createEmptyChapterProgress() {
        return { completedSubtopics: [], completedQuestions: [], completedSections: [] };
      }

      function createInitialProgress() {
        var map = {};
        for (var i = 0; i < CHAPTER_IDS.length; i++) {
