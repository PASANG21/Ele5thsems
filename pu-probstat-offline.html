<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PU ProbStat Mastery Guide — Units 1–8 (Standalone Offline HTML5)</title>
  <meta name="description" content="Complete self-contained offline Purbanchal University 5th Semester Probability and Statistics study guide covering all 8 units." />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pu-probstat-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #0369a1;
      --accent-hover: #075985;
      --accent-soft: #f0f9ff;
      --accent-text: #0c4a6e;
      --emerald-bg: #ecfdf5;
      --emerald-border: #6ee7b7;
      --emerald-text: #065f46;
      --emerald-solid: #059669;
      --amber-bg: #fffbeb;
      --amber-border: #fcd34d;
      --amber-text: #92400e;
      --rose-bg: #e11d48;
      --rose-hover: #be123c;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    html.dark {
      color-scheme: dark;
      --bg: #020617;
      --surface: #0f172a;
      --surface-muted: #1e293b;
      --surface-soft: #090f1f;
      --border: #1e293b;
      --border-soft: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0ea5e9;
      --accent-soft: rgba(14, 165, 233, 0.12);
      --accent-text: #7dd3fc;
      --emerald-bg: rgba(6, 78, 59, 0.35);
      --emerald-border: rgba(16, 185, 129, 0.45);
      --emerald-text: #6ee7b7;
      --emerald-solid: #10b981;
      --amber-bg: rgba(120, 53, 15, 0.28);
      --amber-border: rgba(245, 158, 11, 0.45);
      --amber-text: #fcd34d;
      --rose-bg: #e11d48;
      --rose-hover: #f43f5e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      scroll-behavior: smooth;
      line-height: 1.5;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1rem;
      height: 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.015em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-links {
      display: none;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .nav-links a:hover {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    @media (min-width: 768px) {
      .nav-links { display: flex; }
      .topbar-inner { padding: 0 1.5rem; }
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      border: 0;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.42rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-outline:hover { background: var(--surface-muted); color: var(--text); }
    .btn-outline.is-done {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-text);
    }
    .btn-danger {
      padding: 0.42rem 0.7rem;
      border-radius: 0.5rem;
      border: 0;
      background: var(--rose-bg);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger:hover { background: var(--rose-hover); }

    /* Main Container */
    .container {
      max-width: 72rem;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }
    @media (min-width: 640px) {
      .container { padding: 2.5rem 1.5rem 4rem; }
    }

    /* Hero & Toolbar */
    .hero { display: flex; flex-direction: column; gap: 1.1rem; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .meta-text { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }

    .tab-bar {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      padding: 0.25rem;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      align-self: flex-start;
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.7rem;
      border: 0;
      border-radius: 0.4rem;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      font-weight: 600;
    }
    .tab-badge { font-size: 0.6875rem; color: var(--accent-text); }
    .tab-check { color: var(--emerald-solid); font-weight: 700; }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      max-width: 52rem;
    }
    .hero-desc {
      margin: 0;
      font-size: 0.975rem;
      color: var(--text-secondary);
      max-width: 50rem;
      line-height: 1.65;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 0.9rem;
    }
    @media (min-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.85rem 1rem;
    }
    .kpi-label { font-size: 0.75rem; color: var(--text-muted); }
    .kpi-val { font-size: 1.05rem; font-weight: 600; margin-top: 0.2rem; }

    /* Progress Tracker Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1.25rem;
      transition: border-color 0.15s;
    }
    .card.is-done { border-color: var(--emerald-border); }
    .progress-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .progress-track {
      width: 100%;
      max-width: 28rem;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--surface-muted);
      overflow: hidden;
      margin-top: 0.4rem;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .progress-fill.complete { background: var(--emerald-solid); }
    .sec-chips {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 0.6rem;
    }
    @media (min-width: 640px) {
      .sec-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .sec-chips { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .sec-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-size: 0.75rem;
    }
    .sec-chip.is-done {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
    }
    .sec-chip a { font-weight: 500; }
    .sec-chip a:hover { color: var(--accent); text-decoration: underline; }
    .icon-toggle {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 0.15rem 0.25rem;
      border-radius: 0.35rem;
    }
    .sec-chip.is-done .icon-toggle { color: var(--emerald-solid); }

    /* Section Header */
    .section-block { display: flex; flex-direction: column; gap: 1.25rem; scroll-margin-top: 5rem; }
    .section-head {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    @media (min-width: 960px) {
      .section-head {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }
    }
    .section-head h2 { margin: 0; font-size: 1.45rem; font-weight: 600; letter-spacing: -0.015em; }
    .section-sub { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--text-secondary); max-width: 46rem; }
    .controls-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }

    .note-banner {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Subtopic & Question Cards */
    .stack { display: flex; flex-direction: column; gap: 1.5rem; }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.9rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-soft);
    }
    .card-title { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .depth-line { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 1.15rem;
    }
    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .field-label { font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text); }
    .field-label.sky { color: var(--accent-text); }
    .body-p { margin: 0; font-size: 0.875rem; color: var(--text-secondary); line-height: 1.65; }
    .body-p.strong { color: var(--text); }
    .divider-top { padding-top: 0.85rem; margin-top: 0.85rem; border-top: 1px solid var(--border-soft); }

    /* Derivation Box */
    .dr-box {
      margin-top: 1rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .dr-box h4 { margin: 0; font-size: 0.875rem; font-weight: 600; }
    .dr-goal { margin: 0.2rem 0 0; font-size: 0.75rem; color: var(--text-muted); }
    .dr-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }
    .dr-eq {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      padding: 0.5rem 0.75rem;
      margin: 0.3rem 0;
      font-size: 0.82rem;
      color: var(--accent-text);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .dr-result {
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .dr-result strong { color: var(--emerald-text); }

    /* Tables */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .table-wrap.is-done { border-color: var(--emerald-border); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.7rem 0.9rem; vertical-align: top; }
    thead tr {
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    tbody tr { border-bottom: 1px solid var(--border-soft); font-size: 0.85rem; }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr:hover { background: var(--surface-soft); }
    tfoot tr {
      background: var(--surface-soft);
      border-top: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.78rem;
    }
    .num-table th, .num-table td { text-align: right; font-size: 0.78rem; padding: 0.55rem 0.75rem; }
    .num-table th:first-child, .num-table td:first-child { text-align: left; font-weight: 600; }

    /* Solved Work & Final Answer */
    .given-list { margin: 0.35rem 0 0; padding-left: 1.25rem; font-size: 0.875rem; color: var(--text-secondary); }
    .given-list li + li { margin-top: 0.25rem; }
    .work-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      padding: 0.8rem 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.82rem;
    }
    .answer-box {
      margin-top: 1rem;
      background: var(--emerald-bg);
      border: 1px solid var(--emerald-border);
      border-radius: 0.55rem;
      padding: 0.75rem 1rem;
    }
    .answer-title { font-size: 0.75rem; font-weight: 600; color: var(--emerald-text); margin-bottom: 0.25rem; }
    .answer-line { font-size: 0.875rem; font-weight: 600; }

    /* Traps */
    .trap-box {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 0.55rem;
      padding: 0.75rem;
      font-size: 0.78rem;
    }
    .trap-title { font-weight: 600; color: var(--amber-text); margin-bottom: 0.25rem; }
    .rule-box {
      background: var(--emerald-bg);
      border: 1px solid var(--emerald-border);
      border-radius: 0.55rem;
      padding: 0.75rem;
      font-size: 0.78rem;
    }
    .rule-title { font-weight: 600; color: var(--emerald-text); margin-bottom: 0.25rem; }

    /* Interactive Offline Lab */
    .lab-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 1.25rem;
      align-items: start;
    }
    @media (min-width: 900px) {
      .lab-grid { grid-template-columns: 5fr 7fr; }
    }
    .input-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.85rem; }
    .input-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
    .input-ctrl {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 0.85rem;
    }
    .lab-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
    }
    @media (min-width: 640px) {
      .lab-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .lab-stat {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
    }
    .lab-stat-k { font-size: 0.7rem; color: var(--text-muted); }
    .lab-stat-v { font-size: 0.95rem; font-weight: 600; margin-top: 0.15rem; }

    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 1.25rem 1rem;
      margin-top: 2rem;
    }
    .footer-inner {
      max-width: 72rem;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media print {
      .topbar, .no-print { display: none !important; }
      html, body { background: #ffffff !important; color: #0f172a !important; }
      .card, .table-wrap { break-inside: avoid; }
    }
  </style>
</head>

      var CHAPTERS = {"ch1":{"id":"ch1","shortLabel":"Ch 1 · Descriptive","unitLabel":"Unit 1","formulaUnitLabel":"Chapter 1","headline":"Probability & Statistics — Unit 1: Descriptive Statistics","intro":"B.E. Exam-mastery reference covering measures of location (mean, combined mean, median, mode, quartiles, percentiles) and measures of dispersion (variance, standard deviation, and coefficient of variation).","weightage":"10 / 60 Marks","hours":"6 Hours","derivations":"8 Step-by-Step","solvedCount":"Model Q4, Q12a + 2 Extra","solvedSubtitle":"Complete step-by-step solutions for every Unit 1 question in the attached 2024 PU Model Question Set (Q4 & Q12a), plus two high-yield 10-mark exam numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 1: Descriptive Statistics","lectureHours":6,"finalMarks":10,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Measures of location: mean, combined mean, median, mode, partition values (quartiles and percentiles) and their properties","Measures of dispersion: absolute and relative measure of variation; standard deviation, variance and Coefficient of variation"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, explicit SD/D/DR/I/E/A/EX/N checkmark grids appear for Advanced Instrumentation, Control System Engineering, Electric Machine Design, Power System Analysis II, and Synchronous & Special Machines. For Probability & Statistics (pp. 2–9), the PDF provides the Detailed Course Contents, Mark Scheme (10 marks for Chapter I), and 2024 Model Question Paper. To guarantee complete exam mastery, every Unit 1 subtopic below is covered across all applicable depths: SD, D, DR, I, E, A, and N."},"notes":[{"id":"subtopic-1-1","code":"1.1","title":"Data Classification, Frequency Distributions & Arithmetic Mean","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Arithmetic Mean (x̄) is the sum of all observations divided by the total number of observations (N). For grouped or discrete data, each value or class midpoint xᵢ is weighted by its frequency fᵢ.","descriptionD":"Raw engineering measurements are organized into Primary Data (collected firsthand from sensors, lab benches, or surveys) or Secondary Data (extracted from published handbooks, utility logs, or census reports). When summarized into Discrete Frequency Tables (exact integer counts) or Continuous Class Intervals (exclusive: 10–20, 20–30; or inclusive: 10–19, 20–29), the Arithmetic Mean serves as the rigid, algebraically defined center of gravity of the distribution.","explanationE":"Because every observation contributes proportionally to the numerator ∑fᵢxᵢ, the mean is sensitive to extreme outliers. To avoid large squaring or multiplication errors in 5-mark/10-mark PU problems, the Step-Deviation (Coding) method shifts the origin to an assumed mean A (usually the middle class midpoint) and scales by common class width h via uᵢ = (xᵢ − A)/h.","illustrationI":"Think of a uniform beam carrying weights fᵢ placed at distances xᵢ along a ruler: the Arithmetic Mean x̄ is the exact fulcrum point where clockwise and counter-clockwise torques balance to zero, i.e. ∑fᵢ(xᵢ − x̄) = 0.","applicationA":"Used in electrical load forecasting (average kWh per feeder), quality control of resistor/capacitor manufacturing tolerances, and baseline calibration of instrumentation readouts.","derivationDR":{"title":"Derivations (DR): Zero-Sum Deviation, Least-Squares Property & Step-Deviation Mean","goal":"Prove: (i) ∑fᵢ(xᵢ − x̄) = 0, (ii) ∑fᵢ(xᵢ − A)² is minimum iff A = x̄, and (iii) x̄ = A + h·(∑fᵢuᵢ / N).","steps":[{"step":1,"title":"Zero-Sum of Deviations from Mean","equation":"∑fᵢ(xᵢ − x̄) = ∑fᵢxᵢ − x̄∑fᵢ = N·x̄ − x̄·N = 0","note":"Since x̄ = (∑fᵢxᵢ)/N implies ∑fᵢxᵢ = N·x̄ and ∑fᵢ = N."},{"step":2,"title":"Minimum Sum of Squared Deviations","equation":"Let S(A) = ∑fᵢ(xᵢ − A)². Differentiate w.r.t. A: dS/dA = −2∑fᵢ(xᵢ − A) = 0","note":"Solving gives ∑fᵢxᵢ − A∑fᵢ = 0 ⇒ A = (∑fᵢxᵢ)/N = x̄."},{"step":3,"title":"Second Derivative Test for Minimum","equation":"d²S/dA² = 2∑fᵢ = 2N > 0","note":"Positive second derivative confirms S(A) attains its strict global minimum at A = x̄."},{"step":4,"title":"Change of Origin & Scale (Step-Deviation Formula)","equation":"Let uᵢ = (xᵢ − A) / h  ⇒  xᵢ = A + h·uᵢ","note":"Substitute xᵢ into the definition of x̄."},{"step":5,"title":"Simplify Linear Expectation","equation":"x̄ = (1/N)∑fᵢ(A + h·uᵢ) = (A/N)∑fᵢ + (h/N)∑fᵢuᵢ = A + h·ū","note":"Mean depends on both origin shift (A) and scale factor (h)."}],"result":"x̄ = A + h · (∑fᵢuᵢ / N), and ∑fᵢ(xᵢ − x̄)² ≤ ∑fᵢ(xᵢ − A)² ∀ A ∈ ℝ."},"keyTakeawayN":"Always verify N = ∑fᵢ first, and check that ∑fᵢ(xᵢ − x̄) equals 0 (within rounding) before moving to variance."},{"id":"subtopic-1-2","code":"1.2","title":"Combined Mean & Weighted Aggregation","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Combined Mean (x̄₁₂ or x̄_c) is the arithmetic mean of a pooled dataset formed by merging k independent groups whose individual sample sizes (nᵢ) and means (x̄ᵢ) are known.","descriptionD":"When two or more production shifts, testing labs, or substations report separate group sizes and averages, the pooled average cannot be obtained by simply averaging the group means unless all group sizes are equal. Instead, each group mean must be weighted by its corresponding group size.","explanationE":"Because x̄ᵢ = (∑x_group_i) / nᵢ, multiplying x̄ᵢ by nᵢ reconstructs the exact total sum of observations in group i. Summing those reconstructed totals across all k groups and dividing by the total count N = ∑nᵢ yields the exact pooled mean without needing raw individual observations.","illustrationI":"If Shift A (60 motors) averages 92% efficiency and Shift B (40 motors) averages 88% efficiency, the pooled average is pulled closer to 92% (90.4%) than to the unweighted midpoint (90.0%).","applicationA":"Aggregating regional substation voltage readings, combining multi-batch component test results, and computing overall reliability metrics across parallel manufacturing lines.","derivationDR":{"title":"Derivation (DR): Combined Mean of k Groups","goal":"Express the pooled mean x̄_c in terms of group sizes n₁, n₂, …, n_k and group means x̄₁, x̄₂, …, x̄_k.","steps":[{"step":1,"title":"Reconstruct Sum of Observations for Each Group","equation":"∑x₁j = n₁·x̄₁,   ∑x₂j = n₂·x̄₂,   …,   ∑x_kj = n_k·x̄_k","note":"By direct rearrangement of the arithmetic mean definition for each group."},{"step":2,"title":"Total Sum and Total Size of Pooled Dataset","equation":"∑x_total = ∑(nᵢ·x̄ᵢ)   and   N = n₁ + n₂ + … + n_k = ∑nᵢ","note":"Summing all observations across mutually exclusive groups."},{"step":3,"title":"Divide Total Sum by Pooled Size","equation":"x̄_c = (n₁x̄₁ + n₂x̄₂ + … + n_kx̄_k) / (n₁ + n₂ + … + n_k)","note":"For two groups: x̄₁₂ = (n₁x̄₁ + n₂x̄₂) / (n₁ + n₂)."}],"result":"x̄_c = (∑nᵢx̄ᵢ) / (∑nᵢ). Furthermore, ∑nᵢ(x̄ᵢ − x̄_c) = 0 always holds."},"keyTakeawayN":"Never compute (x̄₁ + x̄₂)/2 when n₁ ≠ n₂; always weight by nᵢ."},{"id":"subtopic-1-3","code":"1.3","title":"Median & Partition Values (Quartiles, Deciles, Percentiles)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Median (M_d) is the positional middle value that divides an ordered dataset into two equal halves (50% below, 50% above). Partition values generalize this division: Quartiles (Q₁, Q₂, Q₃) divide into 4 equal parts, Deciles (D₁…D₉) into 10 parts, and Percentiles (P₁…P₉₉) into 100 parts.","descriptionD":"Unlike the arithmetic mean, the median and partition values depend strictly on the rank/order of observations rather than their magnitudes. Thus, they remain unaffected by open-ended class intervals (e.g., \"<10\" or \">500\") and extreme outliers. Note that Q₂ = D₅ = P₅₀ = M_d.","explanationE":"For ungrouped/discrete data (n items sorted ascending), median is the ((n+1)/2)-th item, and Q_k is at k(n+1)/4. For continuous grouped frequency tables, we construct the Less-Than Cumulative Frequency (cf) column, locate the target class where cf ≥ target rank (e.g., N/2 for M_d, kN/4 for Q_k, kN/100 for P_k), and linearly interpolate across the class width h.","illustrationI":"On a Less-Than Ogive (cumulative frequency vs. upper class boundary), drawing a horizontal line at height p·N until it hits the ogive polygon and dropping vertically to the x-axis locates the exact p-th quantile.","applicationA":"Analyzing skewed income/load distributions, setting SLA latency percentiles (P₉₅, P₉₉ response times), and computing Interquartile Range (IQR = Q₃ − Q₁) for fault-tolerant outlier detection.","derivationDR":{"title":"Derivation (DR): Continuous Grouped Median & General Percentile Formula","goal":"Derive M_d = L + [(N/2 − cf) / f] × h and P_k = L + [(kN/100 − cf) / f] × h via similar triangles on the ogive.","steps":[{"step":1,"title":"Identify the Target Class Interval [L, U]","equation":"Find first class with cumulative frequency ≥ m, where m = kN / 100 (for M_d, m = N/2)","note":"L = true lower boundary, U = true upper boundary, h = U − L, f = class frequency, cf = cumulative frequency strictly BEFORE this class."},{"step":2,"title":"Assume Uniform Density Within the Target Class","equation":"Segment endpoints on ogive: (L, cf)  to  (L + h, cf + f)","note":"Across width h, cumulative frequency rises linearly by f."},{"step":3,"title":"Equate Slopes (Similar Right Triangles)","equation":"(P_k − L) / h  =  (m − cf) / f","note":"Fraction of class width needed equals fraction of class frequency remaining."},{"step":4,"title":"Solve for P_k (and M_d, Q₁, Q₃)","equation":"P_k = L + [ (kN/100 − cf) / f ] × h","note":"Substitute k = 50 for Median (M_d), k = 25 for Q₁, k = 75 for Q₃, and 10k for D_k."}],"result":"M_d = L + [(N/2 − cf)/f]×h;   Q₁ = L + [(N/4 − cf)/f]×h;   Q₃ = L + [(3N/4 − cf)/f]×h."},"keyTakeawayN":"Always convert inclusive classes (e.g., 10–19, 20–29) to true continuous boundaries (9.5–19.5, 19.5–29.5) before using L and h."},{"id":"subtopic-1-4","code":"1.4","title":"Mode & Empirical Mean–Median–Mode Relationship","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Mode (M_o) is the value that occurs with the maximum frequency (highest probability density) in a dataset.","descriptionD":"For discrete data, Mode is simply the value xᵢ with largest frequency fᵢ. For continuous grouped data of equal class width h, the Modal Class is the interval with maximum frequency f₁, flanked by preceding frequency f₀ and succeeding frequency f₂. A distribution may be unimodal, bimodal, or ill-defined when frequencies tie.","explanationE":"In a histogram, the modal bar is tallest. Drawing two diagonal lines from the top corners of the modal bar to the opposite top corners of its neighboring bars creates an intersection whose x-coordinate shifts away from the center toward whichever neighbor has the larger frequency. When data is moderately skewed or bimodal (making the modal formula unstable or yielding a denominator ≤ 0), Karl Pearson’s empirical relation M_o ≈ 3M_d − 2x̄ is used.","illustrationI":"In an electrical spare-parts inventory, Mean gives average cost, Median gives the middle-priced part, while Mode identifies the single component rating ordered most frequently.","applicationA":"Demand sizing for standard transformer ratings, packet-size profiling in network traffic, and identifying peak noise bins in ADC histograms.","derivationDR":{"title":"Derivation (DR): Grouped Mode Formula via Histogram Geometry","goal":"Prove M_o = L + [(f₁ − f₀) / (2f₁ − f₀ − f₂)] × h.","steps":[{"step":1,"title":"Define Difference Heights on Histogram","equation":"Δ₁ = f₁ − f₀   (left excess),     Δ₂ = f₁ − f₂   (right excess)","note":"Modal bar runs from x = L to x = L + h with height f₁."},{"step":2,"title":"Construct Crossed Diagonals Inside Modal Bar","equation":"Line 1: (L, f₀) to (L + h, f₁)   and   Line 2: (L, f₁) to (L + h, f₂)","note":"Intersection point (M_o, y*) forms two vertically opposite similar triangles of heights Δ₁ (left) and Δ₂ (right) along the top edge."},{"step":3,"title":"Apply Similar Triangles Horizontal Proportion","equation":"(M_o − L) / (L + h − M_o)  =  Δ₁ / Δ₂","note":"Equivalently, M_o − L is to the total width h as Δ₁ is to (Δ₁ + Δ₂)."},{"step":4,"title":"Solve for M_o","equation":"M_o = L + [ Δ₁ / (Δ₁ + Δ₂) ] × h = L + [ (f₁ − f₀) / (2f₁ − f₀ − f₂) ] × h","note":"Since Δ₁ + Δ₂ = (f₁ − f₀) + (f₁ − f₂) = 2f₁ − f₀ − f₂."}],"result":"M_o = L + [(f₁ − f₀)/(2f₁ − f₀ − f₂)] × h;   Empirical (skewed): M_o ≈ 3M_d − 2x̄."},"keyTakeawayN":"If f₁ occurs in the first class (f₀ = 0) or if 2f₁ − f₀ − f₂ ≤ 0, verify whether unequal widths exist or use M_o = 3M_d − 2x̄."},{"id":"subtopic-1-5","code":"1.5","title":"Measures of Dispersion: Absolute vs. Relative, Variance & Standard Deviation","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Dispersion measures the scatter or spread of observations around a central value. Variance (σ²) is the mean of squared deviations from the arithmetic mean, and Standard Deviation (σ) is its positive square root.","descriptionD":"Two datasets can have identical means yet completely different reliability or spread. Absolute Measures of Dispersion (Range, Quartile Deviation, Mean Deviation, Variance, Standard Deviation) retain the original units (or squared units for variance) and measure internal spread. Relative Measures (Coefficient of Range, Coefficient of QD, Coefficient of Variation) are dimensionless ratios/percentages used to compare variability across datasets with different units or widely different means.","explanationE":"Squaring deviations (xᵢ − x̄)² solves the zero-sum cancellation problem (∑fᵢ(xᵢ − x̄) = 0) while keeping the function smooth and differentiable for algebra and inference. Crucially, Variance and SD are invariant under any shift of origin (adding/subtracting a constant c changes x̄ to x̄ + c, leaving xᵢ − x̄ unchanged), and scale linearly in magnitude under multiplication by h (σ_y = |b|·σ_x).","illustrationI":"Two 100 Ω resistor batches both average 100 Ω. Batch A spans 99–101 Ω (σ = 0.5 Ω); Batch B spans 85–115 Ω (σ = 8.0 Ω). Same location, vastly different precision.","applicationA":"Signal-to-noise ratio characterization (RMS AC ripple is literally the standard deviation of voltage fluctuations around its DC mean), process capability (6σ tolerance), and machine precision grading.","derivationDR":{"title":"Derivations (DR): Computational Variance, Coding Formula & Origin/Scale Invariance","goal":"Prove: (i) σ² = (∑fᵢxᵢ²)/N − x̄², (ii) σ = |h|·σ_u, and (iii) Combined Variance σ₁₂².","steps":[{"step":1,"title":"Expand Definition of Variance","equation":"σ² = (1/N)∑fᵢ(xᵢ − x̄)² = (1/N)∑fᵢ(xᵢ² − 2xᵢx̄ + x̄²)","note":"Distribute summation across the three terms."},{"step":2,"title":"Simplify Using ∑fᵢxᵢ = N·x̄ and ∑fᵢ = N","equation":"σ² = (∑fᵢxᵢ²)/N − 2x̄(∑fᵢxᵢ)/N + x̄²(∑fᵢ)/N = (∑fᵢxᵢ²)/N − 2x̄² + x̄² = (∑fᵢxᵢ²)/N − x̄²","note":"Computational formula avoids fractional subtraction errors when x̄ is non-terminating."},{"step":3,"title":"Origin & Scale Transformation (xᵢ = A + h·uᵢ)","equation":"xᵢ − x̄ = (A + h·uᵢ) − (A + h·ū) = h·(uᵢ − ū)","note":"The constant origin shift A cancels out identically!"},{"step":4,"title":"Substitute into Variance & Take Positive Root","equation":"σ_x² = (1/N)∑fᵢh²(uᵢ − ū)² = h²·σ_u²   ⇒   σ_x = |h|·√[ (∑fᵢuᵢ²)/N − (∑fᵢuᵢ / N)² ]","note":"SD is independent of origin A and scales by |h|."},{"step":5,"title":"Combined Variance of Two Groups (Sizes n₁, n₂)","equation":"Let d₁ = x̄₁ − x̄₁₂,  d₂ = x̄₂ − x̄₁₂.  For group 1: ∑(x₁j − x̄₁₂)² = ∑[(x₁j − x̄₁) + d₁]²","note":"Expand square: ∑(x₁j − x̄₁)² + 2d₁∑(x₁j − x̄₁) + n₁d₁². Cross-term vanishes since ∑(x₁j − x̄₁) = 0!"},{"step":6,"title":"Pool Both Groups & Divide by (n₁ + n₂)","equation":"σ₁₂² = [ n₁(σ₁² + d₁²) + n₂(σ₂² + d₂²) ] / (n₁ + n₂)","note":"Generalizes immediately to k groups: σ_c² = ∑nᵢ(σᵢ² + dᵢ²) / ∑nᵢ."}],"result":"σ² = (∑fᵢxᵢ²)/N − x̄²;   σ_x = |h|·σ_u;   σ₁₂² = [n₁(σ₁² + d₁²) + n₂(σ₂² + d₂²)] / (n₁ + n₂)."},"keyTakeawayN":"In PU Unit 1 frequency tables (like Model Q4), use N = ∑fᵢ as divisor for variance; reserve (n − 1) for sample variance estimation in Units 7–8."},{"id":"subtopic-1-6","code":"1.6","title":"Coefficient of Variation (CV) & Consistency Analysis","depths":["SD","D","I","E","A","N"],"definitionSD":"Coefficient of Variation (CV) is the ratio of Standard Deviation to the Arithmetic Mean expressed as a percentage: CV = (σ / x̄) × 100%.","descriptionD":"CV is the premier relative (unit-free) measure of dispersion proposed by Karl Pearson. Because both σ and x̄ carry the same physical unit, their ratio is pure and dimensionless, enabling direct comparison between completely different physical quantities (e.g., voltage variation in Volts vs. current variation in Amperes) or distributions with vastly different magnitudes.","explanationE":"A smaller CV indicates greater consistency, uniformity, stability, or lower relative risk. Conversely, a larger CV indicates greater relative variability. Note that CV is only meaningful for ratio-scale variables with strictly positive means (x̄ > 0), because an arbitrary zero point (like Celsius temperature) distorts the denominator.","illustrationI":"Machine A has σ = 5 mm on a 500 mm shaft (CV = 1%). Machine B has σ = 2 mm on a 20 mm bolt (CV = 10%). Even though Machine B has smaller σ, Machine A is 10× more consistent relative to its target size.","applicationA":"PU examiners frequently ask students to compare two factories, two shifts, two cricket players, or two electrical feeders and declare which one is \"more consistent\" or \"more uniform\".","keyTakeawayN":"Always conclude a CV comparison with an explicit sentence: \"Since CV_A < CV_B, Group A is more consistent / less variable.\""}],"formulas":[{"id":"f-mean-raw","category":"Location","quantity":"Arithmetic Mean (Ungrouped)","symbol":"x̄","formula":"x̄ = (∑xᵢ) / n","assumptionOrConstant":"All n observations equally weighted; sensitive to outliers","unit":"Same as data (e.g., Ω, V, calls)"},{"id":"f-mean-freq","category":"Location","quantity":"Arithmetic Mean (Discrete / Grouped)","symbol":"x̄","formula":"x̄ = (∑fᵢxᵢ) / N = A + h · (∑fᵢuᵢ / N)","assumptionOrConstant":"N = ∑fᵢ; xᵢ = midpoint for continuous classes; uᵢ = (xᵢ − A)/h","unit":"Same as data"},{"id":"f-combined-mean","category":"Location","quantity":"Combined Mean (k groups)","symbol":"x̄₁₂ / x̄_c","formula":"x̄_c = (n₁x̄₁ + n₂x̄₂ + … + n_kx̄_k) / (n₁ + n₂ + … + n_k)","assumptionOrConstant":"Groups must be mutually exclusive; ∑nᵢ(x̄ᵢ − x̄_c) = 0","unit":"Same as data"},{"id":"f-median-grouped","category":"Location","quantity":"Median (Continuous Grouped)","symbol":"M_d","formula":"M_d = L + [ (N/2 − cf) / f ] × h","assumptionOrConstant":"Uniform density inside median class; L = true lower limit (apply ±0.5 if inclusive)","unit":"Same as data"},{"id":"f-quartiles","category":"Location","quantity":"Quartiles (Q₁, Q₃)","symbol":"Q₁, Q₃","formula":"Q₁ = L + [(N/4 − cf)/f]×h;   Q₃ = L + [(3N/4 − cf)/f]×h","assumptionOrConstant":"Q₂ = M_d; Interquartile Range IQR = Q₃ − Q₁","unit":"Same as data"},{"id":"f-percentiles","category":"Location","quantity":"k-th Percentile & Decile","symbol":"P_k, D_k","formula":"P_k = L + [(kN/100 − cf)/f]×h;   D_k = P₁₀ₖ","assumptionOrConstant":"k ∈ {1,…,99} for percentiles, {1,…,9} for deciles; P₅₀ = D₅ = Q₂ = M_d","unit":"Same as data"},{"id":"f-mode-grouped","category":"Location","quantity":"Mode (Continuous Grouped)","symbol":"M_o","formula":"M_o = L + [ (f₁ − f₀) / (2f₁ − f₀ − f₂) ] × h","assumptionOrConstant":"Requires equal class widths h and unimodal peak; else use empirical relation","unit":"Same as data"},{"id":"f-empirical","category":"Location","quantity":"Empirical Mean–Median–Mode Relation","symbol":"M_o ≈","formula":"M_o ≈ 3·M_d − 2·x̄","assumptionOrConstant":"Karl Pearson empirical constant (3 and 2) for moderately asymmetrical distributions","unit":"Same as data"},{"id":"f-variance","category":"Dispersion","quantity":"Variance (Population / Frequency Table)","symbol":"σ²","formula":"σ² = (1/N)∑fᵢ(xᵢ − x̄)² = (∑fᵢxᵢ²)/N − x̄²","assumptionOrConstant":"Divisor N = ∑fᵢ (PU Unit 1 descriptive convention); always ≥ 0","unit":"(Data unit)²"},{"id":"f-sd-coding","category":"Dispersion","quantity":"Standard Deviation (Step-Deviation)","symbol":"σ","formula":"σ = |h| · √[ (∑fᵢuᵢ²)/N − (∑fᵢuᵢ / N)² ]","assumptionOrConstant":"uᵢ = (xᵢ − A)/h; independent of assumed origin A","unit":"Same as data"},{"id":"f-combined-var","category":"Dispersion","quantity":"Combined Variance & SD","symbol":"σ₁₂², σ₁₂","formula":"σ₁₂² = [n₁(σ₁² + d₁²) + n₂(σ₂² + d₂²)] / (n₁ + n₂)","assumptionOrConstant":"d₁ = x̄₁ − x̄₁₂, d₂ = x̄₂ − x̄₁₂; accounts for both within-group & between-group spread","unit":"σ₁₂²: (unit)²; σ₁₂: unit"},{"id":"f-cv","category":"Dispersion","quantity":"Coefficient of Variation","symbol":"CV","formula":"CV = (σ / x̄) × 100%","assumptionOrConstant":"Valid for ratio-scale data with x̄ > 0; smaller CV ⇒ higher consistency","unit":"Dimensionless (%)"},{"id":"f-qd","category":"Dispersion","quantity":"Quartile Deviation & Coefficient of QD","symbol":"QD, C_QD","formula":"QD = (Q₃ − Q₁)/2;   Coeff. of QD = (Q₃ − Q₁)/(Q₃ + Q₁)","assumptionOrConstant":"Resistant to outliers and open-ended classes","unit":"QD: data unit; Coeff: dimensionless"},{"id":"f-origin-scale","category":"Properties & Constants","quantity":"Linear Transformation y = a + b·x","symbol":"ȳ, σ_y","formula":"ȳ = a + b·x̄;   M_d(y) = a + b·M_d(x);   σ_y = |b|·σ_x;   σ_y² = b²·σ_x²","assumptionOrConstant":"Location shifts + scales; SD/Variance ignore shift a and use |b| or b²","unit":"Scaled by |b|"},{"id":"f-correction","category":"Properties & Constants","quantity":"Correction of Misread Value (x_w → x_c)","symbol":"x̄_corr, σ_corr","formula":"∑x_corr = ∑x_old − x_w + x_c;   ∑x²_corr = ∑x²_old − x_w² + x_c²","assumptionOrConstant":"Never add/subtract (x_c − x_w)² to ∑x²; modify individual squares separately","unit":"Same as data"}],"categoryLabels":{"Location":"Location","Dispersion":"Dispersion","Properties & Constants":"Properties & Constants"},"questions":[{"id":"pu-model-q4","tag":"PU Model Set · Group B, Q4","title":"Mean & Variance of Telephone Calls Received at an Exchange","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 8","statement":"The following is the frequency distribution of the number of telephone calls received in 245 successive one-minute intervals at an exchange: No. of calls = [0, 1, 2, 3, 4, 5, 6, 7], Frequency = [14, 21, 25, 43, 51, 40, 39, 12]. Find mean and variance of number of calls per minute.","given":["Data type: Discrete ungrouped frequency distribution (x = no. of calls/min, f = frequency)","Total number of one-minute intervals: N = ∑f = 245"],"tableHeaders":["No. of calls (x)","Frequency (f)","f · x","x²","f · x²"],"tableRows":[["0","14","0","0","0"],["1","21","21","1","21"],["2","25","50","4","100"],["3","43","129","9","387"],["4","51","204","16","816"],["5","40","200","25","1000"],["6","39","234","36","1404"],["7","12","84","49","588"]],"tableTotals":["Total","N = 245","∑fx = 922","—","∑fx² = 4316"],"steps":[{"heading":"Step 1: Verify Total Frequency N","work":["N = 14 + 21 + 25 + 43 + 51 + 40 + 39 + 12 = 245 (Matches problem statement)"]},{"heading":"Step 2: Calculate Arithmetic Mean (x̄)","work":["x̄ = (∑f·x) / N = 922 / 245 = 3.763265… ≈ 3.7633 calls/minute"]},{"heading":"Step 3: Calculate Variance (σ²)","work":["σ² = (∑f·x² / N) − (x̄)²","∑f·x² / N = 4316 / 245 = 17.616327","(x̄)² = (922 / 245)² = 850084 / 60025 = 14.162166","σ² = 17.616327 − 14.162166 = 3.454161 ≈ 3.4542 (calls/min)²","(Optional check: Standard Deviation σ = √3.454161 ≈ 1.8585 calls/min)"]}],"finalAnswer":["Mean (x̄) = 3.7633 calls/minute","Variance (σ²) = 3.4542 (calls/minute)²"]},{"id":"pu-model-q12a","tag":"PU Model Set · Group B, Q12(a)","title":"Short Note: Primary and Secondary Data","marks":"2.5 Marks (Part a of 5-Mark Q12)","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"Write short notes on: (a) Primary and secondary data.","given":["Question 12 splits 5 marks across (a) Primary & Secondary data (foundational data collection in Descriptive Statistics) and (b) Estimation (Unit 7). Below is the complete, high-scoring PU answer for part (a)."],"steps":[{"heading":"1. Primary Data (Definition, Characteristics & Collection Methods)","work":["Definition: Data collected firsthand by the investigator or engineer specifically for the study at hand. It is original in character and raw before processing.","Engineering Collection Methods: Direct sensor/oscilloscope logging, lab experiments, field surveys, questionnaires, and direct observation.","Merits: High accuracy, exact alignment with study objectives, known error bounds. Demerits: Expensive, time-consuming, requires instrumentation/manpower."]},{"heading":"2. Secondary Data (Definition, Characteristics & Sources)","work":["Definition: Data already collected, compiled, and published by another agency or researcher for a different purpose, now reused by the analyst.","Sources: Government/NEA utility reports, IEEE/journal tables, manufacturer datasheets, census records, historical SCADA archives.","Merits: Economical, rapid access, large historical span. Demerits: May contain outdated units, unknown collection bias, or mismatched definitions—must be verified for reliability and suitability before use."]}],"finalAnswer":["Key Distinction: Primary data is raw material gathered firsthand for the current inquiry; Secondary data is already-processed material borrowed from external records."]},{"id":"extra-num-1","tag":"Extra Exam-Level Numerical 1","title":"Missing Frequencies, Mode, Quartiles, P₈₀, SD & CV for Continuous Feeder Load","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Continuous Grouped Distribution)","statement":"The monthly electricity consumption (in kWh) of 100 residential feeders is distributed as: 100–150 (8), 150–200 (f₁), 200–250 (30), 250–300 (f₂), 300–350 (12). If the median consumption is 235 kWh, find the missing frequencies f₁ and f₂, and hence compute Mode (M_o), Q₁, Q₃, P₈₀, Standard Deviation (σ), and Coefficient of Variation (CV).","given":["Total feeders N = 100, class width h = 50 kWh (exclusive continuous intervals)","Given Median M_d = 235 kWh ⇒ Median class is 200–250 (L = 200, f = 30, cf = 8 + f₁)"],"tableHeaders":["Class (kWh)","Midpoint (x)","Freq (f)","Less-than cf","u = (x−225)/50","f·u","f·u²"],"tableRows":[["100 – 150","125","8","8","-2","-16","32"],["150 – 200","175","f₁ = 21","29","-1","-21","21"],["200 – 250","225 (A)","30","59","0","0","0"],["250 – 300","275","f₂ = 29","88","+1","+29","29"],["300 – 350","325","12","100","+2","+24","48"]],"tableTotals":["Total","—","N = 100","—","—","∑fu = 16","∑fu² = 130"],"steps":[{"heading":"Step 1: Solve Missing Frequencies f₁ and f₂","work":["Total frequency constraint: 8 + f₁ + 30 + f₂ + 12 = 100  ⇒  f₁ + f₂ = 50","Median formula: M_d = L + [(N/2 − cf) / f] × h","235 = 200 + [(50 − (8 + f₁)) / 30] × 50","35 = (42 − f₁) × (5/3)  ⇒  21 = 42 − f₁  ⇒  f₁ = 21","Therefore, f₂ = 50 − 21 = 29"]},{"heading":"Step 2: Mode (M_o) & Partition Values (Q₁, Q₃, P₈₀)","work":["Modal class = 200–250 (max f₁ = 30, f₀ = 21, f₂ = 29, L = 200, h = 50):","M_o = 200 + [(30 − 21) / (2×30 − 21 − 29)] × 50 = 200 + (9 / 10) × 50 = 245.00 kWh","Q₁ position = N/4 = 25 ⇒ Class 150–200 (L = 150, cf = 8, f = 21): Q₁ = 150 + [(25−8)/21]×50 = 190.4762 kWh","Q₃ position = 3N/4 = 75 ⇒ Class 250–300 (L = 250, cf = 59, f = 29): Q₃ = 250 + [(75−59)/29]×50 = 277.5862 kWh","P₈₀ position = 80N/100 = 80 ⇒ Class 250–300 (L = 250, cf = 59, f = 29): P₈₀ = 250 + [(80−59)/29]×50 = 286.2069 kWh"]},{"heading":"Step 3: Mean (x̄), Standard Deviation (σ) & CV via Step-Deviation","work":["Assumed mean A = 225, h = 50: x̄ = 225 + 50 × (16 / 100) = 225 + 8 = 233.00 kWh","σ² = h² × [ (∑fu²/N) − (∑fu/N)² ] = 50² × [ 130/100 − (16/100)² ] = 2500 × (1.30 − 0.0256) = 3186.00 kWh²","σ = √3186 = 56.4447 kWh","CV = (σ / x̄) × 100% = (56.4447 / 233) × 100% = 24.2252%"]}],"finalAnswer":["f₁ = 21, f₂ = 29","M_o = 245.00 kWh · Q₁ = 190.48 kWh · Q₃ = 277.59 kWh · P₈₀ = 286.21 kWh","x̄ = 233.00 kWh · σ = 56.44 kWh · CV = 24.23%"]},{"id":"extra-num-2","tag":"Extra Exam-Level Numerical 2","title":"Consistency Comparison (CV), Combined Mean & Combined SD of Two Production Lines","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Combined Dispersion & CV)","statement":"Two automated resistor-manufacturing lines, Line A and Line B, are tested for resistance consistency (nominal 100 Ω). Line A produced n₁ = 60 resistors with mean x̄₁ = 100.5 Ω and standard deviation σ₁ = 2.0 Ω. Line B produced n₂ = 40 resistors with mean x̄₂ = 98.0 Ω and variance σ₂² = 9.0 Ω². (a) Which production line is more consistent? (b) Find the combined mean (x̄₁₂), combined standard deviation (σ₁₂), and combined CV of the pooled batch of 100 resistors.","given":["Line A: n₁ = 60, x̄₁ = 100.5 Ω, σ₁ = 2.0 Ω ⇒ σ₁² = 4.0 Ω²","Line B: n₂ = 40, x̄₂ = 98.0 Ω, σ₂² = 9.0 Ω² ⇒ σ₂ = √9.0 = 3.0 Ω (Note: variance given, take square root!)"],"steps":[{"heading":"Part (a): Compare Consistency Using Coefficient of Variation","work":["CV_A = (σ₁ / x̄₁) × 100% = (2.0 / 100.5) × 100% = 1.9900%","CV_B = (σ₂ / x̄₂) × 100% = (3.0 / 98.0) × 100% = 3.0612%","Conclusion: Since CV_A (1.99%) < CV_B (3.06%), Line A is more consistent in resistance."]},{"heading":"Part (b): Combined Mean (x̄₁₂)","work":["x̄₁₂ = (n₁x̄₁ + n₂x̄₂) / (n₁ + n₂) = [60(100.5) + 40(98.0)] / (60 + 40)","x̄₁₂ = (6030 + 3920) / 100 = 9950 / 100 = 99.50 Ω"]},{"heading":"Part (c): Deviations & Combined Standard Deviation (σ₁₂)","work":["d₁ = x̄₁ − x̄₁₂ = 100.5 − 99.5 = +1.0 Ω","d₂ = x̄₂ − x̄₁₂ = 98.0 − 99.5 = −1.5 Ω   (Check: n₁d₁ + n₂d₂ = 60(1.0) + 40(−1.5) = 0)","σ₁₂² = [ n₁(σ₁² + d₁²) + n₂(σ₂² + d₂²) ] / (n₁ + n₂)","σ₁₂² = [ 60(4.0 + 1.0²) + 40(9.0 + (−1.5)²) ] / 100 = [ 60(5.0) + 40(11.25) ] / 100","σ₁₂² = (300 + 450) / 100 = 7.50 Ω²","σ₁₂ = √7.50 = 2.7386 Ω","Combined CV₁₂ = (2.7386 / 99.50) × 100% = 2.7524%"]}],"finalAnswer":["(a) Line A is more consistent (CV_A = 1.99% < CV_B = 3.06%)","(b) Combined Mean x̄₁₂ = 99.50 Ω · Combined SD σ₁₂ = 2.7386 Ω · Combined CV = 2.75%"]}],"traps":[{"id":"trap-sign-1","category":"Sign Convention","title":"Negative Sign in Linear Scaling of Standard Deviation (y = a + bx)","wrongApproach":"Writing σ_y = b·σ_x when b is negative (e.g., y = 10 − 2x yielding σ_y = −2σ_x).","correctRule":"Standard deviation is ALWAYS non-negative: σ_y = |b|·σ_x and σ_y² = b²·σ_x². Mean keeps the sign (ȳ = a + bx̄), while SD discards the origin a and takes |b|.","examTip":"Double-check short theory/numerical MCQs where a negative scale factor like u = (A − x)/h is used."},{"id":"trap-sign-2","category":"Sign Convention","title":"Reversed Subtraction in Computational Variance Formula","wrongApproach":"Computing x̄² − (∑fx²)/N, which produces an impossible negative variance.","correctRule":"Always compute (∑fx²)/N − x̄². Because E[X²] ≥ (E[X])² by Cauchy–Schwarz / non-negativity of variance, the mean of squares is strictly ≥ square of mean.","examTip":"Keep at least 4–5 decimal places in ∑fx²/N and x̄² before subtracting to prevent catastrophic cancellation errors."},{"id":"trap-sign-3","category":"Sign Convention","title":"Misread Observation Correction in ∑x²","wrongApproach":"Adjusting ∑x² by adding (x_correct − x_wrong)² instead of adjusting the individual squares.","correctRule":"∑x_corr = ∑x_old − x_wrong + x_correct, and ∑x²_corr = ∑x²_old − x_wrong² + x_correct². Signs attach to each observation individually.","examTip":"Verify whether N changes (if a value is deleted vs. replaced)."},{"id":"trap-geom-1","category":"Boundary & Slope Geometry","title":"Inclusive Class Intervals Without ±0.5 Continuity Correction","wrongApproach":"Using L = 20 and h = 9 for classes written as 10–19, 20–29, 30–39.","correctRule":"Convert inclusive classes to true continuous boundaries before computing Median, Mode, Quartiles, or plotting Histograms/Ogives: 9.5–19.5, 19.5–29.5, 29.5–39.5 (so L = 19.5 and h = 10).","examTip":"Midpoints xᵢ stay identical in both forms, so Mean & SD are unaffected—only positional/boundary formulas (M_d, M_o, Q_k, P_k) break if you skip this!"},{"id":"trap-geom-2","category":"Boundary & Slope Geometry","title":"Ogive Slope & Histogram Difference-Triangle Angle Errors","wrongApproach":"Plotting Less-Than Ogive points at class midpoints or lower limits, OR drawing Mode cross-diagonals to midpoints instead of opposite top corners.","correctRule":"A Less-Than Ogive plots (Upper Boundary, cf), starting at (L_first, 0); its segment slope is f/h. In a Histogram for Mode, diagonals connect top corners of the modal bar to the opposite top corners of adjacent bars (slope angle governed by Δ₁ = f₁ − f₀ and Δ₂ = f₁ − f₂).","examTip":"For unequal class widths, plot Frequency Density (f/h) on the y-axis of a histogram—never raw frequency!"},{"id":"trap-geom-3","category":"Boundary & Slope Geometry","title":"Variance vs. SD Given in Problem Statement & N vs. (n − 1) Divisor","wrongApproach":"Plugging given Variance σ² directly into CV = σ/x̄ without taking √, OR dividing Model Q4 by (N − 1).","correctRule":"Read carefully whether the problem gives SD (σ) or Variance (σ²). In PU Unit 1 Descriptive Statistics frequency tables, divisor is N = ∑f; reserve (n − 1) for sample inference in Units 7–8.","examTip":"Check units: if data is in Ω, Variance is in Ω² and SD is in Ω."},{"id":"trap-pu-1","category":"High-Yield PU Topic","title":"Model Q4 Pattern: Discrete/Grouped Mean, Variance & CV Comparison","wrongApproach":"Reporting only numerical CV values without writing the verbal consistency decision.","correctRule":"PU examiners allocate 1 full mark to the concluding interpretation (\"Since CV_A < CV_B, Machine A is more consistent\").","examTip":"Expect at least one 5-mark or 10-mark question combining CV comparison or Combined Mean/SD."},{"id":"trap-pu-2","category":"High-Yield PU Topic","title":"Missing Frequency Using Mean or Median + Empirical Mode","wrongApproach":"Using the grouped Mode formula when the distribution is bimodal or when 2f₁ − f₀ − f₂ ≤ 0.","correctRule":"If the modal class is ill-defined or widths are unequal, immediately switch to Karl Pearson’s empirical formula M_o = 3M_d − 2x̄.","examTip":"Missing-frequency problems with Median (like Extra Q1) are classic 8–10 mark PU favorites."}]},"ch2":{"id":"ch2","shortLabel":"Ch 2 · Corr & Reg","unitLabel":"Unit 2","formulaUnitLabel":"Chapter 2","headline":"Probability & Statistics — Unit 2: Correlation and Regression","intro":"B.E. Exam-mastery reference covering simple correlation (Karl Pearson's r & properties) and simple linear regression (least-squares estimators, angle between lines, and R²).","weightage":"15 / 60 Marks","hours":"5 Hrs (4 Hrs Det.)","derivations":"6 Step-by-Step","solvedCount":"Model Q2, Q11 + 2 Extra","solvedSubtitle":"Complete step-by-step solutions for every Unit 2 question in the attached 2024 PU Model Question Set (Group A Q2 & Group B Q11), plus two high-yield 10-mark exam numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 2: Correlation and Regression","lectureHours":"5 Hrs (Syllabus) / 4 Hrs (Detailed Contents)","finalMarks":15,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Simple Correlation: Karl Pearson's correlation coefficient and its properties","Simple Linear Regression: Model and assumptions of simple linear regression; Least square estimators of regression coefficients; properties of regression coefficients; Coefficient of determination"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, explicit SD/D/DR/I/E/A/EX/N checkmark grids appear for the other engineering subjects, whereas Probability & Statistics (pp. 2–9) provides the Detailed Course Contents, Mark Scheme (15 marks for Chapter II — 25% of the final paper), and 2024 Model Question Set. Every Unit 2 subtopic below is mapped across all applicable depths: SD, D, DR, I, E, A, and N."},"notes":[{"id":"ch2-sub-1","code":"2.1","title":"Simple Correlation & Karl Pearson's Correlation Coefficient (r)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Correlation measures the strength and direction of the linear association between two quantitative variables X and Y. Karl Pearson's Product-Moment Correlation Coefficient (r) is the covariance of X and Y divided by the product of their standard deviations: r = Cov(X, Y) / (σ_x · σ_y).","descriptionD":"A bivariate relationship can be Positive (Y increases with X, r > 0), Negative (Y decreases as X increases, r < 0), or Uncorrelated (no linear trend, r = 0). On a scatter diagram, tightly clustered points along a straight line produce |r| close to 1, whereas circular or purely quadratic clouds yield r ≈ 0.","explanationE":"Because Cov(X, Y) = (1/n)∑(Xᵢ − X̄)(Yᵢ − Ȳ) carries units of (unit_x × unit_y), dividing by σ_x·σ_y standardizes both variables into dimensionless z-scores. Consequently, r is unit-free, strictly bounded in [−1, +1], symmetric (r_xy = r_yx), and invariant in magnitude under any linear shift of origin or scaling.","illustrationI":"Consider voltage V and current I across an ohmic resistor: points lie cleanly along a line with positive slope, giving r ≈ +0.99. Conversely, battery terminal voltage vs. load current drops linearly due to internal resistance, giving r ≈ −0.98.","applicationA":"Evaluating sensor linearity during calibration, quantifying advertising-to-sales elasticity (PU Model Q2), and screening multicollinearity before system modeling.","derivationDR":{"title":"Derivations (DR): Computational Formula, Bounds −1 ≤ r ≤ +1 & Origin/Scale Invariance","goal":"Prove: (i) r computational form, (ii) −1 ≤ r ≤ +1, and (iii) r_UV = sgn(hk)·r_XY under U = (X − a)/h, V = (Y − c)/k.","steps":[{"step":1,"title":"Computational Raw-Score Formula","equation":"Cov(X,Y) = (∑XY)/n − X̄Ȳ;   σ_x = √[(∑X²)/n − X̄²];   σ_y = √[(∑Y²)/n − Ȳ²]","note":"Multiply numerator and denominator by n to eliminate fractions:"},{"step":2,"title":"Cleared-Fraction Form","equation":"r = [ n∑XY − (∑X)(∑Y) ] / √( [n∑X² − (∑X)²] · [n∑Y² − (∑Y)²] )","note":"Exact and numerically stable form for hand calculation with a scientific calculator."},{"step":3,"title":"Proof of Bounds (−1 ≤ r ≤ +1)","equation":"Let z_xi = (Xᵢ − X̄)/σ_x and z_yi = (Yᵢ − Ȳ)/σ_y.  Note ∑z_xi² = n and ∑z_yi² = n.","note":"Sum of squares of real numbers is always non-negative:"},{"step":4,"title":"Expand Non-Negative Sum of Standardized Combinations","equation":"0 ≤ ∑(z_xi ± z_yi)² = ∑z_xi² + ∑z_yi² ± 2∑z_xi z_yi = n + n ± 2(n·r) = 2n(1 ± r)","note":"Since 2n > 0, (1 + r) ≥ 0 ⇒ r ≥ −1 and (1 − r) ≥ 0 ⇒ r ≤ +1. Equality holds iff Y = a + bX."},{"step":5,"title":"Origin & Scale Transformation (X = a + hU, Y = c + kV)","equation":"Xᵢ − X̄ = h(Uᵢ − Ū),  Yᵢ − Ȳ = k(Vᵢ − V̄),  σ_x = |h|σ_u,  σ_y = |k|σ_v","note":"Substitute into r_XY = ∑(Xᵢ − X̄)(Yᵢ − Ȳ) / (n·σ_x·σ_y):"},{"step":6,"title":"Simplify Sign Factor","equation":"r_XY = [ hk · ∑(Uᵢ − Ū)(Vᵢ − V̄) ] / [ n · |h||k| · σ_u σ_v ] = [ hk / |hk| ] · r_UV","note":"If h and k share the same sign (hk > 0), r_XY = r_UV. If opposite signs (hk < 0), r_XY = −r_UV."}],"result":"−1 ≤ r ≤ +1;  r is independent of origin and magnitude-invariant under scale (flips sign iff hk < 0)."},"keyTakeawayN":"Always verify |r| ≤ 1. If a calculation gives |r| > 1, re-check n∑X² − (∑X)² or sign of Cov(X, Y)."},{"id":"ch2-sub-2","code":"2.2","title":"Simple Linear Regression: Model & Classical Assumptions","depths":["SD","D","E","A"],"definitionSD":"Simple Linear Regression models the average functional relationship between one dependent (response) variable Y and one independent (explanatory/predictor) variable X via the linear equation Yᵢ = β₀ + β₁Xᵢ + εᵢ, where β₀ is the intercept, β₁ is the slope, and εᵢ is the random error.","descriptionD":"Unlike correlation (which treats X and Y symmetrically), regression is directional: predicting Y from X requires the regression line of Y on X (Ŷ = a + b_yx·X), whereas predicting X from Y requires a different line, X on Y (X̂ = c + b_xy·Y).","explanationE":"To ensure the Ordinary Least Squares (OLS) estimators are BLUE (Best Linear Unbiased Estimators under the Gauss–Markov theorem), six classical assumptions are imposed: (1) Linearity in parameters, (2) Zero conditional mean error E(εᵢ | Xᵢ) = 0, (3) Homoscedasticity Var(εᵢ | Xᵢ) = σ², (4) No autocorrelation Cov(εᵢ, εⱼ) = 0 for i ≠ j, (5) Exogeneity Cov(Xᵢ, εᵢ) = 0, and (6) Normality εᵢ ~ N(0, σ²) for hypothesis tests and confidence intervals.","illustrationI":"In an advertising campaign (PU Model Q2), Sales (Y) depends on Advertising Expenditure (X): β₀ represents baseline sales at zero ad spend, β₁ is marginal sales gained per Rs. 1,000 spent, and εᵢ captures unmodeled market noise.","applicationA":"Forecasting power demand vs. ambient temperature, estimating transistor gain drift vs. bias current, and predicting sales from marketing budgets.","keyTakeawayN":"Never use the regression line of Y on X backwards by solving for X when asked to predict X from Y—always fit X on Y instead (unless r = ±1)."},{"id":"ch2-sub-3","code":"2.3","title":"Least-Squares Estimators & Normal Equations (OLS Derivation)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"The Method of Least Squares selects estimates a (for β₀) and b (for β₁) that minimize the Sum of Squared Residuals (SSE): S(a, b) = ∑(Yᵢ − Ŷᵢ)² = ∑(Yᵢ − a − bXᵢ)².","descriptionD":"For each observed point (Xᵢ, Yᵢ), the vertical residual eᵢ = Yᵢ − Ŷᵢ measures the prediction error. Minimizing ∑eᵢ² prevents positive and negative errors from cancelling out and yields unique closed-form Normal Equations.","explanationE":"Setting partial derivatives ∂S/∂a = 0 and ∂S/∂b = 0 ensures the tangent plane to the convex paraboloid S(a, b) is flat. The first normal equation immediately forces ∑eᵢ = 0, meaning the fitted line must pass directly through the centroid (X̄, Ȳ).","illustrationI":"Geometrically, OLS drops vertical springs from every scatter point to the line Y = a + bX and settles at the unique slope and intercept that minimize total spring potential energy ∑eᵢ².","applicationA":"Fitting calibration curves to ADC/thermistor measurements and deriving trend forecasts in engineering economics.","derivationDR":{"title":"Derivation (DR): Normal Equations & Least-Squares Estimators (a, b_yx)","goal":"Minimize S(a, b) = ∑(Yᵢ − a − bXᵢ)² to derive the Normal Equations and closed-form formulas for a and b_yx.","steps":[{"step":1,"title":"Formulate Objective Sum of Squared Errors (SSE)","equation":"S(a, b) = ∑(Yᵢ − a − bXᵢ)²","note":"Take first-order partial derivatives with respect to a and b and equate to zero."},{"step":2,"title":"First Normal Equation (∂S/∂a = 0)","equation":"∂S/∂a = −2∑(Yᵢ − a − bXᵢ) = 0   ⇒   ∑Yᵢ = n·a + b∑Xᵢ","note":"Dividing through by n gives Ȳ = a + bX̄, so a = Ȳ − bX̄ (line passes through (X̄, Ȳ))."},{"step":3,"title":"Second Normal Equation (∂S/∂b = 0)","equation":"∂S/∂b = −2∑Xᵢ(Yᵢ − a − bXᵢ) = 0   ⇒   ∑XᵢYᵢ = a∑Xᵢ + b∑Xᵢ²","note":"Substitute a = (∑Yᵢ − b∑Xᵢ)/n into this second equation."},{"step":4,"title":"Solve for Slope Estimator b (b_yx)","equation":"∑XᵢYᵢ = [ (∑Yᵢ − b∑Xᵢ)/n ]∑Xᵢ + b∑Xᵢ²  ⇒  n∑XᵢYᵢ − (∑Xᵢ)(∑Yᵢ) = b[ n∑Xᵢ² − (∑Xᵢ)² ]","note":"Rearranging yields the exact computational and centered forms:"},{"step":5,"title":"Closed-Form OLS Estimators","equation":"b_yx = [ n∑XY − (∑X)(∑Y) ] / [ n∑X² − (∑X)² ] = ∑(Xᵢ − X̄)(Yᵢ − Ȳ) / ∑(Xᵢ − X̄)² = r·(σ_y / σ_x)","note":"And intercept a = Ȳ − b_yx·X̄. Second partials ∂²S/∂a² = 2n > 0 and Hessian Δ = 4n∑(Xᵢ − X̄)² > 0 confirm a global minimum."}],"result":"b_yx = [n∑XY − (∑X)(∑Y)] / [n∑X² − (∑X)²] = r(σ_y/σ_x),  a = Ȳ − b_yx·X̄;  by symmetry b_xy = r(σ_x/σ_y)."},"keyTakeawayN":"Always keep extra decimals in b_yx before computing a = Ȳ − b_yx·X̄, because rounding b_yx early shifts the intercept a across the whole range."},{"id":"ch2-sub-4","code":"2.4","title":"Properties of Regression Coefficients & Angle Between Regression Lines","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Regression coefficients b_yx (slope of Y on X) and b_xy (slope of X on Y) satisfy strict algebraic bounds, sign coupling, centroid intersection, and scale-dependence laws.","descriptionD":"Key properties examined frequently by PU: (1) r² = b_yx·b_xy, so |r| = √(b_yx·b_xy); (2) b_yx, b_xy, and r always have the same sign; (3) If |b_yx| > 1, then |b_xy| < 1 (product cannot exceed 1); (4) Both lines intersect at (X̄, Ȳ); (5) Independent of origin shift, NOT independent of scale: b_yx = (h_y/h_x)·b_vu.","explanationE":"When two unlabeled linear equations are given in an exam problem, you can immediately identify which line is Y on X and which is X on Y by testing the product condition b_yx · b_xy ≤ 1. Only one assignment yields r² ≤ 1 (unless both slopes equal ±1).","illustrationI":"As |r| approaches 1, the acute angle θ between the two lines narrows to 0° (perfect collinearity). As r approaches 0, the lines open to 90° (orthogonal lines Y = Ȳ and X = X̄).","applicationA":"Reconstructing means, standard deviations, correlation, and angular divergence directly from two empirical equations (Extra Numerical 1).","derivationDR":{"title":"Derivation (DR): Geometric Mean Property, Scale Rule & Angle θ Between Lines","goal":"Prove: (i) r = ±√(b_yx·b_xy), (ii) b_yx = (h_y/h_x)·b_vu, and (iii) tan θ = [(1 − r²)/|r|] · [σ_x σ_y / (σ_x² + σ_y²)].","steps":[{"step":1,"title":"Product of Regression Coefficients","equation":"b_yx · b_xy = [ r·(σ_y / σ_x) ] · [ r·(σ_x / σ_y) ] = r² ≤ 1","note":"Taking square root gives r = ±√(b_yx·b_xy), choosing the common sign of b_yx and b_xy."},{"step":2,"title":"Origin & Scale Transformation (U = (X − A)/h_x, V = (Y − C)/h_y)","equation":"Xᵢ − X̄ = h_x(Uᵢ − Ū),   Yᵢ − Ȳ = h_y(Vᵢ − V̄)","note":"Substitute into b_yx = ∑(Xᵢ − X̄)(Yᵢ − Ȳ) / ∑(Xᵢ − X̄)²:"},{"step":3,"title":"Scale Multiplier Rule","equation":"b_yx = [ h_x h_y ∑(Uᵢ − Ū)(Vᵢ − V̄) ] / [ h_x² ∑(Uᵢ − Ū)² ] = (h_y / h_x) · b_vu","note":"Origin constants A, C disappear, but scale ratio (h_y / h_x) remains!"},{"step":4,"title":"Slopes of Both Lines in the Standard (X, Y) Plane","equation":"Line (Y on X): m₁ = b_yx = r(σ_y/σ_x);   Line (X on Y): Y = (1/b_xy)X − c/b_xy ⇒ m₂ = 1/b_xy = σ_y / (r·σ_x)","note":"Apply the coordinate-geometry acute-angle formula tan θ = |(m₂ − m₁) / (1 + m₁m₂)|:"},{"step":5,"title":"Derive Acute Angle Formula","equation":"tan θ = | [ σ_y/(rσ_x) − rσ_y/σ_x ] / [ 1 + (σ_y² / σ_x²) ] | = [ (1 − r²) / |r| ] · [ σ_x σ_y / (σ_x² + σ_y²) ]","note":"Notice: r = ±1 ⇒ tan θ = 0 ⇒ θ = 0°;  r = 0 ⇒ tan θ → ∞ ⇒ θ = 90°."}],"result":"r² = b_yx·b_xy ≤ 1;  b_yx = (h_y/h_x)b_vu;  tan θ = [(1 − r²)/|r|] · [σ_x σ_y / (σ_x² + σ_y²)]."},"keyTakeawayN":"For coded variables U = (X − A)/h_x and V = (Y − C)/h_y, NEVER forget the factor (h_y/h_x) when converting b_vu back to b_yx!"},{"id":"ch2-sub-5","code":"2.5","title":"Coefficient of Determination (R²) & Variance Decomposition","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"The Coefficient of Determination (R²) is the proportion of total variance in the dependent variable Y that is explained by the linear regression model on X: R² = SSR / SST = 1 − (SSE / SST).","descriptionD":"Total variation in Y around its mean (SST = ∑(Yᵢ − Ȳ)²) splits orthogonally into Explained / Regression variation (SSR = ∑(Ŷᵢ − Ȳ)²) and Unexplained / Residual variation (SSE = ∑(Yᵢ − Ŷᵢ)²).","explanationE":"In Simple Linear Regression (1 predictor), R² equals the square of Karl Pearson’s correlation coefficient (R² = r²). Thus R² ranges from 0 (0% explained) to 1 (100% explained), and 1 − R² represents the Coefficient of Alienation (unexplained noise fraction).","illustrationI":"In PU Model Q2, r = 0.9797 gives R² = 0.9598: 95.98% of the variation in firm sales is explained linearly by advertising expenditure, leaving only 4.02% to other market factors.","applicationA":"Evaluating goodness-of-fit of engineering models, reporting sensor calibration fidelity, and judging predictive reliability before extrapolating.","derivationDR":{"title":"Derivation (DR): SST = SSR + SSE Decomposition & Proof that R² = r²","goal":"Prove ∑(Yᵢ − Ȳ)² = ∑(Ŷᵢ − Ȳ)² + ∑(Yᵢ − Ŷᵢ)² and show SSR / SST = r².","steps":[{"step":1,"title":"Add and Subtract Ŷᵢ Inside Total Deviation","equation":"SST = ∑(Yᵢ − Ȳ)² = ∑[ (Ŷᵢ − Ȳ) + (Yᵢ − Ŷᵢ) ]²","note":"Expand the binomial square across the summation."},{"step":2,"title":"Show Cross-Product Term Vanishes via Normal Equations","equation":"∑(Ŷᵢ − Ȳ)(Yᵢ − Ŷᵢ) = ∑b(Xᵢ − X̄)eᵢ = b[ ∑Xᵢeᵢ − X̄∑eᵢ ] = 0","note":"From Normal Equations: ∑eᵢ = 0 and ∑Xᵢeᵢ = 0!"},{"step":3,"title":"Variance Partition Identity","equation":"SST = SSR + SSE,   where SSR = ∑(Ŷᵢ − Ȳ)² = b_yx² ∑(Xᵢ − X̄)²","note":"Since Ŷᵢ − Ȳ = (a + b_yx Xᵢ) − (a + b_yx X̄) = b_yx(Xᵢ − X̄)."},{"step":4,"title":"Compute R² = SSR / SST","equation":"R² = [ b_yx² ∑(Xᵢ − X̄)² ] / ∑(Yᵢ − Ȳ)² = [ r·(σ_y/σ_x) ]² · (nσ_x²) / (nσ_y²) = r²","note":"Therefore, 0 ≤ R² = r² ≤ 1 identically in Simple Linear Regression."}],"result":"SST = SSR + SSE   and   R² = SSR / SST = 1 − (SSE / SST) = r²."},"keyTakeawayN":"Always express R² both as a decimal (e.g., 0.9598) and a percentage interpretation (\"95.98% of variation in Y is explained by X\")."}],"formulas":[{"id":"ch2-f-cov","category":"Location","quantity":"Sample / Empirical Covariance","symbol":"Cov(X, Y)","formula":"Cov(X, Y) = (1/n)∑(Xᵢ − X̄)(Yᵢ − Ȳ) = (∑XY)/n − X̄Ȳ","assumptionOrConstant":"Can be positive, zero, or negative; sensitive to scale","unit":"Unit(X) · Unit(Y)"},{"id":"ch2-f-r-def","category":"Location","quantity":"Karl Pearson's Correlation Coefficient","symbol":"r","formula":"r = Cov(X, Y) / (σ_x · σ_y) = [n∑XY − (∑X)(∑Y)] / √([n∑X² − (∑X)²][n∑Y² − (∑Y)²])","assumptionOrConstant":"Bounds: −1 ≤ r ≤ +1; measures linear strength only","unit":"Dimensionless"},{"id":"ch2-f-r-code","category":"Location","quantity":"Coded Correlation (U = (X−A)/h_x, V = (Y−C)/h_y)","symbol":"r_uv","formula":"r_xy = sgn(h_x · h_y) · [n∑UV − (∑U)(∑V)] / √([n∑U² − (∑U)²][n∑V² − (∑V)²])","assumptionOrConstant":"r_xy = r_uv if h_x·h_y > 0; flips sign if h_x·h_y < 0","unit":"Dimensionless"},{"id":"ch2-f-reg-model","category":"Dispersion","quantity":"Simple Linear Regression Model","symbol":"Yᵢ","formula":"Yᵢ = β₀ + β₁Xᵢ + εᵢ   (Estimated: Ŷ = a + b_yx·X)","assumptionOrConstant":"E(εᵢ|Xᵢ)=0, Var(εᵢ|Xᵢ)=σ², Cov(εᵢ,εⱼ)=0, Cov(Xᵢ,εᵢ)=0","unit":"Same as Y"},{"id":"ch2-f-normal-eq","category":"Dispersion","quantity":"OLS Normal Equations (Y on X)","symbol":"a, b_yx","formula":"∑Y = n·a + b_yx∑X   and   ∑XY = a∑X + b_yx∑X²","assumptionOrConstant":"Minimizes vertical SSE = ∑(Yᵢ − Ŷᵢ)²; forces ∑eᵢ = 0","unit":"a: Unit(Y); b_yx: Unit(Y)/Unit(X)"},{"id":"ch2-f-byx","category":"Dispersion","quantity":"Regression Coefficient of Y on X","symbol":"b_yx","formula":"b_yx = [n∑XY − (∑X)(∑Y)] / [n∑X² − (∑X)²] = r · (σ_y / σ_x)","assumptionOrConstant":"Marginal change in Y per +1 unit increase in X; a = Ȳ − b_yx·X̄","unit":"Unit(Y) / Unit(X)"},{"id":"ch2-f-bxy","category":"Dispersion","quantity":"Regression Coefficient of X on Y","symbol":"b_xy","formula":"b_xy = [n∑XY − (∑X)(∑Y)] / [n∑Y² − (∑Y)²] = r · (σ_x / σ_y)","assumptionOrConstant":"Minimizes horizontal SSE = ∑(Xᵢ − X̂ᵢ)²; c = X̄ − b_xy·Ȳ","unit":"Unit(X) / Unit(Y)"},{"id":"ch2-f-r2-det","category":"Dispersion","quantity":"Coefficient of Determination","symbol":"R²","formula":"R² = SSR / SST = 1 − (SSE / SST) = r² = b_yx · b_xy","assumptionOrConstant":"0 ≤ R² ≤ 1; fraction of Y variance linearly explained by X","unit":"Dimensionless (or %)"},{"id":"ch2-f-geom-mean","category":"Properties & Constants","quantity":"Correlation from Two Regression Slopes","symbol":"r","formula":"r = sgn(b_yx) · √(b_yx · b_xy),   with b_yx · b_xy ≤ 1","assumptionOrConstant":"b_yx, b_xy, and r MUST share the exact same sign","unit":"Dimensionless"},{"id":"ch2-f-scale-slope","category":"Properties & Constants","quantity":"Origin & Scale Transformation on Slope","symbol":"b_yx","formula":"b_yx = (h_y / h_x) · b_vu   where U = (X−A)/h_x, V = (Y−C)/h_y","assumptionOrConstant":"Independent of origin shifts A, C; scales by ratio h_y / h_x","unit":"Unit(Y) / Unit(X)"},{"id":"ch2-f-angle","category":"Properties & Constants","quantity":"Acute Angle Between Regression Lines","symbol":"θ","formula":"tan θ = [ (1 − r²) / |r| ] · [ (σ_x · σ_y) / (σ_x² + σ_y²) ]","assumptionOrConstant":"r = ±1 ⇒ θ = 0° (coincident); r = 0 ⇒ θ = 90° (perpendicular)","unit":"Degrees (°) or Radians (rad)"},{"id":"ch2-f-se-est","category":"Properties & Constants","quantity":"Standard Error of Estimate (Residual SD)","symbol":"S_e","formula":"S_e = √[ SSE / (n − 2) ] = √[ (∑Y² − a∑Y − b_yx∑XY) / (n − 2) ]","assumptionOrConstant":"Degrees of freedom = n − 2 (2 parameters estimated: a and b_yx)","unit":"Same as Y"}],"categoryLabels":{"Location":"Correlation","Dispersion":"Regression & R²","Properties & Constants":"Properties & Angle"},"questions":[{"id":"pu-model-q2","tag":"PU Model Set · Group A, Q2","title":"Regression Equation of Sales on Advertising Expenditure & Forecast","marks":"10 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 7","statement":"In trying to evaluate the effectiveness in its advertising campaign, a firm compiled the following information for years 2001–2007: Advertising Expenditure ('000 Rs): [12, 14, 17, 22, 35, 42, 50], Sales (lakh Rs.): [5.1, 5.5, 5.8, 7.0, 7.5, 8.2, 9.5]. (a) Obtain the regression equation of sales on advertising expenditure. (b) Estimate the probable sales when advertisement expenditure is Rs. 65 thousand.","given":["Let X = Advertising Expenditure (in '000 Rs) [independent variable]","Let Y = Sales (in lakh Rs.) [dependent variable], number of pairs n = 7","Target prediction in part (b): Rs. 65 thousand ⇒ X = 65 (matching table unit of '000 Rs)"],"tableHeaders":["Year","Ad Exp. X ('000 Rs)","Sales Y (lakh Rs.)","X²","Y²","X · Y"],"tableRows":[["2001","12","5.1","144","26.01","61.2"],["2002","14","5.5","196","30.25","77.0"],["2003","17","5.8","289","33.64","98.6"],["2004","22","7.0","484","49.00","154.0"],["2005","35","7.5","1225","56.25","262.5"],["2006","42","8.2","1764","67.24","344.4"],["2007","50","9.5","2500","90.25","475.0"]],"tableTotals":["n = 7","∑X = 192","∑Y = 48.6","∑X² = 6602","∑Y² = 352.64","∑XY = 1472.7"],"steps":[{"heading":"Step 1: Compute Sample Means X̄ and Ȳ","work":["X̄ = ∑X / n = 192 / 7 = 27.4286 thousand Rs.","Ȳ = ∑Y / n = 48.6 / 7 = 6.9429 lakh Rs."]},{"heading":"Step 2: Compute Regression Coefficient b_yx (Sales on Advertising)","work":["Numerator: n∑XY − (∑X)(∑Y) = 7(1472.7) − (192)(48.6) = 10308.9 − 9331.2 = 977.7","Denominator: n∑X² − (∑X)² = 7(6602) − (192)² = 46214 − 36864 = 9350","b_yx = 977.7 / 9350 = 0.104567 ≈ 0.1046 lakh Rs. per thousand Rs. ad spend"]},{"heading":"Step 3: Compute Intercept (a) & Write Regression Equation","work":["a = Ȳ − b_yx·X̄ = (48.6 / 7) − 0.1045668 × (192 / 7) = 6.942857 − 2.868119 = 4.074738 ≈ 4.0747 lakh Rs.","Regression equation of Sales (Y) on Advertising Expenditure (X): Ŷ = 4.0747 + 0.1046·X","(Verification check: r = 977.7 / √(9350 × 106.52) = 0.9797, R² = 95.98%)"]},{"heading":"Step 4: Estimate Probable Sales When Ad Expenditure = Rs. 65 Thousand (X = 65)","work":["Substitute X = 65 into the regression equation:","Ŷ(65) = 4.074738 + 0.104567 × 65 = 4.074738 + 6.796845 = 10.8716 lakh Rs.","(Note: Using 4-decimal rounded coefficients 4.0747 + 0.1046(65) gives 10.8737 lakh Rs.; both are accepted in PU marking)"]}],"finalAnswer":["(a) Regression Equation of Sales on Ad Expenditure: Ŷ = 4.0747 + 0.1046·X (X in '000 Rs, Ŷ in lakh Rs.)","(b) Estimated Sales at Rs. 65 thousand Ad Spend: 10.8716 lakh Rs. (≈ Rs. 10,87,160)"]},{"id":"pu-model-q11","tag":"PU Model Set · Group B, Q11","title":"Distinguish Between Correlation and Regression","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 9","statement":"Distinguish between correlation and regression.","given":["5-Mark theory comparison: Write 5–6 crisp, structured points contrasting Meaning, Causality, Symmetry, Scale/Origin Invariance, Bounds, and Graphical Representation."],"tableHeaders":["Basis of Comparison","Correlation (r)","Regression (Ŷ = a + b_yx·X)"],"tableRows":[["1. Core Purpose","Measures the degree (strength) and direction of linear association between two variables.","Establishes the functional equation to predict/estimate the average value of one variable from the other."],["2. Cause & Effect","Does not imply causation; two variables may move together due to a third confounding variable.","Assumes a directional dependency: independent variable X predicts dependent variable Y."],["3. Symmetry","Completely symmetric: r_xy = r_yx (no distinction between X and Y).","Asymmetric / directional: regression line of Y on X differs from X on Y (b_yx ≠ b_xy in general)."],["4. Origin & Scale","Independent of both origin shift and scale magnitude (r_uv = ±r_xy).","Independent of origin shift, but NOT independent of scale: b_yx = (h_y/h_x)·b_vu."],["5. Bounds & Units","Pure dimensionless number strictly bounded between −1 and +1.","Carries physical units: b_yx has units of Y/X; unbounded individually, subject to b_yx·b_xy ≤ 1."]],"steps":[{"heading":"Mathematical Bridge Between Both Concepts (Bonus Marks Sentence)","work":["Regression slopes and correlation are linked by: b_yx = r·(σ_y/σ_x),  b_xy = r·(σ_x/σ_y),  and  r² = b_yx·b_xy."]}],"finalAnswer":["Summary: Correlation quantifies linear co-movement (−1 ≤ r ≤ +1, unit-free, symmetric), whereas Regression provides a directional predictive equation (unit-dependent, asymmetric)."]},{"id":"ch2-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Two Regression Lines: Centroid Means, Line Identification, r, R², σ_y & Acute Angle θ","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Two Regression Equations)","statement":"In an electrical load-temperature study, the two regression equations obtained are (i) 8X − 10Y + 66 = 0 and (ii) 40X − 18Y = 214. If the variance of X is σ_x² = 9, find: (a) Mean values X̄ and Ȳ, (b) Correlation coefficient r and Coefficient of Determination R², (c) Standard deviation σ_y, and (d) Acute angle θ between the two regression lines.","given":["Line (i): 8X − 10Y = −66","Line (ii): 40X − 18Y = 214","Variance of X: σ_x² = 9 ⇒ Standard deviation σ_x = 3"],"steps":[{"heading":"Part (a): Find Means X̄ and Ȳ (Intersection of Both Regression Lines)","work":["Both lines pass through (X̄, Ȳ). Multiply (i) by 5:  40X̄ − 50Ȳ = −330","Subtract from (ii) 40X̄ − 18Ȳ = 214:  (−18 + 50)Ȳ = 214 − (−330)  ⇒  32Ȳ = 544  ⇒  Ȳ = 17","Substitute Ȳ = 17 into (i):  8X̄ − 10(17) + 66 = 0  ⇒  8X̄ = 104  ⇒  X̄ = 13"]},{"heading":"Part (b): Identify Each Line & Compute r and R²","work":["Assume Line (i) is Y on X:  10Y = 8X + 66  ⇒  Y = 0.8X + 6.6  ⇒  b_yx = 0.8","Assume Line (ii) is X on Y:  40X = 18Y + 214  ⇒  X = 0.45Y + 5.35  ⇒  b_xy = 0.45","Check product condition: b_yx · b_xy = (0.8)(0.45) = 0.36 ≤ 1 (VALID! Reversing would give (40/18)(10/8) = 2.78 > 1, impossible).","Since b_yx > 0 and b_xy > 0:  r = +√0.36 = +0.60,   and   R² = r² = 0.36 (36% variation explained)."]},{"heading":"Part (c): Find Standard Deviation σ_y","work":["Use b_yx = r · (σ_y / σ_x)  ⇒  0.8 = 0.6 × (σ_y / 3)","σ_y = (0.8 × 3) / 0.6 = 4.0"]},{"heading":"Part (d): Find Acute Angle θ Between the Two Regression Lines","work":["tan θ = [ (1 − r²) / |r| ] · [ (σ_x · σ_y) / (σ_x² + σ_y²) ]","tan θ = [ (1 − 0.36) / 0.6 ] · [ (3 × 4) / (3² + 4²) ] = (0.64 / 0.6) × (12 / 25) = (16/15) × (12/25) = 64 / 125 = 0.512","θ = arctan(0.512) = 27.11° (0.4732 rad)"]}],"finalAnswer":["(a) X̄ = 13, Ȳ = 17","(b) Line (i) is Y on X, Line (ii) is X on Y · r = +0.60 · R² = 0.36 (36%)","(c) σ_y = 4.0","(d) Acute angle θ = 27.11°"]},{"id":"ch2-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Coded Correlation, Scale Invariance & Regression of Voltage Drift on Temperature","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Origin/Scale Coding & Regression)","statement":"An electronics engineer measured ambient temperature X (°C) and voltage drift Y (mV) across n = 8 runs: X = [20, 22, 25, 28, 30, 32, 35, 38], Y = [1.2, 1.5, 1.8, 2.3, 2.5, 2.9, 3.1, 3.5]. (a) Using coded variables u = X − 30 and v = 10(Y − 2.5), compute r and R². (b) State what r would be if X is converted to °F (F = 1.8X + 32) and Y to Volts (V = Y/1000). (c) Obtain the regression equation of Y on X.","given":["n = 8 paired observations; A_x = 30, h_x = 1 (u = X − 30)","A_y = 2.5, h_y = 0.1 (since v = (Y − 2.5)/0.1 = 10(Y − 2.5))"],"tableHeaders":["X (°C)","Y (mV)","u = X−30","v = 10(Y−2.5)","u²","v²","u · v"],"tableRows":[["20","1.2","-10","-13","100","169","130"],["22","1.5","-8","-10","64","100","80"],["25","1.8","-5","-7","25","49","35"],["28","2.3","-2","-2","4","4","4"],["30","2.5","0","0","0","0","0"],["32","2.9","+2","+4","4","16","8"],["35","3.1","+5","+6","25","36","30"],["38","3.5","+8","+10","64","100","80"]],"tableTotals":["n = 8","—","∑u = -10","∑v = -12","∑u² = 286","∑v² = 474","∑uv = 367"],"steps":[{"heading":"Part (a): Compute Coded Sums, Correlation r & Coefficient of Determination R²","work":["S_uv = n∑uv − (∑u)(∑v) = 8(367) − (−10)(−12) = 2936 − 120 =
