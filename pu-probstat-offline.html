 2816","S_uu = n∑u² − (∑u)² = 8(286) − (−10)² = 2288 − 100 = 2188","S_vv = n∑v² − (∑v)² = 8(474) − (−12)² = 3792 − 144 = 3648","r_uv = 2816 / √(2188 × 3648) = 2816 / √7981824 = 2816 / 2825.2122 = +0.9967","Since h_x = +1 > 0 and h_y = +0.1 > 0 (same sign), r_xy = r_uv = +0.9967","Coefficient of Determination: R² = r² = (0.996739)² = 0.9935 (99.35% of drift variance explained by temperature)"]},{"heading":"Part (b): Origin & Scale Invariance Check (F = 1.8X + 32, V = 0.001Y)","work":["Both scale factors are strictly positive (+1.8 > 0 and +0.001 > 0), so h_F·h_V > 0.","Therefore r(F, V) = r(X, Y) = +0.9967 (completely unchanged by °C → °F or mV → V conversion)."]},{"heading":"Part (c): Regression Equation of Drift Y on Temperature X","work":["X̄ = 30 + (∑u / n) = 30 − 10/8 = 28.75 °C;   Ȳ = 2.5 + h_y·(∑v / n) = 2.5 + 0.1(−12/8) = 2.35 mV","Slope in coded units: b_vu = S_uv / S_uu = 2816 / 2188 = 1.28702","Apply scale restoration rule: b_yx = (h_y / h_x) · b_vu = (0.1 / 1) × 1.28702 = 0.1287 mV/°C","Intercept: a = Ȳ − b_yx·X̄ = 2.35 − 0.128702(28.75) = 2.35 − 3.7002 = −1.3502 mV","Equation: Ŷ = −1.3502 + 0.1287·X"]}],"finalAnswer":["(a) r = +0.9967 · R² = 0.9935 (99.35%)","(b) r(F, V) = +0.9967 (invariant under positive linear scaling)","(c) Ŷ = −1.3502 + 0.1287·X (mV)"]}],"traps":[{"id":"ch2-trap-sign-1","category":"Sign Convention","title":"Forgetting Negative Sign When Extracting r = ±√(b_yx · b_xy)","wrongApproach":"Always writing r = +√(b_yx · b_xy) even when both b_yx and b_xy are negative (e.g. b_yx = −0.8, b_xy = −0.45 → writing r = +0.6).","correctRule":"r, b_yx, and b_xy MUST always share the exact same sign! If both slopes are negative, r = −√(b_yx · b_xy) = −0.60.","examTip":"If a problem produces opposite signs for b_yx and b_xy, your arithmetic has an error—that pair is mathematically impossible."},{"id":"ch2-trap-sign-2","category":"Sign Convention","title":"Sign Flip of r Under Opposite-Sign Coding or Linear Scaling","wrongApproach":"Assuming r is always invariant when transforming X or Y with a negative multiplier (e.g., U = 50 − X and V = Y − 10).","correctRule":"r_xy = sgn(h_x · h_y) · r_uv. When one variable is reversed (negative scale) and the other keeps positive scale, r flips sign (r_xy = −r_uv).","examTip":"Write out X = A + h_x U and Y = C + h_y V explicitly before computing so the signs of h_x and h_y are unmistakable."},{"id":"ch2-trap-sign-3","category":"Sign Convention","title":"Unit Mismatch Trap in Prediction (PU Model Q2 Pattern)","wrongApproach":"Plugging X = 65000 into Ŷ = 4.0747 + 0.1046·X when the table defines X in '000 Rs.","correctRule":"Match the predictor unit strictly to the column header: \"Rs. 65 thousand\" means X = 65, yielding 10.8716 lakh Rs. (not 6803 lakh Rs.!).","examTip":"Always state units next to both variables at the top of your solution (e.g., X in '000 Rs, Y in lakh Rs.)."},{"id":"ch2-trap-geom-1","category":"Boundary & Slope Geometry","title":"Angle θ Mistake: Using Slopes Directly Without Converting X-on-Y to Y = m₂X + c","wrongApproach":"Computing tan θ = |(b_yx − b_xy) / (1 + b_yx·b_xy)| directly using b_xy as if it were dY/dX.","correctRule":"In the (X, Y) plane, line Y on X has slope m₁ = b_yx, whereas line X on Y (X = c + b_xy Y) has slope m₂ = 1 / b_xy! Hence tan θ = [(1 − r²)/|r|] · [σ_x σ_y / (σ_x² + σ_y²)].","examTip":"Check special cases: when r = ±1, θ = 0° (lines coincide); when r = 0, θ = 90° (lines are perpendicular)."},{"id":"ch2-trap-geom-2","category":"Boundary & Slope Geometry","title":"Confusing Y-on-X with X-on-Y & Failing the b_yx · b_xy ≤ 1 Test","wrongApproach":"Arbitrarily labeling the first given equation as Y on X without verifying r² = b_yx · b_xy ≤ 1.","correctRule":"Solve one equation for Y (giving candidate b_yx) and the other for X (giving candidate b_xy). If their product > 1, swap the assignment immediately!","examTip":"Also remember: never solve Y = a + b_yx X algebraically for X to predict X from a given Y—use the X-on-Y line instead."},{"id":"ch2-trap-geom-3","category":"Boundary & Slope Geometry","title":"Dropping the Scale Factor (h_y / h_x) in Coded Regression Coefficients","wrongApproach":"Assuming b_yx = b_vu when using coded variables U = (X − A)/h_x and V = (Y − C)/h_y.","correctRule":"Correlation r is scale-invariant, but regression slope is NOT: b_yx = (h_y / h_x) · b_vu.","examTip":"Check dimensions: b_vu is in coded units, so multiplying by (h_y / h_x) restores Unit(Y)/Unit(X)."},{"id":"ch2-trap-pu-1","category":"High-Yield PU Topic","title":"Model Q2 (10 Marks): Full Regression Fitting + Future Prediction","wrongApproach":"Computing only b_yx and forgetting intercept a = Ȳ − b_yx X̄, or rounding b_yx to 2 decimals.","correctRule":"Keep at least 4 decimal places in b_yx and a, write the full equation Ŷ = a + b_yx·X, and clearly box the substituted prediction with units.","examTip":"Chapter 2 carries 15/60 marks in PU—expect one 10-mark Group A numerical (regression fitting or two-lines problem) plus one 5-mark Group B theory/numerical."},{"id":"ch2-trap-pu-2","category":"High-Yield PU Topic","title":"Model Q11 (5 Marks): Correlation vs. Regression & R² Interpretation","wrongApproach":"Writing vague prose paragraphs without addressing symmetry, origin/scale properties, and causality.","correctRule":"Present a clean 5-row comparison table (Purpose, Causality, Symmetry, Origin/Scale, Bounds/Units) and cite r² = b_yx·b_xy.","examTip":"Examiners love seeing the exact distinction: Correlation is origin & scale invariant; Regression is origin invariant but scale dependent."}]},"ch3":{"id":"ch3","shortLabel":"Ch 3 · Probability","unitLabel":"Unit 3","formulaUnitLabel":"Chapter 3","headline":"Probability & Statistics — Unit 3: Probability","intro":"B.E. Exam-mastery reference covering probability axioms, permutations & combinations, additive/multiplicative laws, conditional probability, total probability, and Bayes' Theorem.","weightage":"15 / 60 Marks","hours":"6 Hrs (5 Hrs Det.)","derivations":"3 Step-by-Step","solvedCount":"Model Q1, Q5 + 2 Extra","solvedSubtitle":"Complete step-by-step solutions for every Unit 3 question in the attached 2024 PU Model Question Set (Group A Q1 & Group B Q5), plus two high-yield 10-mark exam numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 3: Probability","lectureHours":"6 Hrs (Syllabus) / 5 Hrs (Detailed Contents)","finalMarks":15,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Introduction of probability: Basic terminology (random experiment, sample space, trial and events); Types of events (mutually exclusive, equally likely, independent)","Definitions of probability (classical, empirical/statistical, axiomatic) & basic principles of counting","Laws of probability: Additive and multiplicative (statement only in detailed contents); Conditional probability; Bayes' Theorem (statement only in detailed contents)"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, Probability & Statistics (pp. 3–5) allocates 15/60 final exam marks to Unit 3 (25% of the paper) and marks Additive/Multiplicative Laws and Bayes’ Theorem as \"(statement only)\" in Detailed Course Contents. Below, every subtopic is covered across SD, D, DR, I, E, A, and N—including full step-by-step derivations of the laws and Bayes’ Theorem for complete conceptual mastery."},"notes":[{"id":"ch3-sub-1","code":"3.1","title":"Basic Terminology & Types of Events","depths":["SD","D","I","E","A"],"definitionSD":"A Random Experiment is a process whose outcomes cannot be predicted with certainty beforehand even under identical conditions. The Sample Space (S) is the set of all possible outcomes, each single performance is a Trial, and any subset E ⊆ S is an Event.","descriptionD":"Events are classified by set relationships and probabilistic structure: (1) Mutually Exclusive (Disjoint) Events cannot occur simultaneously (A ∩ B = ∅); (2) Equally Likely Events have no physical bias favoring one outcome over another; (3) Exhaustive Events cover the entire sample space (A₁ ∪ A₂ ∪ … ∪ A_k = S); (4) Independent Events occur when knowledge of one event does not alter the probability of the other (P(A ∩ B) = P(A)·P(B)).","explanationE":"A critical conceptual distinction in PU exams is Mutually Exclusive vs. Independent: if P(A) > 0 and P(B) > 0, mutually exclusive events CANNOT be independent! Because if A and B are disjoint, knowing A occurred forces P(B | A) = 0 ≠ P(B). Disjointness is a set property (A ∩ B = ∅), whereas independence is a probability product property (P(A ∩ B) = P(A)P(B)).","illustrationI":"Tossing a fair die: S = {1, 2, 3, 4, 5, 6}. Let A = {2, 4, 6} (even) and B = {1, 3, 5} (odd) → mutually exclusive and exhaustive. Let C = {1, 2} (≤ 2): P(A) = 1/2, P(C) = 1/3, P(A ∩ C) = P({2}) = 1/6 = P(A)·P(C) → A and C are independent!","applicationA":"Defining fault states in power substations (line-to-ground vs. three-phase faults as mutually exclusive categories) and modeling redundant protection relays operating independently.","keyTakeawayN":"Always test independence numerically via P(A ∩ B) = P(A)·P(B), never by intuition alone."},{"id":"ch3-sub-2","code":"3.2","title":"Definitions of Probability & Basic Principles of Counting","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Classical (Laplace) Probability defines P(A) = n(A)/n(S) for finite equally likely outcomes; Empirical (Relative Frequency) Probability defines P(A) = lim_{n→∞} (f_A / n); Axiomatic (Kolmogorov) Probability defines P: ℱ → [0, 1] satisfying (i) P(A) ≥ 0, (ii) P(S) = 1, and (iii) countable additivity for disjoint events.","descriptionD":"To count n(A) and n(S) in complex engineering problems, we use: (1) Multiplication Principle: two sequential choices of m and n ways give m × n ways; (2) Addition Principle: mutually exclusive options give m + n ways; (3) Permutations (order matters): ⁿP_r = n! / (n − r)!; (4) Combinations (order does not matter): ⁿC_r = n! / [r!(n − r)!].","explanationE":"Classical probability fails when outcomes are not equally likely (loaded die) or when S is infinite. Empirical probability requires long-run trials and yields approximations. Kolmogorov’s axiomatic framework unifies both and supports continuous sample spaces.","illustrationI":"Selecting 3 relays out of 12 without regard to order uses combinations (¹²C₃ = 220), whereas assigning 3 distinct circuit slots A, B, C to 3 relays uses permutations (¹²P₃ = 1320).","applicationA":"Quality-control lot sampling (hypergeometric defect probabilities without replacement) and reliability combinatorics of series/parallel components.","derivationDR":{"title":"Derivation (DR): Fundamental Kolmogorov Corollaries (Complement & Sub-additivity)","goal":"Prove P(A′) = 1 − P(A), P(∅) = 0, and 0 ≤ P(A) ≤ 1 directly from the 3 Kolmogorov axioms.","steps":[{"step":1,"title":"Partition Sample Space Using Event A and Complement A′","equation":"S = A ∪ A′   with   A ∩ A′ = ∅","note":"A and A′ are mutually exclusive and exhaustive."},{"step":2,"title":"Apply Axiom 2 (Normalization) and Axiom 3 (Additivity)","equation":"1 = P(S) = P(A ∪ A′) = P(A) + P(A′)   ⇒   P(A′) = 1 − P(A)","note":"Since P(A′) ≥ 0 by Axiom 1, we immediately obtain P(A) ≤ 1, hence 0 ≤ P(A) ≤ 1."},{"step":3,"title":"Probability of Impossible Event (∅)","equation":"∅ = S′   ⇒   P(∅) = 1 − P(S) = 1 − 1 = 0","note":"Also implies monotonicity: if A ⊆ B, then B = A ∪ (B ∩ A′) ⇒ P(B) = P(A) + P(B ∩ A′) ≥ P(A)."}],"result":"P(A′) = 1 − P(A),   0 ≤ P(A) ≤ 1,   P(∅) = 0,   and   P(A ∩ B′) = P(A) − P(A ∩ B)."},"keyTakeawayN":"For \"at least one\" problems, almost always compute 1 − P(none) using the complement rule—it eliminates tedious multi-case addition."},{"id":"ch3-sub-3","code":"3.3","title":"Additive & Multiplicative Laws of Probability","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"The Additive Law gives the probability of the union of events: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). The Multiplicative Law gives the probability of the intersection of events: P(A ∩ B) = P(A)·P(B | A) = P(B)·P(A | B).","descriptionD":"Special cases frequently tested: (1) If A and B are mutually exclusive (A ∩ B = ∅), the additive law reduces to P(A ∪ B) = P(A) + P(B); (2) For three events, inclusion-exclusion gives P(A ∪ B ∪ C) = P(A)+P(B)+P(C) − P(A∩B)−P(A∩C)−P(B∩C) + P(A∩B∩C); (3) If A and B are independent, the multiplicative law reduces to P(A ∩ B) = P(A)·P(B).","explanationE":"Note that PU Detailed Course Contents marks Additive & Multiplicative laws as \"(statement only)\". Understanding the set-partition proof ensures you never forget to subtract P(A ∩ B) for overlapping events—or add P(A ∩ B ∩ C) back in for three events!","illustrationI":"In PU Model Q5, winning contract A (0.6) and contract B (0.4) overlap with probability P(A ∩ B) = 0.2. Simply adding 0.6 + 0.4 would double-count the 0.2 overlap; subtracting it gives P(A ∪ B) = 0.8.","applicationA":"Computing system reliability: parallel redundancy (system works if at least one unit works → Additive / complement law) vs. series chain (system works only if all units work → Multiplicative law).","derivationDR":{"title":"Derivation (DR): General Additive Law & Difference Event P(A ∩ B′)","goal":"Prove P(A ∪ B) = P(A) + P(B) − P(A ∩ B) and P(A ∩ B′) = P(A) − P(A ∩ B) from disjoint set partitions.","steps":[{"step":1,"title":"Decompose Event A into Two Disjoint Parts","equation":"A = (A ∩ B′) ∪ (A ∩ B),   where (A ∩ B′) ∩ (A ∩ B) = ∅","note":"By Axiom 3: P(A) = P(A ∩ B′) + P(A ∩ B)  ⇒  P(A ∩ B′) = P(A) − P(A ∩ B)."},{"step":2,"title":"Decompose Union A ∪ B into Disjoint Parts","equation":"A ∪ B = (A ∩ B′) ∪ B,   where (A ∩ B′) ∩ B = ∅","note":"Apply Axiom 3 to the disjoint union:"},{"step":3,"title":"Substitute P(A ∩ B′) into Union Equation","equation":"P(A ∪ B) = P(A ∩ B′) + P(B) = P(A) − P(A ∩ B) + P(B) = P(A) + P(B) − P(A ∩ B)","note":"Reduces to P(A) + P(B) whenever A ∩ B = ∅."}],"result":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)   and   P(A ∩ B′) = P(A) − P(A ∩ B)."},"keyTakeawayN":"Parallel system reliability with n independent units: R_parallel = 1 − ∏(1 − Rᵢ); Series system reliability: R_series = ∏Rᵢ."},{"id":"ch3-sub-4","code":"3.4","title":"Conditional Probability, Law of Total Probability & Bayes' Theorem","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"Conditional Probability of event A given that event B has already occurred (P(B) > 0) is P(A | B) = P(A ∩ B) / P(B). Bayes' Theorem updates prior probabilities P(Eᵢ) of mutually exclusive, exhaustive causes into posterior probabilities P(Eᵢ | A) after observing evidence A.","descriptionD":"Let {E₁, E₂, …, E_k} be a partition of S (mutually exclusive and exhaustive causes with P(Eᵢ) > 0). The Law of Total Probability gives the unconditional probability of evidence A: P(A) = ∑ P(Eᵢ)·P(A | Eᵢ). Bayes’ Theorem then computes the inverse probability P(E_r | A) that cause E_r produced the observed outcome A.","explanationE":"Bayes’ Theorem is marked \"(statement only)\" in PU Detailed Course Contents, yet it is the #1 guaranteed 10-mark Group A question (see PU Model Q1!). Think of P(Eᵢ) as prior beliefs before inspecting the component, P(A | Eᵢ) as the forward likelihood (defect rate of machine i), and P(Eᵢ | A) as the backward diagnostic probability given the component is defective.","illustrationI":"In PU Model Q1, Machine M₃ produces 50% of parts at a 3% defect rate, contributing 0.50 × 0.03 = 0.015 out of the total 0.023 defect probability—so given a defective part, there is a 15/23 (65.22%) chance it came from M₃.","applicationA":"Fault localization across parallel production lines (PU Model Q1), digital communication error decoding (BSC channel), and medical/biomedical diagnostic test sensitivity.","derivationDR":{"title":"Derivation (DR): Law of Total Probability & Bayes' Theorem","goal":"Given partition E₁, …, E_k of S and evidence A with P(A) > 0, derive P(E_r | A).","steps":[{"step":1,"title":"Partition Evidence Event A Across Causes","equation":"A = A ∩ S = A ∩ (E₁ ∪ E₂ ∪ … ∪ E_k) = (A ∩ E₁) ∪ (A ∩ E₂) ∪ … ∪ (A ∩ E_k)","note":"Because Eᵢ are pairwise disjoint, the intersections (A ∩ Eᵢ) are also pairwise disjoint."},{"step":2,"title":"Apply Axiom 3 & Multiplicative Law (Total Probability)","equation":"P(A) = ∑_{i=1}^k P(A ∩ Eᵢ) = ∑_{i=1}^k P(Eᵢ) · P(A | Eᵢ)","note":"Each term P(Eᵢ)·P(A | Eᵢ) is the joint probability along branch i of the probability tree."},{"step":3,"title":"Apply Definition of Conditional Probability for Cause E_r","equation":"P(E_r | A) = P(E_r ∩ A) / P(A) = [ P(E_r) · P(A | E_r) ] / [ ∑_{i=1}^k P(Eᵢ) · P(A | Eᵢ) ]","note":"Notice that ∑_{r=1}^k P(E_r | A) = 1 always serves as an instant arithmetic check!"}],"result":"P(E_r | A) = [ P(E_r)·P(A | E_r) ] / [ ∑ P(Eᵢ)·P(A | Eᵢ) ]."},"keyTakeawayN":"Always construct a 4-column Bayes Table (Cause Eᵢ | Prior P(Eᵢ) | Likelihood P(A|Eᵢ) | Joint P(Eᵢ∩A)) and verify ∑P(Eᵢ|A) = 1."}],"formulas":[{"id":"ch3-f-classical","category":"Location","quantity":"Classical & Empirical Probability","symbol":"P(A)","formula":"P(A) = n(A) / n(S)   |   P(A) = lim_{n→∞} (f_A / n)","assumptionOrConstant":"Classical requires finite, mutually exclusive & equally likely outcomes","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-counting","category":"Location","quantity":"Permutations & Combinations","symbol":"ⁿP_r, ⁿC_r","formula":"ⁿP_r = n! / (n − r)!   |   ⁿC_r = n! / [r!(n − r)!]","assumptionOrConstant":"0! = 1; use ⁿP_r when order matters, ⁿC_r when order does not","unit":"Count (ways)"},{"id":"ch3-f-axioms","category":"Location","quantity":"Kolmogorov Axioms & Complement Rule","symbol":"P(A′)","formula":"P(A) ≥ 0;   P(S) = 1;   P(A′) = 1 − P(A);   P(∅) = 0","assumptionOrConstant":"Disjoint countable additivity: P(⋃Aᵢ) = ∑P(Aᵢ) if Aᵢ ∩ Aⱼ = ∅","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-additive2","category":"Dispersion","quantity":"Additive Law (2 Events) & Difference","symbol":"P(A ∪ B)","formula":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B);   P(A ∩ B′) = P(A) − P(A ∩ B)","assumptionOrConstant":"Reduces to P(A) + P(B) if mutually exclusive (A ∩ B = ∅)","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-additive3","category":"Dispersion","quantity":"Additive Law (3 Events) & De Morgan","symbol":"P(A ∪ B ∪ C)","formula":"∑P(A) − ∑P(A∩B) + P(A∩B∩C);   P(A′ ∩ B′) = 1 − P(A ∪ B)","assumptionOrConstant":"For independent events: P(at least one) = 1 − ∏[1 − P(Aᵢ)]","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-cond","category":"Dispersion","quantity":"Conditional Probability & Multiplicative Law","symbol":"P(A | B)","formula":"P(A | B) = P(A ∩ B) / P(B);   P(A ∩ B) = P(A)·P(B | A)","assumptionOrConstant":"Requires P(B) > 0; P(A′ | B) = 1 − P(A | B)","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-indep","category":"Properties & Constants","quantity":"Statistical Independence (2 & 3 Events)","symbol":"A ⊥ B","formula":"P(A ∩ B) = P(A)·P(B)   ⇔   P(A | B) = P(A)","assumptionOrConstant":"3 events need pairwise AND triple product P(A∩B∩C) = P(A)P(B)P(C)","unit":"Condition"},{"id":"ch3-f-total-prob","category":"Properties & Constants","quantity":"Law of Total Probability","symbol":"P(A)","formula":"P(A) = ∑_{i=1}^k P(Eᵢ) · P(A | Eᵢ)","assumptionOrConstant":"{E₁,…,E_k} must be mutually exclusive and exhaustive (∑P(Eᵢ) = 1)","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch3-f-bayes","category":"Properties & Constants","quantity":"Bayes' Theorem (Posterior Probability)","symbol":"P(E_r | A)","formula":"P(E_r | A) = [ P(E_r)·P(A | E_r) ] / [ ∑_{i=1}^k P(Eᵢ)·P(A | Eᵢ) ]","assumptionOrConstant":"P(A) > 0; ∑_{r=1}^k P(E_r | A) = 1 (posterior normalization)","unit":"Dimensionless ∈ [0, 1]"}],"categoryLabels":{"Location":"Axioms & Counting","Dispersion":"Laws & Conditional","Properties & Constants":"Independence & Bayes'"},"questions":[{"id":"pu-model-q1","tag":"PU Model Set · Group A, Q1","title":"Bayes' Theorem: Defective Electronic Components Across Three Machines","marks":"10 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 7","statement":"Three different machines M₁, M₂, and M₃ are used to produce similar electronic components. Machines M₁, M₂, and M₃ produce 20%, 30% and 50% of the components respectively. It is known that the probabilities that the machines produce defective components are 1% for M₁, 2% for M₂, and 3% for M₃. If a component is selected randomly from a large batch, and that component is defective, find the probability that it was produced: (a) by M₂, and (b) by M₃.","given":["Let M₁, M₂, M₃ be the mutually exclusive and exhaustive events that a component is produced by machine 1, 2, or 3.","Let D be the event that the randomly selected component is defective.","Prior probabilities: P(M₁) = 0.20, P(M₂) = 0.30, P(M₃) = 0.50 (check: 0.20 + 0.30 + 0.50 = 1.00).","Conditional defect rates: P(D | M₁) = 0.01, P(D | M₂) = 0.02, P(D | M₃) = 0.03."],"tableHeaders":["Machine (Mᵢ)","Prior P(Mᵢ)","Defect Rate P(D | Mᵢ)","Joint P(Mᵢ ∩ D)","Posterior P(Mᵢ | D)"],"tableRows":[["M₁","0.20","0.01","0.20 × 0.01 = 0.0020","0.0020 / 0.0230 = 2/23 (0.0870)"],["M₂","0.30","0.02","0.30 × 0.02 = 0.0060","0.0060 / 0.0230 = 6/23 (0.2609)"],["M₃","0.50","0.03","0.50 × 0.03 = 0.0150","0.0150 / 0.0230 = 15/23 (0.6522)"]],"tableTotals":["Total","∑ = 1.00","—","P(D) = 0.0230","∑ = 23/23 = 1.0000"],"steps":[{"heading":"Step 1: Compute Total Probability of a Defective Component P(D)","work":["By the Law of Total Probability:","P(D) = P(M₁)·P(D | M₁) + P(M₂)·P(D | M₂) + P(M₃)·P(D | M₃)","P(D) = (0.20)(0.01) + (0.30)(0.02) + (0.50)(0.03) = 0.002 + 0.006 + 0.015 = 0.0230"]},{"heading":"Step 2 (a): Find P(M₂ | D) Using Bayes' Theorem","work":["P(M₂ | D) = [ P(M₂)·P(D | M₂) ] / P(D) = 0.0060 / 0.0230 = 6 / 23 = 0.26087 ≈ 0.2609 (26.09%)"]},{"heading":"Step 3 (b): Find P(M₃ | D) Using Bayes' Theorem","work":["P(M₃ | D) = [ P(M₃)·P(D | M₃) ] / P(D) = 0.0150 / 0.0230 = 15 / 23 = 0.65217 ≈ 0.6522 (65.22%)","(Check: P(M₁ | D) = 2/23 ≈ 0.0870, and 2/23 + 6/23 + 15/23 = 23/23 = 1)"]}],"finalAnswer":["(a) Probability defective component was produced by M₂: 6/23 ≈ 0.2609 (26.09%)","(b) Probability defective component was produced by M₃: 15/23 ≈ 0.6522 (65.22%)"]},{"id":"pu-model-q5","tag":"PU Model Set · Group B, Q5","title":"Additive Law & Set Difference: Construction Contract Bidding","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 8","statement":"A company has bid on two large construction projects. The company president believes that the probability of winning the first contract is 0.6, the probability of winning the second contract is 0.4, and the probability of winning both contracts is 0.2. (a) What is the probability that the company wins at least one contract? (b) What is the probability that the company wins the first contract but not the second contract?","given":["Let A = event of winning the first contract, B = event of winning the second contract.","Given: P(A) = 0.6,   P(B) = 0.4,   and   P(A ∩ B) = 0.2.","Note: P(A)·P(B) = 0.24 ≠ 0.2, so A and B are NOT independent."],"steps":[{"heading":"Part (a): Probability of Winning At Least One Contract P(A ∪ B)","work":["By the General Additive Law of Probability:","P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","P(A ∪ B) = 0.6 + 0.4 − 0.2 = 0.8 (or 80%)"]},{"heading":"Part (b): Probability of Winning First Contract But Not Second P(A ∩ B′)","work":["Event \"A occurs and B does not\" is (A ∩ B′). Since A = (A ∩ B′) ∪ (A ∩ B) disjointly:","P(A ∩ B′) = P(A) − P(A ∩ B)","P(A ∩ B′) = 0.6 − 0.2 = 0.4 (or 40%)"]}],"finalAnswer":["(a) P(wins at least one contract) = 0.80 (80%)","(b) P(wins first contract but not second) = 0.40 (40%)"]},{"id":"ch3-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Combinatorics, Conditional Inspection & Independent Protection Alarms","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Counting, Conditional & Independent Events)","statement":"A power distribution panel contains 12 relays, of which 4 are faulty and 8 are healthy. (a) If 3 relays are selected at random without replacement, find the probability that: (i) all 3 are healthy, (ii) at least 1 is faulty, and (iii) exactly 2 are healthy given that at least 1 is healthy. (b) Separately, three independent protection alarms A, B, and C detect an over-current fault with probabilities P(A) = 0.80, P(B) = 0.75, and P(C) = 0.60. Find the probability that the fault is detected by (i) at least one alarm, and (ii) exactly two alarms.","given":["Part (a): Total relays = 12 (8 healthy, 4 faulty); sample size = 3 without replacement ⇒ n(S) = ¹²C₃ = 220.","Part (b): Independent alarms with P(A) = 0.80, P(B) = 0.75, P(C) = 0.60 ⇒ P(A′) = 0.20, P(B′) = 0.25, P(C′) = 0.40."],"steps":[{"heading":"Part (a)(i) & (ii): Counting Combinations Without Replacement","work":["Total combinations: ¹²C₃ = (12 × 11 × 10) / (3 × 2 × 1) = 220","(i) P(all 3 healthy) = ⁸C₃ / ¹²C₃ = 56 / 220 = 14 / 55 ≈ 0.2545","(ii) P(at least 1 faulty) = 1 − P(all 3 healthy) = 1 − 14/55 = 41 / 55 ≈ 0.7455"]},{"heading":"Part (a)(iii): Conditional Probability P(2 Healthy, 1 Faulty | At Least 1 Healthy)","work":["Let E = {2 healthy, 1 faulty} and F = {at least 1 healthy}. Notice E ⊆ F ⇒ E ∩ F = E.","P(E) = (⁸C₂ × ⁴C₁) / 220 = (28 × 4) / 220 = 112 / 220 = 28 / 55","P(F) = 1 − P(all 3 faulty) = 1 − (⁴C₃ / 220) = 1 − (4 / 220) = 216 / 220 = 54 / 55","P(E | F) = P(E ∩ F) / P(F) = (112 / 220) / (216 / 220) = 112 / 216 = 14 / 27 ≈ 0.5185"]},{"heading":"Part (b): Independent Protection Alarms (Multiplicative & Complement Rules)","work":["(i) P(at least 1 alarm) = 1 − P(A′ ∩ B′ ∩ C′) = 1 − P(A′)·P(B′)·P(C′) = 1 − (0.20)(0.25)(0.40) = 1 − 0.020 = 0.980","(ii) P(exactly 2 alarms) = P(A∩B∩C′) + P(A∩B′∩C) + P(A′∩B∩C)","= (0.80)(0.75)(0.40) + (0.80)(0.25)(0.60) + (0.20)(0.75)(0.60) = 0.240 + 0.120 + 0.090 = 0.450"]}],"finalAnswer":["(a) (i) 14/55 (0.2545) · (ii) 41/55 (0.7455) · (iii) 14/27 (0.5185)","(b) (i) P(≥ 1 alarm) = 0.980 (98%) · (ii) P(exactly 2 alarms) = 0.450 (45%)"]},{"id":"ch3-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Digital Communication Channel: Total Probability, Bayes' Decoding & Bit Error Rate","marks":"10 Marks Pattern","source":"High-Yield PU Exam Practice (Electronics / ECE Bayes' Theorem)","statement":"In a noisy digital communication channel, binary symbols 0 and 1 are transmitted with prior probabilities P(T₀) = 0.45 and P(T₁) = 0.55. Due to channel noise, a transmitted 0 is received as 1 with probability 0.04, and a transmitted 1 is received as 0 with probability 0.02. Find: (a) the total probability that a randomly received bit is 1, P(R₁); (b) the posterior probability P(T₁ | R₁) that a 1 was transmitted given a 1 was received; and (c) the overall bit transmission error probability.","given":["Priors: P(T₀) = 0.45, P(T₁) = 0.55","Channel error transitions: P(R₁ | T₀) = 0.04 ⇒ P(R₀ | T₀) = 0.96;   P(R₀ | T₁) = 0.02 ⇒ P(R₁ | T₁) = 0.98"],"tableHeaders":["Transmitted (Tᵢ)","Prior P(Tᵢ)","P(R₁ | Tᵢ)","Joint P(Tᵢ ∩ R₁)","Posterior P(Tᵢ | R₁)"],"tableRows":[["T₀ (Bit 0)","0.45","0.04","0.45 × 0.04 = 0.0180","0.0180 / 0.5570 = 0.0323"],["T₁ (Bit 1)","0.55","0.98","0.55 × 0.98 = 0.5390","0.5390 / 0.5570 = 0.9677"]],"tableTotals":["Total","∑ = 1.00","—","P(R₁) = 0.5570","∑ = 1.0000"],"steps":[{"heading":"Part (a): Total Probability of Receiving Bit 1","work":["P(R₁) = P(T₀)·P(R₁ | T₀) + P(T₁)·P(R₁ | T₁)","P(R₁) = (0.45)(0.04) + (0.55)(0.98) = 0.0180 + 0.5390 = 0.5570"]},{"heading":"Part (b): Posterior Probability P(T₁ | R₁) via Bayes' Theorem","work":["P(T₁ | R₁) = [ P(T₁)·P(R₁ | T₁) ] / P(R₁) = 0.5390 / 0.5570 = 539 / 557 = 0.96768 ≈ 0.9677 (96.77%)"]},{"heading":"Part (c): Overall Bit Transmission Error Probability","work":["An error occurs if (T₀ and R₁) OR (T₁ and R₀):","P(Error) = P(T₀)·P(R₁ | T₀) + P(T₁)·P(R₀ | T₁) = (0.45)(0.04) + (0.55)(0.02) = 0.0180 + 0.0110 = 0.0290 (2.90%)"]}],"finalAnswer":["(a) P(R₁) = 0.5570","(b) P(T₁ | R₁) = 539/557 ≈ 0.9677 (96.77%)","(c) Bit Error Probability = 0.0290 (2.90%)"]}],"traps":[{"id":"ch3-trap-sign-1","category":"Sign Convention","title":"Additive Law Sign Error: Adding Instead of Subtracting P(A ∩ B)","wrongApproach":"Writing P(A ∪ B) = P(A) + P(B) + P(A ∩ B), or forgetting to subtract P(A ∩ B) when events overlap (yields P > 1!).","correctRule":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B). For three events, alternate signs via inclusion-exclusion: + singles − pairs + triple.","examTip":"If your calculated probability ever falls outside [0, 1], immediately check the sign before P(A ∩ B)."},{"id":"ch3-trap-sign-2","category":"Sign Convention","title":"Confusing \"Mutually Exclusive\" with \"Independent\"","wrongApproach":"Assuming mutually exclusive events satisfy P(A ∩ B) = P(A)·P(B), OR assuming independent events satisfy P(A ∪ B) = P(A) + P(B).","correctRule":"Mutually exclusive ⇒ P(A ∩ B) = 0 and P(A ∪ B) = P(A) + P(B). Independent ⇒ P(A ∩ B) = P(A)·P(B) and P(A ∪ B) = P(A) + P(B) − P(A)P(B).","examTip":"Two positive-probability events CANNOT be both mutually exclusive and independent."},{"id":"ch3-trap-sign-3","category":"Sign Convention","title":"Using Independent Formula P(A)P(B) When Events Are Dependent (Model Q5)","wrongApproach":"Computing P(A ∩ B′) = P(A)·(1 − P(B)) = 0.6 × 0.6 = 0.36 in Model Q5.","correctRule":"In Model Q5, P(A)P(B) = 0.24 ≠ 0.2 = P(A ∩ B), so A and B are dependent! You MUST use P(A ∩ B′) = P(A) − P(A ∩ B) = 0.6 − 0.2 = 0.4.","examTip":"Always check whether P(A ∩ B) equals P(A)P(B) before using complement multiplication."},{"id":"ch3-trap-geom-1","category":"Boundary & Slope Geometry","title":"Reversing Conditional Direction: P(D | M₂) vs. P(M₂ | D)","wrongApproach":"Confusing the forward branch probability P(D | M₂) = 0.02 with the inverse Bayes posterior P(M₂ | D).","correctRule":"The event AFTER the vertical bar \"|\" is ALWAYS the KNOWN condition/evidence. In Model Q1, \"given the component is defective\" means D is after the bar: solve for P(M₂ | D).","examTip":"Draw a 2-stage probability tree left-to-right: Stage 1 is causes (Mᵢ), Stage 2 is test/defect (D); Bayes reverses the arrows."},{"id":"ch3-trap-geom-2","category":"Boundary & Slope Geometry","title":"Sampling Without Replacement vs. With Replacement","wrongApproach":"Treating 3 draws from 12 relays as independent Bernoulli trials (8/12)³ instead of hypergeometric without-replacement draws.","correctRule":"Without replacement changes the denominator and numerator on each draw: (8/12)(7/11)(6/10) = ⁸C₃ / ¹²C₃ = 14/55.","examTip":"Read carefully for phrases like \"drawn simultaneously\", \"without replacement\", or \"from a large batch\" (infinite-batch approximation)."},{"id":"ch3-trap-geom-3","category":"Boundary & Slope Geometry","title":"Pairwise Independence ≠ Mutual Independence for 3 Events","wrongApproach":"Checking only P(A∩B)=P(A)P(B), P(B∩C)=P(B)P(C), P(A∩C)=P(A)P(C) to claim A, B, C are mutually independent.","correctRule":"Mutual independence of 3 events requires ALL THREE pairwise products PLUS the triple product P(A ∩ B ∩ C) = P(A)P(B)P(C).","examTip":"For \"at least one of A, B, C\", complement 1 − P(A′∩B′∩C′) only simplifies to 1 − P(A′)P(B′)P(C′) under mutual independence."},{"id":"ch3-trap-pu-1","category":"High-Yield PU Topic","title":"Model Q1 (10 Marks): 3-Source Bayes' Theorem Table","wrongApproach":"Leaving out the denominator P(D) calculation or forgetting to normalize posteriors.","correctRule":"Present a clean 5-column Bayes table (Cause, Prior, Likelihood, Joint, Posterior), explicitly compute P(D), and verify ∑P(Mᵢ | D) = 1.","examTip":"Unit 3 carries 15/60 marks in PU—Bayes’ Theorem is virtually guaranteed as a 10-mark Group A question."},{"id":"ch3-trap-pu-2","category":"High-Yield PU Topic","title":"Model Q5 (5 Marks): Set Operations (At Least One / Only A / Neither)","wrongApproach":"Mixing up \"wins only the first\" P(A ∩ B′) with \"wins neither\" P(A′ ∩ B′).","correctRule":"Translate English phrases cleanly: \"At least one\" → A ∪ B; \"A but not B\" → A ∩ B′ = P(A) − P(A∩B); \"Neither\" → 1 − P(A∪B).","examTip":"Sketching a small Venn diagram beside your 5-mark solution prevents any set-complement mix-ups."}]},"ch4":{"id":"ch4","shortLabel":"Ch 4 · Random Var","unitLabel":"Unit 4","formulaUnitLabel":"Chapter 4","headline":"Probability & Statistics — Unit 4: Random Variable and Expectation","intro":"B.E. Exam-mastery reference covering discrete & continuous random variables, PMF/PDF/CDF, expected value, variance, and linear moment properties.","weightage":"5 / 60 Marks","hours":"3 Hrs (2 Hrs Det.)","derivations":"4 Step-by-Step","solvedCount":"Model Q6 + 2 Extra","solvedSubtitle":"Complete step-by-step solution for the Unit 4 question in the attached 2024 PU Model Question Set (Group B Q6), plus two high-yield exam numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 4: Random Variable and Expectation","lectureHours":"3 Hrs (Syllabus) / 2 Hrs (Detailed Contents)","finalMarks":5,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Random Variables: Discrete and continuous random variables","Probability distribution of random variables (PMF, PDF, and CDF)","Expected value and variance of discrete & continuous random variables"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, Probability & Statistics (pp. 3–5) allocates 5/60 final exam marks to Unit 4 (typically 1 Group B 5-mark question—see Model Q6 on p. 8). Explicit SD/D/DR/I/E/A/EX/N grids appear for the other engineering subjects in the PDF; here every Unit 4 subtopic is covered across SD, D, DR, I, E, A, and N with full step-by-step derivations."},"notes":[{"id":"ch4-sub-1","code":"4.1","title":"Random Variables: Discrete vs. Continuous","depths":["SD","D","I","E","A"],"definitionSD":"A Random Variable (X) is a real-valued function X: S → ℝ that assigns a unique real number to every outcome in the sample space S of a random experiment.","descriptionD":"Random variables bridge raw non-numeric outcomes (Heads/Tails, Pass/Fail) to mathematical analysis and fall into two classes: (1) Discrete Random Variable, whose range is finite or countably infinite (isolated integers such as 0, 1, 2, …); and (2) Continuous Random Variable, whose range spans an uncountably infinite interval of real numbers [a, b] or (−∞, ∞).","explanationE":"The distinction governs which mathematical operator we use: Discrete RVs accumulate probability via summation (∑) at individual points, whereas Continuous RVs accumulate probability via integration (∫) over intervals because the probability at any single exact real point is zero: P(X = c) = 0.","illustrationI":"Counting the number of dropped packets in 100 transmissions produces a discrete RV X ∈ {0, 1, …, 100}. Measuring the exact arrival delay of a packet in milliseconds produces a continuous RV T ∈ [0, ∞).","applicationA":"Modeling digital bit errors and component failure counts (discrete) vs. thermal noise voltage, breakdown voltage, and component lifetime (continuous).","keyTakeawayN":"For continuous RVs, P(a ≤ X ≤ b) = P(a < X < b); for discrete RVs, strict (<) vs. inclusive (≤) inequalities give DIFFERENT probabilities!"},{"id":"ch4-sub-2","code":"4.2","title":"Probability Distribution (PMF, PDF & Cumulative Distribution Function CDF)","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"For a discrete RV, the Probability Mass Function (PMF) is p(x) = P(X = x). For a continuous RV, the Probability Density Function (PDF) is a non-negative function f(x) whose integral over [a, b] equals P(a ≤ X ≤ b). The Cumulative Distribution Function (CDF) for any RV is F(x) = P(X ≤ x).","descriptionD":"A valid PMF must satisfy: (i) p(xᵢ) ≥ 0 for all xᵢ, and (ii) ∑ p(xᵢ) = 1. A valid PDF must satisfy: (i) f(x) ≥ 0 for all x ∈ ℝ, and (ii) ∫_{−∞}^{∞} f(x) dx = 1. Note carefully that f(x) is a density (probability per unit x), NOT a probability—so f(x) CAN exceed 1 as long as its total area under the curve equals 1!","explanationE":"In PU exams, finding an unknown constant k (discrete, as in Model Q6) or c (continuous) almost always uses the normalization condition ∑ p(xᵢ) = 1 or ∫ f(x) dx = 1, followed by checking non-negativity.","illustrationI":"A uniform PDF on [0, 0.5] has constant height f(x) = 2 (> 1!), yet its total area is 2 × 0.5 = 1. Meanwhile, its CDF ramps linearly from F(0) = 0 to F(0.5) = 1.","applicationA":"Determining normalizing constants in reliability models, computing survival probabilities P(T > t) = 1 − F(t), and extracting median/quantiles from F(x) = 0.5.","derivationDR":{"title":"Derivation (DR): Interval Probability from CDF & Why P(X = c) = 0 for Continuous RVs","goal":"Prove P(a < X ≤ b) = F(b) − F(a), and show P(X = c) = 0 when F(x) is continuous.","steps":[{"step":1,"title":"Partition Event {X ≤ b} Disjointly","equation":"{X ≤ b} = {X ≤ a} ∪ {a < X ≤ b},   where {X ≤ a} ∩ {a < X ≤ b} = ∅ (for a < b)","note":"Apply finite additivity of probability (Kolmogorov Axiom 3):"},{"step":2,"title":"Apply CDF Definition F(x) = P(X ≤ x)","equation":"P(X ≤ b) = P(X ≤ a) + P(a < X ≤ b)   ⇒   P(a < X ≤ b) = F(b) − F(a)","note":"Holds universally for BOTH discrete and continuous random variables."},{"step":3,"title":"Continuous Point Probability Limit","equation":"P(X = c) = ∫_c^c f(x) dx = 0   (or lim_{ε→0⁺} [F(c) − F(c − ε)] = 0)","note":"Therefore for continuous RVs: P(a ≤ X ≤ b) = P(a < X ≤ b) = P(a < X < b) = F(b) − F(a) = ∫_a^b f(x) dx."}],"result":"P(a < X ≤ b) = F(b) − F(a);   f(x) = dF(x)/dx (continuous);   p(xᵢ) = F(xᵢ) − F(xᵢ⁻) (discrete)."},"keyTakeawayN":"When solving for k or c, always reject any root that makes p(x) < 0 or f(x) < 0 on the support!"},{"id":"ch4-sub-3","code":"4.3","title":"Expected Value, Moments, Variance & Linear Transformation Laws","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"The Expected Value (mean μ) of X is E(X) = ∑ xᵢ·p(xᵢ) for discrete X, or E(X) = ∫_{−∞}^{∞} x·f(x) dx for continuous X. For any function g(X), E[g(X)] = ∑ g(xᵢ)p(xᵢ) or ∫ g(x)f(x) dx. Variance is Var(X) = σ² = E[(X − μ)²].","descriptionD":"Expected value represents the long-run probability-weighted average (first moment about the origin). Variance measures expected squared spread around the mean (second central moment), and Standard Deviation σ = √Var(X) restores the original units of X.","explanationE":"Linearity of expectation E(aX + b) = aE(X) + b holds unconditionally. For a quadratic cost function g(X) = aX² + bX + c, E[g(X)] = aE(X²) + bE(X) + c—remember that E(X²) ≠ [E(X)]² unless Var(X) = 0!","illustrationI":"In PU Model Q6, X takes negative and positive values (−2 to 3) with weights p(x). The fulcrum where the distribution balances is E(X) = 0.8, and the rotational moment of inertia around 0.8 is Var(X) = 2.16.","applicationA":"Calculating expected maintenance cost E(C), expected RMS noise power E(V²) = σ² + μ², and risk variance in power engineering.","derivationDR":{"title":"Derivations (DR): Linearity of Expectation, Computational Variance & Scaling Law","goal":"Prove: (i) E(aX + b) = aE(X) + b, (ii) Var(X) = E(X²) − [E(X)]², and (iii) Var(aX + b) = a²Var(X).","steps":[{"step":1,"title":"Linearity of Expectation (Discrete & Continuous)","equation":"E(aX + b) = ∑(axᵢ + b)p(xᵢ) = a∑xᵢp(xᵢ) + b∑p(xᵢ) = a·E(X) + b·1 = aE(X) + b","note":"Identical proof with ∫_{−∞}^{∞} (ax + b)f(x) dx = a∫xf(x)dx + b∫f(x)dx = aE(X) + b."},{"step":2,"title":"Expand Variance Definition","equation":"Var(X) = E[(X − μ)²] = E[X² − 2μX + μ²]","note":"Apply linearity of expectation (since μ = E(X) is a constant):"},{"step":3,"title":"Computational Variance Formula","equation":"Var(X) = E(X²) − 2μ·E(X) + μ² = E(X²) − 2μ² + μ² = E(X²) − [E(X)]²","note":"Notice that E(X²) = Var(X) + μ² ≥ μ² always!"},{"step":4,"title":"Origin & Scale Law for Variance","equation":"Let Y = aX + b ⇒ E(Y) = aμ + b ⇒ Y − E(Y) = a(X − μ)","note":"Substitute into Var(Y) = E[(Y − E(Y))²]:"},{"step":5,"title":"Extract Constant Factor a²","equation":"Var(aX + b) = E[a²(X − μ)²] = a²·E[(X − μ)²] = a²·Var(X)   ⇒   SD(aX + b) = |a|·SD(X)","note":"Additive shift b cancels out completely; negative scale flips sign in E(Y) but squares to +a² in Var(Y)."}],"result":"E(aX + b) = aE(X) + b;   Var(X) = E(X²) − [E(X)]²;   Var(aX + b) = a²Var(X);   SD(aX + b) = |a|SD(X)."},"keyTakeawayN":"In Model Q6-type questions, always include a clean 4-column table: x | P(x) | x·P(x) | x²·P(x), then compute Var(X) = ∑x²P(x) − [∑xP(x)]²."}],"formulas":[{"id":"ch4-f-pmf","category":"Location","quantity":"Discrete PMF Normalization","symbol":"p(x)","formula":"p(xᵢ) = P(X = xᵢ) ≥ 0   and   ∑ p(xᵢ) = 1","assumptionOrConstant":"Sum runs over all discrete support points xᵢ","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch4-f-pdf","category":"Location","quantity":"Continuous PDF & Interval Probability","symbol":"f(x)","formula":"f(x) ≥ 0,   ∫_{−∞}^{∞} f(x) dx = 1,   P(a ≤ X ≤ b) = ∫_a^b f(x) dx","assumptionOrConstant":"P(X = c) = 0; f(x) is density (can exceed 1)","unit":"f(x): 1 / Unit(X)"},{"id":"ch4-f-cdf","category":"Location","quantity":"Cumulative Distribution Function (CDF)","symbol":"F(x)","formula":"F(x) = P(X ≤ x) = ∑_{xᵢ ≤ x} p(xᵢ)   or   ∫_{−∞}^x f(t) dt","assumptionOrConstant":"0 ≤ F(x) ≤ 1; non-decreasing; P(a < X ≤ b) = F(b) − F(a)","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch4-f-exp-d","category":"Dispersion","quantity":"Expected Value (Discrete)","symbol":"E(X), μ","formula":"E(X) = ∑ xᵢ · p(xᵢ);   E[g(X)] = ∑ g(xᵢ) · p(xᵢ)","assumptionOrConstant":"Requires absolute convergence ∑|xᵢ|p(xᵢ) < ∞","unit":"Same as X"},{"id":"ch4-f-exp-c","category":"Dispersion","quantity":"Expected Value (Continuous)","symbol":"E(X), μ","formula":"E(X) = ∫_{−∞}^{∞} x · f(x) dx;   E[g(X)] = ∫_{−∞}^{∞} g(x) · f(x) dx","assumptionOrConstant":"Integral limits restrict to nonzero support of f(x)","unit":"Same as X"},{"id":"ch4-f-var","category":"Dispersion","quantity":"Variance & Standard Deviation","symbol":"Var(X), σ","formula":"Var(X) = E[(X − μ)²] = E(X²) − [E(X)]²;   σ = √Var(X)","assumptionOrConstant":"Always ≥ 0; E(X²) = ∑xᵢ²p(xᵢ) or ∫x²f(x)dx","unit":"Var: (Unit X)²; σ: Unit X"},{"id":"ch4-f-lin-exp","category":"Properties & Constants","quantity":"Linearity of Expectation","symbol":"E(aX + b)","formula":"E(aX + b) = a·E(X) + b;   E(c) = c","assumptionOrConstant":"Holds for any constants a, b, c ∈ ℝ","unit":"Unit(aX + b)"},{"id":"ch4-f-lin-var","category":"Properties & Constants","quantity":"Linear Transformation of Variance & SD","symbol":"Var(aX + b)","formula":"Var(aX + b) = a²·Var(X);   SD(aX + b) = |a|·SD(X);   Var(c) = 0","assumptionOrConstant":"Invariant to additive shift b; SD scales by |a| ≥ 0","unit":"a²·(Unit X)² / |a|·Unit X"},{"id":"ch4-f-quad-exp","category":"Properties & Constants","quantity":"Quadratic Expectation & Second Moment","symbol":"E(X²)","formula":"E(aX² + bX + c) = a·E(X²) + b·E(X) + c,   where E(X²) = Var(X) + μ²","assumptionOrConstant":"CRITICAL: E(X²) ≠ [E(X)]² unless Var(X) = 0","unit":"Unit of g(X)"}],"categoryLabels":{"Location":"PMF, PDF & CDF","Dispersion":"Expectation & Variance","Properties & Constants":"Linear & Moment Laws"},"questions":[{"id":"pu-model-q6","tag":"PU Model Set · Group B, Q6","title":"Unknown Constant k, Expected Value & Variance of Discrete RV X","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Page 8","statement":"A random variable X has the following probability distribution: Value of x = [-2, -1, 0, 1, 2, 3], P(x) = [0.1, k, 0.2, 2k, 0.3, k]. (i) Find the value of k. (ii) Find the expected value and variance of X.","given":["Discrete random variable X with support {-2, -1, 0, 1, 2, 3}.","Probability axioms require P(x) ≥ 0 for all x and ∑ P(x) = 1."],"tableHeaders":["x","P(x) [with k = 0.1]","x · P(x)","x²","x² · P(x)"],"tableRows":[["-2","0.1","-0.2","4","0.4"],["-1","k = 0.1","-0.1","1","0.1"],["0","0.2","0.0","0","0.0"],["1","2k = 0.2","0.2","1","0.2"],["2","0.3","0.6","4","1.2"],["3","k = 0.1","0.3","9","0.9"]],"tableTotals":["Total","∑P(x) = 1.0","E(X) = 0.8","—","E(X²) = 2.8"],"steps":[{"heading":"Part (i): Find the Value of k Using Normalization ∑ P(x) = 1","work":["0.1 + k + 0.2 + 2k + 0.3 + k = 1","0.6 + 4k = 1  ⇒  4k = 0.4  ⇒  k = 0.1","Verify all P(x) ≥ 0: [0.1, 0.1, 0.2, 0.2, 0.3, 0.1] ≥ 0 (Valid PMF!)."]},{"heading":"Part (ii-a): Find the Expected Value E(X)","work":["E(X) = ∑ x · P(x)","E(X) = (−2)(0.1) + (−1)(0.1) + (0)(0.2) + (1)(0.2) + (2)(0.3) + (3)(0.1)","E(X) = −0.2 − 0.1 + 0 + 0.2 + 0.6 + 0.3 = 0.8"]},{"heading":"Part (ii-b): Find the Variance Var(X)","work":["First compute E(X²) = ∑ x² · P(x):","E(X²) = (−2)²(0.1) + (−1)²(0.1) + (0)²(0.2) + (1)²(0.2) + (2)²(0.3) + (3)²(0.1)","E(X²) = 0.4 + 0.1 + 0 + 0.2 + 1.2 + 0.9 = 2.8","Var(X) = E(X²) − [E(X)]² = 2.8 − (0.8)² = 2.8 − 0.64 = 2.16","(Optional check: SD(X) = √2.16 ≈ 1.4697)"]}],"finalAnswer":["(i) k = 0.1","(ii) Expected Value E(X) = 0.8   ·   Variance Var(X) = 2.16"]},{"id":"ch4-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Continuous PDF: Constant c, CDF F(x), Interval Probability, Mean & Variance","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Continuous Random Variable & Expectation)","statement":"A continuous random variable X representing voltage surge duration (in ms) has PDF f(x) = c·x·(2 − x) for 0 ≤ x ≤ 2, and 0 otherwise. Find: (a) the constant c, (b) the cumulative distribution function F(x) and P(0.5 ≤ X ≤ 1.5), and (c) E(X), Var(X), and E(3X − 2).","given":["Support of continuous RV X is [0, 2]; f(x) = c(2x − x²) on [0, 2], 0 elsewhere.","Normalization condition: ∫_{−∞}^{∞} f(x) dx = 1."],"steps":[{"heading":"Part (a): Find Constant c","work":["∫₀² c(2x − x²) dx = 1  ⇒  c · [ x² − x³/3 ]₀² = 1","c · (4 − 8/3) = 1  ⇒  (4/3)c = 1  ⇒  c = 3/4 = 0.75","Since x(2 − x) ≥ 0 on [0, 2] and c > 0, f(x) ≥ 0 holds everywhere."]},{"heading":"Part (b): Derive CDF F(x) & Compute P(0.5 ≤ X ≤ 1.5)","work":["For x < 0: F(x) = 0.   For x > 2: F(x) = 1.","For 0 ≤ x ≤ 2: F(x) = ∫₀ˣ (3/4)(2t − t²) dt = (3/4)[ t² − t³/3 ]₀ˣ = (3/4)x² − (1/4)x³","P(0.5 ≤ X ≤ 1.5) = F(1.5) − F(0.5)","F(1.5) = 0.75(2.25) − 0.25(3.375) = 1.6875 − 0.84375 = 0.84375","F(0.5) = 0.75(0.25) − 0.25(0.125) = 0.1875 − 0.03125 = 0.15625","P(0.5 ≤ X ≤ 1.5) = 0.84375 − 0.15625 = 0.6875 (or 11/16)"]},{"heading":"Part (c): Expected Value, Variance & Linear Function E(3X − 2)","work":["E(X) = ∫₀² x · (3/4)(2x − x²) dx = (3/4) ∫₀² (2x² − x³) dx = (3/4)[ 2x³/3 − x⁴/4 ]₀² = (3/4)(16/3 − 4) = (3/4)(4/3) = 1.0 ms","E(X²) = ∫₀² x² · (3/4)(2x − x²) dx = (3/4) ∫₀² (2x³ − x⁴) dx = (3/4)[ x⁴/2 − x⁵/5 ]₀² = (3/4)(8 − 32/5) = (3/4)(8/5) = 1.2 ms²","Var(X) = E(X²) − [E(X)]² = 1.2 − (1.0)² = 0.2 ms²","E(3X − 2) = 3·E(X) − 2 = 3(1.0) − 2 = 1.0   (and Var(3X − 2) = 3²·Var(X) = 1.8)"]}],"finalAnswer":["(a) c = 3/4 = 0.75","(b) F(x) = (3/4)x² − (1/4)x³ on [0, 2] · P(0.5 ≤ X ≤ 1.5) = 0.6875 (11/16)","(c) E(X) = 1.0 ms · Var(X) = 0.2 ms² · E(3X − 2) = 1.0"]},{"id":"ch4-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Substation Capacitor Failures: CDF, Moments & Quadratic Maintenance Cost E(C)","marks":"5 Marks Pattern","source":"High-Yield PU Exam Practice (Discrete CDF & Nonlinear Expectation)","statement":"A discrete random variable X denotes the daily number of capacitor failures in a substation with PMF: x = [0, 1, 2, 3], P(X = x) = [k, 3k, 5k, k]. (a) Find k and the CDF F(x). (b) Compute E(X), E(X²), Var(X), and SD(X). (c) If daily maintenance cost is C = 500 + 200X + 50X² (Rs.), find E(C).","given":["Support of X: {0, 1, 2, 3} with weights k, 3k, 5k, k.","Cost equation: C = g(X) = 500 + 200X + 50X²."],"tableHeaders":["x","P(X = x)","CDF F(x)","x · P(x)","x² · P(x)"],"tableRows":[["0","0.1","0.1","0.0","0.0"],["1","0.3","0.4","0.3","0.3"],["2","0.5","0.9","1.0","2.0"],["3","0.1","1.0","0.3","0.9"]],"tableTotals":["Total","∑P(x) = 1.0","—","E(X) = 1.6","E(X²) = 3.2"],"steps":[{"heading":"Part (a): Determine k & Construct Step CDF F(x)","work":["k + 3k + 5k + k = 1  ⇒  10k = 1  ⇒  k = 0.1","CDF F(x): 0 (x < 0);  0.1 (0 ≤ x < 1);  0.4 (1 ≤ x < 2);  0.9 (2 ≤ x < 3);  1.0 (x ≥ 3)."]},{"heading":"Part (b): Compute E(X), E(X²), Var(X) & SD(X)","work":["E(X) = 0(0.1) + 1(0.3) + 2(0.5) + 3(0.1) = 1.6 failures/day","E(X²) = 0(0.1) + 1(0.3) + 4(0.5) + 9(0.1) = 3.2 (failures/day)²","Var(X) = E(X²) − [E(X)]² = 3.2 − (1.6)² = 3.2 − 2.56 = 0.64 (failures/day)²","SD(X) = √0.64 = 0.8 failures/day"]},{"heading":"Part (c): Expected Daily Maintenance Cost E(C)","work":["Apply linearity of expectation term-by-term (use E(X²) = 3.2, NOT [E(X)]²!):","E(C) = E(500 + 200X + 50X²) = 500 + 200·E(X) + 50·E(X²)","E(C) = 500 + 200(1.6) + 50(3.2) = 500 + 320 + 160 = Rs. 980"]}],"finalAnswer":["(a) k = 0.1","(b) E(X) = 1.6 · E(X²) = 3.2 · Var(X) = 0.64 · SD(X) = 0.8 failures/day","(c) Expected Daily Cost E(C) = Rs. 980"]}],"traps":[{"id":"ch4-trap-sign-1","category":"Sign Convention","title":"Negative Support Values in x²·P(x) (PU Model Q6 Trap)","wrongApproach":"Writing (−2)² = −4 or (−1)² = −1 when computing E(X²) in Model Q6, yielding E(X²) < [E(X)]² and negative variance.","correctRule":"Squaring a negative value ALWAYS yields a positive number: (−2)² = +4 and (−1)² = +1. Keep negative signs in x·P(x) for E(X), and make x² strictly positive in E(X²).","examTip":"Remember: Var(X) ≥ 0 ALWAYS! If your subtraction E(X²) − [E(X)]² gives a negative number, immediately inspect negative x rows."},{"id":"ch4-trap-sign-2","category":"Sign Convention","title":"Linear Scaling Sign on SD(aX + b) vs. E(aX + b)","wrongApproach":"Writing SD(−2X + 5) = −2·SD(X) or Var(−2X + 5) = −4·Var(X).","correctRule":"E(aX + b) = aE(X) + b preserves the sign of a and keeps +b. Variance squares a and drops b: Var(aX + b) = a²Var(X) ≥ 0, so SD(aX + b) = |a|·SD(X) ≥ 0.","examTip":"Watch out for negative coefficients like Y = 10 − 3X in short theory/numerical questions."},{"id":"ch4-trap-sign-3","category":"Sign Convention","title":"Substituting [E(X)]² Instead of E(X²) Into E(aX² + bX + c)","wrongApproach":"Computing E(X²) as [E(X)]², which underestimates E(X²) by exactly Var(X).","correctRule":"Always compute E(X²) = ∑x²p(x) or ∫x²f(x)dx directly (or use E(X²) = Var(X) + [E(X)]²).","examTip":"By Jensen’s inequality, E(X²) > [E(X)]² for any non-constant random variable."},{"id":"ch4-trap-geom-1","category":"Boundary & Slope Geometry","title":"Discrete Strict vs. Inclusive Inequality Boundaries (P(X < 2) vs. P(X ≤ 2))","wrongApproach":"Treating P(1 < X < 3) as F(3) − F(1) for a discrete RV, or forgetting that P(X = c) > 0 for discrete RVs.","correctRule":"For continuous RVs, endpoints have zero probability so ≤ and < give the exact same integral. For discrete RVs, list the exact integer points inside the interval: P(1 < X < 3) = P(X = 2), whereas P(1 ≤ X ≤ 3) = P(1) + P(2) + P(3).","examTip":"Write out the included x values explicitly before summing."},{"id":"ch4-trap-geom-2","category":"Boundary & Slope Geometry","title":"Wrong Integration Limits / Rejecting Negative k or c Roots","wrongApproach":"Integrating f(x) from −∞ to +∞ literally without restricting to the nonzero support [a, b], or accepting a quadratic root k that makes f(x) < 0.","correctRule":"Split ∫_{−∞}^{∞} into piecewise supports where f(x) ≠ 0, and verify BOTH normalization (∫f(x)dx = 1) AND non-negativity (f(x) ≥ 0 for all x).","examTip":"Also remember f(x) is a density, so f(x) > 1 is completely legal if the interval width is narrow!"},{"id":"ch4-trap-geom-3","category":"Boundary & Slope Geometry","title":"Missing the Extra x Factor in Continuous E(X) and E(X²)","wrongApproach":"Integrating ∫ f(x) dx instead of ∫ x·f(x) dx for E(X), or forgetting to differentiate CDF F(x) before integrating x·f(x) dx.","correctRule":"If given CDF F(x), differentiate first to obtain PDF f(x) = F′(x), then integrate ∫ x·f(x) dx for E(X) and ∫ x²·f(x) dx for E(X²).","examTip":"Check symmetry! If f(x) is symmetric about x = m on [a, b], E(X) = m immediately."},{"id":"ch4-trap-pu-1","category":"High-Yield PU Topic","title":"Model Q6 (5 Marks): Find k, E(X) & Var(X) From Discrete Distribution Table","wrongApproach":"Finding k correctly and computing E(X), then forgetting to square x in E(X²) or stopping at E(X²) without subtracting [E(X)]².","correctRule":"Show all 4 steps clearly: (1) ∑P(x) = 1 ⇒ k, (2) E(X) = ∑xP(x), (3) E(X²) = ∑x²P(x), (4) Var(X) = E(X²) − [E(X)]².","examTip":"Unit 4 is worth 5/60 marks in PU—this exact 5-mark discrete table question is the most frequent Unit 4 exam problem."},{"id":"ch4-trap-pu-2","category":"High-Yield PU Topic","title":"Continuous PDF Constant c, CDF F(x) & Interval Probability","wrongApproach":"Forgetting to specify the piecewise bounds x < a (F=0) and x > b (F=1) when writing out F(x).","correctRule":"Always define F(x) in all 3 regions (below support, inside support, above support) and verify F(a) = 0 and F(b) = 1.","examTip":"Checking F(upper limit) = 1 catches 99% of integration arithmetic slips."}]},"ch5":{"id":"ch5","shortLabel":"Ch 5 · Discrete Dist","unitLabel":"Unit 5","formulaUnitLabel":"Chapter 5","headline":"Probability & Statistics — Unit 5: Discrete Probability Distributions","intro":"B.E. Exam-mastery reference covering Binomial and Poisson distributions, conditions, properties, recurrence relations, Binomial-to-Poisson limits, and distribution fitting.","weightage":"5 / 60 Marks","hours":"5 Hours","derivations":"4 Step-by-Step","solvedCount":"Model Q7 + 2 Extra","solvedSubtitle":"Complete step-by-step solution for the Unit 5 question in the attached 2024 PU Model Question Set (Group B Q7), plus two high-yield Binomial & Poisson fitting numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 5: Discrete Probability Distributions","lectureHours":"5 Hrs","finalMarks":5,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Binomial distribution: conditions for using binomial distribution, properties (without proof in detailed contents), computing binomial probabilities, fitting of binomial distribution","Poisson distribution: conditions for using poisson distribution, properties (without proof in detailed contents), computing poisson probabilities, fitting of poisson distribution"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF, Probability & Statistics (pp. 3–5) allocates 5/60 final exam marks to Unit 5 (Model Q7 on pp. 8–9) and marks Binomial & Poisson properties as \"(without proof)\" in Detailed Course Contents. Below, every subtopic is covered across SD, D, DR, I, E, A, and N—including full step-by-step derivations of Mean, Variance, and the Binomial → Poisson limit for complete exam mastery."},"notes":[{"id":"ch5-sub-1","code":"5.1","title":"Binomial Distribution: Conditions, Properties & Probability Computation","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A discrete random variable X follows a Binomial Distribution B(n, p) if it counts the number of successes in n independent Bernoulli trials, each with constant success probability p (and failure probability q = 1 − p). Its PMF is P(X = x) = ⁿC_x · pˣ · qⁿ⁻ˣ for x = 0, 1, …, n.","descriptionD":"Four Conditions for Using Binomial Distribution: (1) Fixed, finite number of trials n; (2) Only two mutually exclusive outcomes per trial (\"Success\" or \"Failure\"); (3) Constant probability of success p across every trial; (4) Trials are statistically independent (sampling with replacement, or from an infinite/large batch).","explanationE":"Key Properties (marked without proof in PU Detailed Contents): Mean μ = np; Variance σ² = npq; Standard Deviation σ = √(npq); Mean is ALWAYS strictly greater than Variance (np > npq whenever 0 < p < 1); Symmetry holds iff p = 0.5 (skewed right if p < 0.5, skewed left if p > 0.5); Mode is the integer part ⌊(n+1)p⌋ (or bimodal at (n+1)p and (n+1)p − 1 if (n+1)p is an exact integer); Sum of independent Binomials with common p is Binomial: X₁ + X₂ ~ B(n₁ + n₂, p).","illustrationI":"In PU Model Q7, inspecting a box of n = 10 electronic components where each component is independently defective with p = 0.01 gives X ~ B(10, 0.01) with mean μ = 0.10 defectives/box and variance σ² = 0.099.","applicationA":"Lot acceptance sampling in electronics manufacturing, bit-error counts in fixed-length digital frames, and redundant component failure counts.","derivationDR":{"title":"Derivation (DR): Mean μ = np and Variance σ² = npq of Binomial Distribution","goal":"Prove E(X) = np and Var(X) = npq directly from P(X = x) = ⁿC_x pˣ qⁿ⁻ˣ (note: marked without proof in PU Detailed Contents).","steps":[{"step":1,"title":"Derive Mean E(X) = np","equation":"E(X) = ∑_{x=0}^n x · [ n! / (x!(n − x)!) ] pˣ qⁿ⁻ˣ = ∑_{x=1}^n [ n(n−1)! / ((x−1)!(n−x)!) ] p · pˣ⁻¹ qⁿ⁻ˣ","note":"The x = 0 term is zero. Factor out n·p and re-index k = x − 1 (from 0 to n − 1):"},{"step":2,"title":"Collapse Remaining Binomial Sum to (p + q)ⁿ⁻¹ = 1","equation":"E(X) = np ∑_{k=0}^{n−1} ⁿ⁻¹C_k pᵏ q⁽ⁿ⁻¹⁾⁻ᵏ = np · (p + q)ⁿ⁻¹ = np · 1 = np","note":"Since p + q = 1."},{"step":3,"title":"Compute Factorial Moment E[X(X − 1)]","equation":"E[X(X − 1)] = ∑_{x=2}^n x(x−1) ⁿC_x pˣ qⁿ⁻ˣ = n(n−1)p² ∑_{x=2}^n ⁿ⁻²C_{x−2} pˣ⁻² qⁿ⁻ˣ = n(n−1)p² (p + q)ⁿ⁻² = n(n−1)p²","note":"Recall E(X²) = E[X(X − 1)] + E(X) = n(n − 1)p² + np = n²p² − np² + np."},{"step":4,"title":"Compute Variance Var(X) = E(X²) − [E(X)]²","equation":"Var(X) = (n²p² − np² + np) − (np)² = np(1 − p) = npq","note":"Since q = 1 − p < 1 for 0 < p < 1, Variance npq < Mean np always!"}],"result":"μ = np,   σ² = npq,   σ = √(npq),   and   μ > σ²."},"keyTakeawayN":"For \"at least 2\" (P(X ≥ 2)), ALWAYS use the complement 1 − [P(0) + P(1)] rather than summing x = 2 through n."},{"id":"ch5-sub-2","code":"5.2","title":"Fitting of Binomial Distribution","depths":["SD","D","I","E","A","N"],"definitionSD":"Fitting a Binomial Distribution means calculating theoretical expected frequencies E_x = N · P(X = x) = N · ⁿC_x pˣ qⁿ⁻ˣ across x = 0, 1, …, n for N repeated sets of n trials, and comparing them against observed frequencies O_x.","descriptionD":"There are two cases: (1) p is known theoretically (e.g., p = 0.5 for a fair coin/bit); (2) p is unknown, so we estimate it from sample mean x̄ = (∑fᵢxᵢ)/N by equating x̄ = n·p̂ ⇒ p̂ = x̄ / n and q̂ = 1 − p̂.","explanationE":"To avoid repeated power calculations in an exam, compute E₀ = N·qⁿ first, then use the Binomial Recurrence Relation: P(x + 1) = [(n − x) / (x + 1)] · (p / q) · P(x). Always verify ∑E_x = N.","illustrationI":"In 250 batches of 5 relays with sample mean x̄ = 2.00, we obtain p̂ = 2.00/5 = 0.40, E₀ = 250(0.6)⁵ = 19.44, and recur upward cleanly.","applicationA":"Testing whether observed defect counts per batch follow random independent manufacturing variation (later tested formally with Chi-square goodness-of-fit in Unit 8).","keyTakeawayN":"Remember n is the maximum count of successes per batch (e.g., 5), whereas N is the total number of batches (e.g., 250)—never confuse n with N!"},{"id":"ch5-sub-3","code":"5.3","title":"Poisson Distribution: Conditions, Properties & Binomial Limit","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A discrete random variable X follows a Poisson Distribution P(λ) if it counts random events occurring independently at a constant average rate λ > 0 over a fixed interval of time, length, or area. Its PMF is P(X = x) = (e⁻λ · λˣ) / x! for x = 0, 1, 2, …","descriptionD":"Conditions for Using Poisson Distribution: (1) Rare-event limit of Binomial: number of trials n is very large (n → ∞, practically n ≥ 20), probability of occurrence p is very small (p → 0, practically p ≤ 0.05), and product np = λ remains finite constant; (2) Events occur independently in non-overlapping intervals; (3) Probability of two or more simultaneous events in an infinitesimal interval Δt is negligible.","explanationE":"Key Properties (marked without proof in PU Detailed Contents): Mean μ = λ; Variance σ² = λ (UNIQUE hallmark: Mean = Variance = λ!); Standard Deviation σ = √λ; Positively skewed (skewness = 1/√λ → 0 as λ increases); Unimodal at ⌊λ⌋ (or bimodal at λ − 1 and λ if λ is an integer); Reproductive property: sum of independent Poissons X₁ + X₂ ~ P(λ₁ + λ₂).","illustrationI":"Incoming telephone calls per minute at an exchange, transient voltage spikes per hour, or printing typos per page—where you can count how many events occurred, but cannot count how many \"non-events\" did not occur.","applicationA":"Modeling call-center arrival rates, substation lightning/switching surges, radioactive decay counts, and approximating rare Binomial defect probabilities when n is large.","derivationDR":{"title":"Derivation (DR): Poisson Limit from Binomial & Proof that Mean = Variance = λ","goal":"Derive P(X = x) = e⁻λ λˣ / x! as n → ∞, p → 0 with np = λ, and prove E(X) = Var(X) = λ.","steps":[{"step":1,"title":"Substitute p = λ/n into Binomial PMF","equation":"P(X = x) = [ n(n−1)…(n−x+1) / x! ] · (λ/n)ˣ · (1 − λ/n)ⁿ⁻ˣ","note":"Group the nˣ denominator with the x factors in the numerator:"},{"step":2,"title":"Take Limit as n → ∞ with Fixed x and λ","equation":"lim_{n→∞} [ 1·(1 − 1/n)…(1 − (x−1)/n) ] · (λˣ / x!) · (1 − λ/n)ⁿ · (1 − λ/n)⁻ˣ = 1 · (λˣ / x!) · e⁻λ · 1","note":"Using lim_{n→∞}(1 − λ/n)ⁿ = e⁻λ yields P(X = x) = e⁻λ λˣ / x!."},{"step":3,"title":"Derive Mean E(X) = λ","equation":"E(X) = ∑_{x=1}^∞ x · (e⁻λ λˣ / x!) = λ·e⁻λ ∑_{x=1}^∞ λˣ⁻¹ / (x − 1)! = λ·e⁻λ · e^λ = λ","note":"Since Taylor series ∑_{k=0}^∞ λᵏ/k! = e^λ."},{"step":4,"title":"Derive Variance Var(X) = λ","equation":"E[X(X − 1)] = ∑_{x=2}^∞ x(x−1)(e⁻λ λˣ / x!) = λ²e⁻λ ∑_{k=0}^∞ (λᵏ/k!) = λ² ⇒ E(X²) = λ² + λ ⇒ Var(X) = (λ² + λ) − λ² = λ","note":"Thus Mean = Variance = λ identically!"}],"result":"P(X = x) = (e⁻λ λˣ) / x!;   μ = λ,   σ² = λ,   σ = √λ."},"keyTakeawayN":"Always use the Poisson recurrence P(x + 1) = [λ / (x + 1)] · P(x) starting from P(0) = e⁻λ to avoid rounding drift and large factorials."},{"id":"ch5-sub-4","code":"5.4","title":"Fitting of Poisson Distribution","depths":["SD","D","I","E","A","N"],"definitionSD":"Fitting a Poisson Distribution computes expected frequencies E_x = N · (e⁻λ λˣ / x!) for x = 0, 1, 2, … across N total observed intervals/units using λ̂ = x̄ = (∑fᵢxᵢ)/N.","descriptionD":"Because Poisson has only one parameter λ, fitting requires: (1) Compute sample mean x̄ = ∑fᵢxᵢ / N and set λ̂ = x̄; (2) Compute P(0) = e⁻λ̂; (3) Apply recurrence P(x + 1) = [λ̂ / (x + 1)]·P(x) or E_{x+1} = [λ̂ / (x + 1)]·E_x; (4) Round E_x and check total ∑E_x ≈ N.","explanationE":"Remember that the Poisson support theoretically extends to ∞, so the tail probability P(X ≥ k) absorbs any tiny residual beyond the last table bin.","illustrationI":"For 200 substation shifts with x̄ = 0.90 spikes/hour, E₀ = 200·e⁻⁰·⁹ = 81.31, E₁ = 0.9×81.31 = 73.18, E₂ = (0.9/2)×73.18 = 32.93, etc.","applicationA":"Testing whether substation transients, network packet arrivals, or exchange call counts (as in Unit 1 Model Q4!) follow a pure Poisson process.","keyTakeawayN":"Quick diagnostic before fitting: if sample variance s² ≈ sample mean x̄, Poisson fits well; if s² < x̄, try Binomial; if s² > x̄, distribution is overdispersed."}],"formulas":[{"id":"ch5-f-binom-pmf","category":"Location","quantity":"Binomial PMF","symbol":"B(n, p)","formula":"P(X = x) = ⁿC_x · pˣ · qⁿ⁻ˣ,   x = 0, 1, …, n","assumptionOrConstant":"Fixed n trials; independent Bernoulli; constant p; q = 1 − p","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch5-f-binom-mv","category":"Location","quantity":"Binomial Mean, Variance & Mode","symbol":"μ, σ², M_o","formula":"μ = np;   σ² = npq;   σ = √(npq);   M_o = ⌊(n + 1)p⌋","assumptionOrConstant":"Always μ > σ² (since q < 1); symmetric iff p = 0.5","unit":"μ, M_o: count; σ²: count²"},{"id":"ch5-f-binom-rec","category":"Location","quantity":"Binomial Recurrence & Fitting","symbol":"E_x","formula":"E_x = N · P(X = x);   P(x + 1) = [ (n − x)/(x + 1) ] · (p / q) · P(x)","assumptionOrConstant":"Estimate p̂ = x̄ / n when p unknown; verify ∑E_x = N","unit":"Expected frequency (count)"},{"id":"ch5-f-pois-pmf","category":"Dispersion","quantity":"Poisson PMF","symbol":"P(λ)","formula":"P(X = x) = (e⁻λ · λˣ) / x!,   x = 0, 1, 2, …","assumptionOrConstant":"e ≈ 2.7182818; rare independent events at constant rate λ > 0","unit":"Dimensionless ∈ [0, 1]"},{"id":"ch5-f-pois-mv","category":"Dispersion","quantity":"Poisson Mean, Variance & Mode","symbol":"μ, σ², M_o","formula":"μ = λ;   σ² = λ;   σ = √λ;   M_o = ⌊λ⌋","assumptionOrConstant":"Hallmark property: Mean = Variance = λ; bimodal at λ−1, λ if λ ∈ ℤ⁺","unit":"μ, M_o: count; σ²: count²"},{"id":"ch5-f-pois-rec","category":"Dispersion","quantity":"Poisson Recurrence & Fitting","symbol":"E_x","formula":"E₀ = N · e⁻λ̂;   E_{x+1} = [ λ̂ / (x + 1) ] · E_x   (λ̂ = x̄)","assumptionOrConstant":"Scale rate linearly for time/area changes: λ_new = rate × interval","unit":"Expected frequency (count)"},{"id":"ch5-f-pois-approx","category":"Properties & Constants","quantity":"Poisson Approximation to Binomial","symbol":"B(n, p) → P(λ)","formula":"λ = n · p   when n is large (n ≥ 20) and p is small (p ≤ 0.05)","assumptionOrConstant":"Standard rule of thumb: np ≤ 5 (or n ≥ 20, p ≤ 0.05)","unit":"λ: expected count"},{"id":"ch5-f-reprod","category":"Properties & Constants","quantity":"Additive Reproductive Properties","symbol":"X₁ + X₂","formula":"Binomial (same p): B(n₁ + n₂, p);   Poisson: P(λ₁ + λ₂)","assumptionOrConstant":"Requires X₁ and X₂ to be independent random variables","unit":"Count"}],"categoryLabels":{"Location":"Binomial Distribution","Dispersion":"Poisson Distribution","Properties & Constants":"Approximation & Sums"},"questions":[{"id":"pu-model-q7","tag":"PU Model Set · Group B, Q7","title":"Binomial Probabilities: Defective Components in Boxes of 10","marks":"5 Marks","source":"Attached PDF — PU V Sem Final Exam 2024 Model Question, Pages 8–9","statement":"A factory produces components of which 1% are defective. The components are packed in boxes of 10. A box is selected at random. (a) Find the probability that the box contains exactly one defective component. (b) Find the probability that there are at least 2 defective components in the box.","given":["Let X = number of defective components in a randomly selected box of n = 10 components.","Probability of defective component: p = 1% = 0.01  ⇒  q = 1 − p = 0.99.","Since n = 10 is finite and components are independent, X ~ Binomial(n = 10, p = 0.01).","PMF: P(X = x) = ¹⁰C_x · (0.01)ˣ · (0.99)¹⁰⁻ˣ,   x = 0, 1, …, 10."],"steps":[{"heading":"Part (a): Probability of Exactly One Defective Component P(X = 1)","work":["P(X = 1) = ¹⁰C₁ · (0.01)¹ · (0.99)⁹","¹⁰C₁ = 10,   (0.01)¹ = 0.01,   (0.99)⁹ = 0.91351725","P(X = 1) = 10 × 0.01 × 0.91351725 = 0.091352 ≈ 0.0914 (9.14%)"]},{"heading":"Part (b): Probability of At Least 2 Defective Components P(X ≥ 2)","work":["Use the complement rule to avoid summing x = 2 through 10:","P(X ≥ 2) = 1 − P(X < 2) = 1 − [ P(X = 0) + P(X = 1) ]","P(X = 0) = ¹⁰C₀ · (0.01)⁰ · (0.99)¹⁰ = 1 × 1 × 0.90438207 = 0.904382","P(X ≤ 1) = 0.904382 + 0.091352 = 0.995734","P(X ≥ 2) = 1 − 0.995734 = 0.004266 ≈ 0.0043 (0.43%)","(Note: Poisson approximation with λ = np = 0.1 gives P(1) = 0.0905 and P(X ≥ 2) = 0.0047; exact Binomial is preferred since n = 10 < 20.)"]}],"finalAnswer":["(a) P(exactly 1 defective) = 0.0914 (9.14%)","(b) P(at least 2 defectives) = 0.0043 (0.43%)"]},{"id":"ch5-extra-1","tag":"Extra Exam-Level Numerical 1","title":"Fitting a Binomial Distribution to 250 Batches of 5 Relays","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Fitting of Binomial Distribution)","statement":"In an inspection of N = 250 batches of n = 5 relays each, the number of tripped relays X per batch was recorded as: x = [0, 1, 2, 3, 4, 5], Observed Frequency O = [24, 62, 84, 54, 22, 4]. (a) Estimate the parameter p from the sample mean. (b) Fit a Binomial distribution and compute all expected frequencies.","given":["Number of trials per batch: n = 5; Total batches: N = 250.","Observed frequencies O: [24, 62, 84, 54, 22, 4] (sum = 250)."],"tableHeaders":["x","Obs. Freq (O)","O · x","Binomial P(X = x)","Expected E_x = 250·P(x)","Rounded E_x"],"tableRows":[["0","24","0","1·(0.6)⁵ = 0.07776","19.44","19"],["1","62","62","5·(0.4)(0.6)⁴ = 0.25920","64.80","65"],["2","84","168","10·(0.4)²(0.6)³ = 0.34560","86.40","86"],["3","54","162","10·(0.4)³(0.6)² = 0.23040","57.60","58"],["4","22","88","5·(0.4)⁴(0.6) = 0.07680","19.20","19"],["5","4","20","1·(0.4)⁵ = 0.01024","2.56","3"]],"tableTotals":["Total","N = 250","∑Ox = 500","∑P(x) = 1.00000","∑E_x = 250.00","∑ = 250"],"steps":[{"heading":"Part (a): Estimate p̂ From Sample Mean x̄ = np̂","work":["x̄ = ∑(O · x) / N = (0 + 62 + 168 + 162 + 88 + 20) / 250 = 500 / 250 = 2.00","Equate to Binomial mean n·p̂ = 2.00  ⇒  5·p̂ = 2.00  ⇒  p̂ = 0.40,   q̂ = 1 − 0.40 = 0.60"]},{"heading":"Part (b): Compute Expected Frequencies Using Binomial Recurrence","work":["E₀ = 250 · (0.60)⁵ = 250 × 0.07776 = 19.44 ≈ 19","Recurrence ratio: p̂ / q̂ = 0.40 / 0.60 = 2/3, so E_{x+1} = [(5 − x)/(x + 1)] · (2/3) · E_x:","E₁ = (5/1)(2/3)(19.44) = 64.80 ≈ 65;   E₂ = (4/2)(2/3)(64.80) = 86.40 ≈ 86","E₃ = (3/3)(2/3)(86.40) = 57.60 ≈ 58;   E₄ = (2/4)(2/3)(57.60) = 19.20 ≈ 19;   E₅ = (1/5)(2/3)(19.20) = 2.56 ≈ 3"]}],"finalAnswer":["(a) Estimated probability p̂ = 0.40 (with x̄ = 2.00)","(b) Fitted Binomial expected frequencies: [19, 65, 86, 58, 19, 3] (sum = 250)"]},{"id":"ch5-extra-2","tag":"Extra Exam-Level Numerical 2","title":"Fitting a Poisson Distribution & Substation Transient Spike Probabilities","marks":"5–10 Marks Pattern","source":"High-Yield PU Exam Practice (Poisson Fitting & Probability Calculation)","statement":"A power substation records transient voltage spikes over N = 200 one-hour shifts: No. of spikes x = [0, 1, 2, 3, 4], Observed Shifts O = [82, 72, 34, 8, 4]. (a) Estimate the Poisson parameter λ and fit the expected Poisson frequencies. (b) Using this Poisson model, find the probability that a randomly chosen hour experiences (i) no spikes, and (ii) at least 2 spikes.","given":["Total shifts N = 200.","Observed frequencies O: [82, 72, 34, 8, 4] (∑O = 200)."],"tableHeaders":["Spikes (x)","Obs. Shifts (O)","O · x","Poisson P(X = x)","Expected E_x = 200·P(x)","Rounded E_x"],"tableRows":[["0","82","0","e⁻⁰·⁹ = 0.40657","81.31","81"],["1","72","72","0.9 × 0.40657 = 0.36591","73.18","73"],["2","34","68","(0.9/2) × 0.36591 = 0.16466","32.93","33"],["3","8","24","(0.9/3) × 0.16466 = 0.04940","9.88","10"],["4","4","16","(0.9/4) × 0.04940 = 0.01111","2.22","2"],["≥ 5 (tail)","0","0","1 − 0.99765 = 0.00235","0.47","1"]],"tableTotals":["Total","N = 200","∑Ox = 180","∑P(x) = 1.00000","∑E_x = 200.00","∑ = 200"],"steps":[{"heading":"Part (a): Estimate λ̂ = x̄ & Compute Fitted Frequencies via Recurrence","work":["λ̂ = x̄ = ∑(O · x) / N = (0 + 72 + 68 + 24 + 16) / 200 = 180 / 200 = 0.90 spikes/hour","P(0) = e⁻⁰·⁹ = 0.40657  ⇒  E₀ = 200 × 0.40657 = 81.31 ≈ 81","Use Poisson recurrence E_{x+1} = [λ̂ / (x + 1)] · E_x:","E₁ = (0.9/1)(81.31) = 73.18 ≈ 73;   E₂ = (0.9/2)(73.18) = 32.93 ≈ 33;   E₃ = (0.9/3)(32.93) = 9.88 ≈ 10;   E₄ = (0.9/4)(9.88) = 2.22 ≈ 2","Tail (x ≥ 5): E_{≥5} = 200 − 199.53 = 0.47 ≈ 1"]},{"heading":"Part (b): Compute Hourly Spike Probabilities","work":["(i) P(no spikes) = P(X = 0) = e⁻⁰·⁹ = 0.4066 (40.66%)","(ii) P(at least 2 spikes) = P(X ≥ 2) = 1 − [ P(0) + P(1) ] = 1 − (0.40657 + 0.36591) = 1 − 0.77248 = 0.2275 (22.75%)"]}],"finalAnswer":["(a) λ̂ = 0.90 spikes/hr · Fitted Poisson frequencies: [81, 73, 33, 10, 2, (≥5: 1)]","(b) (i) P(X = 0) = 0.4066 (40.66%) · (ii) P(X ≥ 2) = 0.2275 (22.75%)"]}],"traps":[{"id":"ch5-trap-sign-1","category":"Sign Convention","title":"Confusing n (Trials per Batch) with N (Number of Batches) During Fitting","wrongApproach":"Computing p̂ = x̄ / N instead of p̂ = x̄ / n, or multiplying P(X = x) by n instead of N.","correctRule":"n is the number of Bernoulli trials in ONE experiment (max x value); N is the total frequency ∑O_x. Always compute p̂ = x̄ / n and E_x = N · P(X = x).","examTip":"Check that 0 ≤ p̂ ≤ 1! Dividing by N instead of n produces an impossibly tiny p̂."},{"id":"ch5-trap-sign-2","category":"Sign Convention","title":"Sign & Term-Count Trap in \"At Least\", \"At Most\", \"More Than\", \"Less Than\"","wrongApproach":"Computing P(X ≥ 2) = 1 − P(X ≤ 2) (wrongly excluding X = 2!), or treating \"more than 2\" as X ≥ 2.","correctRule":"\"At least 2\" means X ≥ 2 ⇒ 1 − [P(0) + P(1)]. \"More than 2\" means X > 2 ⇒ 1 − [P(0) + P(1) + P(2)]. \"At most 2\" means X ≤ 2. \"Less than 2\" means X ≤ 1.","examTip":"Write the inequality symbol and list the excluded integers explicitly before applying 1 − P(complement)."},{"id":"ch5-trap-sign-3","category":"Sign Convention","title":"Negative Sign Missing in Exponential e⁻λ (Using e⁺λ by Mistake)","wrongApproach":"Evaluating e^{λ}λˣ/x! which yields probabilities > 1.","correctRule":"Poisson PMF ALWAYS has a negative exponent e⁻λ, so P(0) = e⁻λ ∈ (0, 1).","examTip":"Double-check on your calculator that e⁻λ is less than 1 and ∑P(x) ≤ 1."},{"id":"ch5-trap-geom-1","category":"Boundary & Slope Geometry","title":"Choosing Binomial vs. Poisson (and When Poisson Approximation Is Valid)","wrongApproach":"Using Poisson approximation in PU Model Q7 (n = 10, p = 0.01) as the primary method without noting Binomial, OR using Binomial when no n exists (e.g., \"3 calls per minute\").","correctRule":"Use Binomial when finite n and p are given (Model Q7 has n = 10 ⇒ Binomial!). Use Poisson when only average rate λ is given OR when n ≥ 20 and p ≤ 0.05 (λ = np).","examTip":"If a problem asks \"can Poisson be used?\" check Mean ≈ Variance and rare independent arrivals."},{"id":"ch5-trap-geom-2","category":"Boundary & Slope Geometry","title":"Forgetting to Scale Poisson Parameter λ When Time/Area Interval Changes","wrongApproach":"Given λ = 2 defects per meter (or 3 calls per minute) and using the same λ = 2 for a 5-meter cable (or 2-minute interval).","correctRule":"Poisson rate scales linearly with interval length: λ_new = λ_unit × interval (e.g., 2 × 5 = 10 defects per 5 m).","examTip":"Always write the unit next to λ (e.g. λ = 0.9 spikes/hour) before substituting."},{"id":"ch5-trap-geom-3","category":"Boundary & Slope Geometry","title":"Using Binomial Variance ≥ Mean in Parameter Recovery Questions","wrongApproach":"Claiming a Binomial distribution has Mean = 4 and Variance = 6.","correctRule":"Because q = 1 − p < 1, Binomial ALWAYS has Mean > Variance (np > npq). If Mean = Variance, the distribution is Poisson; if Variance > Mean, neither Binomial nor Poisson applies!","examTip":"Classic 2-mark/5-mark PU trick: \"Comment on the statement: For a Binomial distribution, mean is 5 and variance is 6\" → Impossible because q = σ²/μ = 6/5 = 1.2 > 1!"},{"id":"ch5-trap-pu-1","category":"High-Yield PU Topic","title":"Model Q7 (5 Marks): Binomial Probability With Complement \"At Least 2\"","wrongApproach":"Rounding (0.99)⁹ too early to 0.91, causing 3rd/4th decimal inaccuracies.","correctRule":"Keep at least 5–6 significant digits in (1 − p)ⁿ and (1 − p)ⁿ⁻¹ before rounding final answers to 4 decimal places.","examTip":"Unit 5 is worth 5/60 marks in PU—expect either a Binomial/Poisson probability problem (like Model Q7) or a Binomial/Poisson fitting table."},{"id":"ch5-trap-pu-2","category":"High-Yield PU Topic","title":"Poisson Fitting Tail Bin & Recurrence Speed","wrongApproach":"Computing 4!, 5! factorials repeatedly and forgetting the residual tail probability.","correctRule":"Use E_{x+1} = [λ̂/(x + 1)]·E_x from E₀ = N·e⁻λ̂, and check ∑E_x = N.","examTip":"State the conditions and 3–4 key properties cleanly if asked in theory alongside a numerical."}]},"ch6":{"id":"ch6","shortLabel":"Ch 6 · Continuous Dist","unitLabel":"Unit 6","formulaUnitLabel":"Chapter 6","headline":"Probability & Statistics — Unit 6: Continuous Probability Distributions","intro":"B.E. Exam-mastery reference covering Normal & Standard Normal curves, area calculations, linear combinations, Student's t-distribution, and Chi-square (χ²) distribution.","weightage":"10 / 60 Marks","hours":"7 Hours","derivations":"3 Step-by-Step","solvedCount":"Model Q10 + 2 Extra","solvedSubtitle":"Complete step-by-step solution for the Unit 6 question in the attached 2024 PU Model Question Set (Group B Q10), plus two high-yield 10-mark Normal, t & χ² numericals.","ctx":{"university":"Purbanchal University — Faculty of Engineering, Biratnagar, Nepal","program":"B.E. Biomedical / Electrical / Electronics, Com. & Automation Engineering","semester":"Year III · Semester V (Effective from 2021 / 2078 Batch)","subject":"Probability and Statistics","chapter":"Unit 6: Continuous Probability Distributions","lectureHours":"7 Hrs","finalMarks":10,"totalSubjectMarks":"60 Final Theory + 20 Internal Theory + 20 Practical = 100","syllabusTopics":["Normal distribution, standard normal distribution, curve of normal and standard normal distribution","Properties of normal distribution, computing normal probabilities, measurement of areas under the normal curve","Student's t-distribution and its application","Chi-square (χ²) distribution and its application"],"microSyllabusNote":"In the attached PU 5th Semester syllabus PDF (pp. 3–6), Unit 6 is allocated 7 lecture hours and 10/60 final exam marks (e.g., Model Q10 on p. 9). Probability & Statistics lists Detailed Course Contents rather than an SD/D/DR matrix; therefore every Unit 6 subtopic is mapped across SD, D, DR, I, E, A, and N with complete step-by-step derivations."},"notes":[{"id":"ch6-sub-1","code":"6.1","title":"Normal Distribution, Standard Normal Distribution & Curve Geometry","depths":["SD","D","DR","I","E","A","N"],"definitionSD":"A continuous random variable X follows a Normal (Gaussian) distribution N(μ, σ²) with mean μ ∈ (−∞, ∞) and standard deviation σ > 0 if its PDF is f(x) = [1 / (σ√(2π))] · exp(−½ · [(x − μ)/σ]²) for −∞ < x < ∞. When μ = 0 and σ = 1, the standardized variate Z = (X − μ)/σ follows the Standard Normal Distribution N(0, 1) with PDF φ(z) = (1/√(2π))·e^(−z²/2).","descriptionD":"The normal curve is a smooth, symmetric, unimodal bell-shaped curve centered at x = μ (or z = 0 for standard normal). It extends asymptotically from −∞ to +∞ without ever touching the horizontal axis, and the total area enclosed beneath f(x) is exactly 1.","explanationE":"Peak height occurs at x = μ with f(μ) = 1/(σ√(2π)) ≈ 0.3989/σ (for Standard Normal, φ(0) = 0.3989). Points of inflection—where curvature changes from concave downward to concave upward—occur exactly one standard deviation away at x = μ − σ and x = μ + σ (z = ±1). Decreasing σ makes the curve taller and narrower; increasing σ flattens and widens it.","illustrationI":"In PU Model Q10, wooden beam breaking strengths follow X ~ N(1500, 100²). Shifting center by 1500 and dividing by 100 maps every beam strength onto the single universal Standard Normal curve Z ~ N(0, 1), so 1450 kg becomes z = −0.50 and 1600 kg becomes z = +1.00.","applicationA":"Thermal and shot noise in communication receivers, component tolerance variations (resistors, capacitors), structural breaking strengths, and measurement errors.","derivationDR":{"title":"Derivation (DR): Standardization Z = (X − μ)/σ & Inflection Points at x = μ ± σ","goal":"Verify that Z = (X − μ)/σ has PDF φ(z) = (1/√(2π))e^
