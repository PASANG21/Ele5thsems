          map[CHAPTER_IDS[i]] = createEmptyChapterProgress();
        }
        return map;
      }

      function loadProgress() {
        var base = createInitialProgress();
        try {
          var raw = localStorage.getItem(PROGRESS_KEY);
          if (!raw) return base;
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return base;
          for (var i = 0; i < CHAPTER_IDS.length; i++) {
            var cid = CHAPTER_IDS[i];
            var entry = parsed[cid];
            if (entry && typeof entry === 'object') {
              base[cid] = {
                completedSubtopics: Array.isArray(entry.completedSubtopics) ? entry.completedSubtopics.filter(function (x) { return typeof x === 'string'; }) : [],
                completedQuestions: Array.isArray(entry.completedQuestions) ? entry.completedQuestions.filter(function (x) { return typeof x === 'string'; }) : [],
                completedSections: Array.isArray(entry.completedSections) ? entry.completedSections.filter(function (x) { return x === 'formulas' || x === 'traps'; }) : []
              };
            }
          }
        } catch (e) {}
        return base;
      }

      function saveProgress() {
        try {
          localStorage.setItem(PROGRESS_KEY, JSON.stringify(state.progress));
        } catch (e) {}
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getSummary(cid) {
        var ch = CHAPTERS[cid];
        var pr = state.progress[cid];
        var subSet = {};
        for (var i = 0; i < pr.completedSubtopics.length; i++) subSet[pr.completedSubtopics[i]] = true;
        var qSet = {};
        for (var j = 0; j < pr.completedQuestions.length; j++) qSet[pr.completedQuestions[j]] = true;

        var theoryDone = 0;
        for (var s = 0; s < ch.notes.length; s++) {
          if (subSet[ch.notes[s].id]) theoryDone++;
        }
        var solvedDone = 0;
        for (var q = 0; q < ch.questions.length; q++) {
          if (qSet[ch.questions[q].id]) solvedDone++;
        }
        var isTheoryCompleted = ch.notes.length > 0 && theoryDone === ch.notes.length;
        var isFormulasCompleted = pr.completedSections.indexOf('formulas') !== -1;
        var isSolvedCompleted = ch.questions.length > 0 && solvedDone === ch.questions.length;
        var isTrapsCompleted = pr.completedSections.indexOf('traps') !== -1;

        var completedItems = theoryDone + (isFormulasCompleted ? 1 : 0) + solvedDone + (isTrapsCompleted ? 1 : 0);
        var totalItems = ch.notes.length + 1 + ch.questions.length + 1;
        var percentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

        return {
          completedItems: completedItems,
          totalItems: totalItems,
          percentage: percentage,
          theoryDone: theoryDone,
          theoryTotal: ch.notes.length,
          isTheoryCompleted: isTheoryCompleted,
          isFormulasCompleted: isFormulasCompleted,
          solvedDone: solvedDone,
          solvedTotal: ch.questions.length,
          isSolvedCompleted: isSolvedCompleted,
          isTrapsCompleted: isTrapsCompleted,
          isChapterCompleted: completedItems === totalItems && totalItems > 0
        };
      }

      function getOverallSummary() {
        var completedItems = 0, totalItems = 0, completedChapters = 0;
        for (var i = 0; i < CHAPTER_IDS.length; i++) {
          var sm = getSummary(CHAPTER_IDS[i]);
          completedItems += sm.completedItems;
          totalItems += sm.totalItems;
          if (sm.isChapterCompleted) completedChapters++;
        }
        return {
          completedItems: completedItems,
          totalItems: totalItems,
          percentage: totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0,
          completedChapters: completedChapters
        };
      }

      function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        try { localStorage.setItem(THEME_KEY, state.theme); } catch (e) {}
        render();
      }

      function toggleSubtopic(id) {
        var pr = state.progress[state.activeChapter];
        var idx = pr.completedSubtopics.indexOf(id);
        if (idx === -1) pr.completedSubtopics.push(id);
        else pr.completedSubtopics.splice(idx, 1);
        saveProgress();
        render();
      }

      function toggleAllSubtopics() {
        var ch = CHAPTERS[state.activeChapter];
        var sm = getSummary(state.activeChapter);
        state.progress[state.activeChapter].completedSubtopics = sm.isTheoryCompleted
          ? []
          : ch.notes.map(function (n) { return n.id; });
        saveProgress();
        render();
      }

      function toggleQuestion(id) {
        var pr = state.progress[state.activeChapter];
        var idx = pr.completedQuestions.indexOf(id);
        if (idx === -1) pr.completedQuestions.push(id);
        else pr.completedQuestions.splice(idx, 1);
        saveProgress();
        render();
      }

      function toggleAllQuestions() {
        var ch = CHAPTERS[state.activeChapter];
        var sm = getSummary(state.activeChapter);
        state.progress[state.activeChapter].completedQuestions = sm.isSolvedCompleted
          ? []
          : ch.questions.map(function (q) { return q.id; });
        saveProgress();
        render();
      }

      function toggleSimpleSection(key) {
        var pr = state.progress[state.activeChapter];
        var idx = pr.completedSections.indexOf(key);
        if (idx === -1) pr.completedSections.push(key);
        else pr.completedSections.splice(idx, 1);
        saveProgress();
        render();
      }

      function parseNums(str) {
        return String(str || '')
          .split(/[\s,;]+/)
          .map(function (s) { return Number(s); })
          .filter(function (n) { return isFinite(n); });
      }

      function normCdf(z) {
        var t = 1 / (1 + 0.2316419 * Math.abs(z));
        var d = 0.3989422804014327 * Math.exp((-z * z) / 2);
        var p = d * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + 1.330274429 * t))));
        return z >= 0 ? 1 - p : p;
      }

      function fact(n) {
        var r = 1;
        for (var i = 2; i <= n; i++) r *= i;
        return r;
      }

      function nCr(n, r) {
        if (r < 0 || r > n) return 0;
        r = Math.min(r, n - r);
        var num = 1, den = 1;
        for (var i = 1; i <= r; i++) {
          num *= n - r + i;
          den *= i;
        }
        return num / den;
      }

      function computeLabHtml(cid) {
        var inp = state.labInputs[cid];
        if (cid === 'ch1') {
          var arr = parseNums(inp.data).sort(function (a, b) { return a - b; });
          var n = arr.length;
          var sum = 0;
          for (var i = 0; i < n; i++) sum += arr[i];
          var mean = n ? sum / n : 0;
          var sq = 0;
          for (var j = 0; j < n; j++) sq += Math.pow(arr[j] - mean, 2);
          var popSd = n ? Math.sqrt(sq / n) : 0;
          var sampSd = n > 1 ? Math.sqrt(sq / (n - 1)) : 0;
          var med = n === 0 ? 0 : (n % 2 ? arr[(n - 1) / 2] : (arr[n / 2 - 1] + arr[n / 2]) / 2);
          var cv = mean !== 0 ? (popSd / Math.abs(mean)) * 100 : 0;
          return {
            title: 'Interactive Unit 1 Calculator — Ungrouped Descriptive Statistics',
            controls:
              '<div class="input-group"><label for="lab-ch1-data">Observations (comma or space separated)</label>' +
              '<input id="lab-ch1-data" class="input-ctrl font-mono" data-lab="ch1" data-field="data" value="' + esc(inp.data) + '" /></div>',
            metrics: [
              ['Count (N)', n],
              ['Mean (x̄)', mean.toFixed(4)],
              ['Median (Md)', med.toFixed(4)],
              ['Pop. SD (σ)', popSd.toFixed(4)],
              ['Sample SD (s)', sampSd.toFixed(4)],
              ['CV (%)', cv.toFixed(2) + '%']
            ]
          };
        }
        if (cid === 'ch2') {
          var xs = parseNums(inp.x);
          var ys = parseNums(inp.y);
          var n = Math.min(xs.length, ys.length);
          var sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
          for (var i = 0; i < n; i++) {
            sx += xs[i]; sy += ys[i];
            sxx += xs[i] * xs[i]; syy += ys[i] * ys[i]; sxy += xs[i] * ys[i];
          }
          var mx = n ? sx / n : 0, my = n ? sy / n : 0;
          var sxxC = sxx - n * mx * mx, syyC = syy - n * my * my, sxyC = sxy - n * mx * my;
          var r = (sxxC > 0 && syyC > 0) ? sxyC / Math.sqrt(sxxC * syyC) : 0;

        if (cid === 'ch5') {

            tableHtml +
            stepsHtml +
            '<div class="answer-box"><div class="answer-title">Final Exam Answer</div>' +
            q.finalAnswer.map(function (a) { return '<div class="answer-line font-mono">' + esc(a) + '</div>'; }).join('') +
            '</div></article>'
          );
        }).join('');

        var trapCats = ['All', 'Sign Convention', 'Boundary & Slope Geometry', 'High-Yield PU Topic'];
        var trapTabsHtml = trapCats.map(function (cat) {
          return '<button type="button" class="tab-btn' + (state.trapFilter === cat ? ' active' : '') + '" data-action="trap-filter" data-id="' + esc(cat) + '">' + esc(cat) + '</button>';
        }).join('');

        var trapsHtml = ch.traps.filter(function (t) {
          return state.trapFilter === 'All' || t.category === state.trapFilter;
        }).map(function (t) {
          return (
            '<article class="card' + (sm.isTrapsCompleted ? ' is-done' : '') + '" style="display:flex;flex-direction:column;justify-content:space-between;gap:0.85rem;">' +
            '<div style="display:flex;flex-direction:column;gap:0.7rem;">' +
            '<div style="font-size:0.75rem;color:var(--text-muted);font-weight:500;">' + esc(t.category) + '</div>' +
            '<h3 class="card-title" style="font-size:1rem;">' + esc(t.title) + '</h3>' +
            '<div class="trap-box"><div class="trap-title">⚠ Common Trap / Mistake</div><div>' + esc(t.wrongApproach) + '</div></div>' +
            '<div class="rule-box"><div class="rule-title">✓ Correct Rule</div><div>' + esc(t.correctRule) + '</div></div>' +
            '</div>' +
            '<div class="divider-top" style="margin-top:0;font-size:0.75rem;color:var(--text-muted);">' +
            '<strong style="color:var(--text);">Examiner Tip: </strong>' + esc(t.examTip) +
            '</div></article>'
          );
        }).join('');

        var resetHtml = '';
        if (sm.completedItems > 0) {
          resetHtml = state.confirmReset
            ? '<div style="display:flex;gap:0.4rem;"><button type="button" class="btn-danger" data-action="confirm-reset">Confirm Reset ' + esc(ch.unitLabel) + '</button><button type="button" class="btn-outline" data-action="cancel-reset">Cancel</button></div>'
            : '<button type="button" class="btn-outline" data-action="ask-reset">↺ Reset ' + esc(ch.unitLabel) + '</button>';
        }

        document.getElementById('top').innerHTML =
          '<section class="hero">' +
          '<div class="no-print" style="display:flex;flex-direction:column;gap:0.75rem;">' +
          '<div class="meta-row">' +
          '<div class="meta-text">' + esc(ch.ctx.university) + ' · ' + esc(ch.ctx.semester) + '</div>' +
          '<button type="button" class="btn-outline" data-action="toggle-theme" aria-pressed="' + (state.theme === 'dark') + '">' +
          (state.theme === 'dark' ? '☀ Light Mode' : '☾ Dark Mode') +
          '</button></div>' +
          '<div class="tab-bar" role="tablist" aria-label="Chapters">' + chapterTabsHtml + '</div>' +
          '</div>' +
          '<h1>' + esc(ch.headline) + '</h1>' +
          '<p class="hero-desc">' + esc(ch.intro) + '</p>' +
          '<div class="kpi-grid">' +
          '<div class="kpi-card"><div class="kpi-label">Exam Weightage</div><div class="kpi-val font-mono">' + esc(ch.weightage) + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Syllabus Allocation</div><div class="kpi-val font-mono">' + esc(ch.hours) + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Derivations Covered</div><div class="kpi-val font-mono">' + esc(ch.derivations) + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-label">Solved Numericals</div><div class="kpi-val font-mono">' + esc(ch.solvedCount) + '</div></div>' +
          '</div>' +

          '<div class="card no-print">' +
          '<div class="progress-header">' +
          '<div>' +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;font-size:0.82rem;">' +
          '<strong>' + esc(ch.unitLabel) + ' Study Progress</strong>' +
          '<span class="font-mono" style="color:var(--text-secondary);">' + sm.completedItems + '/' + sm.totalItems + ' items (' + sm.percentage + '%)</span>' +
          '<span style="color:var(--text-muted);">· All 8 Units: <strong class="font-mono">' + overall.completedItems + '/' + overall.totalItems + ' (' + overall.percentage + '%)</strong>' +
          (overall.completedChapters > 0 ? ' · ' + overall.completedChapters + '/8 completed' : '') + '</span>' +
          '</div>' +
          '<div class="progress-track"><div class="progress-fill' + (sm.isChapterCompleted ? ' complete' : '') + '" style="width:' + sm.percentage + '%"></div></div>' +
          '</div>' + resetHtml + '</div>' +
          '<div class="sec-chips">' +
          '<div class="sec-chip' + (sm.isTheoryCompleted ? ' is-done' : '') + '"><a href="#theory">01. Theory (' + sm.theoryDone + '/' + sm.theoryTotal + ')</a><button type="button" class="icon-toggle" data-action="toggle-all-subtopics" aria-pressed="' + sm.isTheoryCompleted + '">' + (sm.isTheoryCompleted ? '✓' : '○') + '</button></div>' +
          '<div class="sec-chip' + (sm.isFormulasCompleted ? ' is-done' : '') + '"><a href="#formulas">02. Formula Sheet</a><button type="button" class="icon-toggle" data-action="toggle-section" data-id="formulas" aria-pressed="' + sm.isFormulasCompleted + '">' + (sm.isFormulasCompleted ? '✓' : '○') + '</button></div>' +
          '<div class="sec-chip' + (sm.isSolvedCompleted ? ' is-done' : '') + '"><a href="#solved">03. Solved Qs (' + sm.solvedDone + '/' + sm.solvedTotal + ')</a><button type="button" class="icon-toggle" data-action="toggle-all-questions" aria-pressed="' + sm.isSolvedCompleted + '">' + (sm.isSolvedCompleted ? '✓' : '○') + '</button></div>' +
          '<div class="sec-chip' + (sm.isTrapsCompleted ? ' is-done' : '') + '"><a href="#traps">04. Exam Traps</a><button type="button" class="icon-toggle" data-action="toggle-section" data-id="traps" aria-pressed="' + sm.isTrapsCompleted + '">' + (sm.isTrapsCompleted ? '✓' : '○') + '</button></div>' +
          '</div></div></section>' +

          '<section id="lab" class="section-block no-print">' +
          '<div class="card">' +
          '<div class="card-head" style="margin-bottom:1rem;"><div><h2 style="margin:0;font-size:1.15rem;">' + esc(lab.title) + '</h2>' +
          '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.2rem;">100% offline JavaScript verification lab — edit values to compute instantly.</div></div></div>' +
          '<div class="lab-grid"><div>' + lab.controls + '</div>' +
          '<div class="lab-metrics" id="lab-metrics">' +
          lab.metrics.map(function (m) {
            return '<div class="lab-stat"><div class="lab-stat-k">' + esc(m[0]) + '</div><div class="lab-stat-v font-mono">' + esc(m[1]) + '</div></div>';
          }).join('') +
          '</div></div></div></section>' +

          '<section id="theory" class="section-block">' +
          '<div class="section-head"><div><h2>01. Complete Theory Notes &amp; Step-by-Step Derivations</h2>' +
          '<p class="section-sub">Covers every ' + esc(ch.unitLabel) + ' subtopic across Define (SD), Description (D), Derivation (DR), Illustration (I), Explanation (E), Application (A), and Numerical (N).</p></div>' +
          '<div class="controls-wrap no-print">' +
          '<button type="button" class="btn-outline' + (sm.isTheoryCompleted ? ' is-done' : '') + '" data-action="toggle-all-subtopics" aria-pressed="' + sm.isTheoryCompleted + '">' +
          (sm.isTheoryCompleted ? '✓ Section Completed' : '○ Mark Section Completed') + ' (' + sm.theoryDone + '/' + sm.theoryTotal + ')</button>' +
          '<div class="tab-bar">' +
          '<button type="button" class="tab-btn' + (state.theoryFilter === 'all' ? ' active' : '') + '" data-action="theory-filter" data-id="all">All Subtopics</button>' +
          '<button type="button" class="tab-btn' + (state.theoryFilter === 'derivations' ? ' active' : '') + '" data-action="theory-filter" data-id="derivations">Derivations (DR)</button>' +
          '<button type="button" class="tab-btn' + (state.theoryFilter === 'definitions' ? ' active' : '') + '" data-action="theory-filter" data-id="definitions">Quick Definitions (SD)</button>' +
          '</div></div></div>' +
          '<div class="note-banner"><strong>Syllabus &amp; Micro-Syllabus Alignment: </strong>' + esc(ch.ctx.microSyllabusNote) + '</div>' +
          '<div class="stack">' + notesHtml + '</div></section>' +

          '<section id="formulas" class="section-block">' +
          '<div class="section-head"><div><h2>02. Master Formula &amp; Design Constant Sheet</h2>' +
          '<p class="section-sub">Every ' + esc(ch.formulaUnitLabel) + ' formula, standard assumption/constant, and SI / measurement unit for rapid pre-exam revision.</p></div>' +
          '<div class="controls-wrap no-print">' +
          '<button type="button" class="btn-outline' + (sm.isFormulasCompleted ? ' is-done' : '') + '" data-action="toggle-section" data-id="formulas" aria-pressed="' + sm.isFormulasCompleted + '">' +
          (sm.isFormulasCompleted ? '✓ Section Completed' : '○ Mark Section Completed') + '</button>' +
          '<div class="tab-bar">' + formulaTabsHtml + '</div></div></div>' +
          '<div class="table-wrap' + (sm.isFormulasCompleted ? ' is-done' : '') + '"><div class="table-scroll"><table>' +
          '<thead><tr><th>Quantity / Measure</th><th>Symbol</th><th>Formula</th><th>Standard Assumption / Constant</th><th>SI / Data Unit</th></tr></thead>' +
          '<tbody>' + formulaRowsHtml + '</tbody></table></div></div></section>' +

          '<section id="solved" class="section-block">' +
          '<div class="section-head"><div><h2>03. Solved PU Model Questions &amp; Extra Exam Numericals</h2>' +
          '<p class="section-sub">' + esc(ch.solvedSubtitle) + '</p></div>' +
          '<div class="controls-wrap no-print">' +
          '<button type="button" class="btn-outline' + (sm.isSolvedCompleted ? ' is-done' : '') + '" data-action="toggle-all-questions" aria-pressed="' + sm.isSolvedCompleted + '">' +
          (sm.isSolvedCompleted ? '✓ Section Completed' : '○ Mark Section Completed') + ' (' + sm.solvedDone + '/' + sm.solvedTotal + ')</button>' +
          '<div class="tab-bar">' +
          '<button type="button" class="tab-btn' + (state.solvedFilter === 'all' ? ' active' : '') + '" data-action="solved-filter" data-id="all">All Questions (' + ch.questions.length + ')</button>' +
          '<button type="button" class="tab-btn' + (state.solvedFilter === 'model' ? ' active' : '') + '" data-action="solved-filter" data-id="model">PU Model Set</button>' +
          '<button type="button" class="tab-btn' + (state.solvedFilter === 'extra' ? ' active' : '') + '" data-action="solved-filter" data-id="extra">Extra Exam Numericals</button>' +
          '</div></div></div>' +
          '<div class="stack">' + questionsHtml + '</div></section>' +

          '<section id="traps" class="section-block">' +
          '<div class="section-head"><div><h2>04. Exam Traps, Sign Conventions &amp; High-Yield PU Topics</h2>' +
          '<p class="section-sub">Common sign mistakes, boundary geometry errors, and recurring Purbanchal University question patterns.</p></div>' +
          '<div class="controls-wrap no-print">' +
          '<button type="button" class="btn-outline' + (sm.isTrapsCompleted ? ' is-done' : '') + '" data-action="toggle-section" data-id="traps" aria-pressed="' + sm.isTrapsCompleted + '">' +
          (sm.isTrapsCompleted ? '✓ Section Completed' : '○ Mark Section Completed') + '</button>' +
          '<div class="tab-bar">' + trapTabsHtml + '</div></div></div>' +
          '<div class="grid-2">' + trapsHtml + '</div></section>';

        document.getElementById('footer-inner').innerHTML =
          '<div>' + esc(ch.ctx.subject) + ' · ' + esc(ch.ctx.chapter) + ' · ' + esc(ch.ctx.totalSubjectMarks) + '</div>' +
          '<div>Standalone Offline HTML5 Edition · Aligned to Purbanchal University 2021 Batch Syllabus &amp; 2024 Model Question Set</div>';
      }

      document.getElementById('print-btn').addEventListener('click', function () {
        window.print();
      });

      document.getElementById('top').addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('[data-action]') : null;
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var id = btn.getAttribute('data-id');
        if (action === 'chapter' && CHAPTERS[id]) {
          state.activeChapter = id;
          state.formulaFilter = 'All';
          state.confirmReset = false;
          render();
        } else if (action === 'toggle-theme') {
          toggleTheme();
        } else if (action === 'toggle-subtopic') {
          toggleSubtopic(id);
        } else if (action === 'toggle-all-subtopics') {
          toggleAllSubtopics();
        } else if (action === 'toggle-question') {
          toggleQuestion(id);
        } else if (action === 'toggle-all-questions') {
          toggleAllQuestions();
        } else if (action === 'toggle-section') {
          toggleSimpleSection(id);
        } else if (action === 'theory-filter') {
          state.theoryFilter = id;
          render();
        } else if (action === 'formula-filter') {
          state.formulaFilter = id;
          render();
        } else if (action === 'solved-filter') {
          state.solvedFilter = id;
          render();
        } else if (action === 'trap-filter') {
          state.trapFilter = id;
          render();
        } else if (action === 'ask-reset') {
          state.confirmReset = true;
          render();
        } else if (action === 'cancel-reset') {
          state.confirmReset = false;
          render();
        } else if (action === 'confirm-reset') {
          state.progress[state.activeChapter] = createEmptyChapterProgress();
          state.confirmReset = false;
          saveProgress();
          render();
        }
      });

      function updateLabOnly(cid) {
        var lab = computeLabHtml(cid);
        var metricsEl = document.getElementById('lab-metrics');
        if (!metricsEl) return;
        metricsEl.innerHTML = lab.metrics.map(function (m) {
          return '<div class="lab-stat"><div class="lab-stat-k">' + esc(m[0]) + '</div><div class="lab-stat-v font-mono">' + esc(m[1]) + '</div></div>';
        }).join('');
      }

      document.getElementById('top').addEventListener('input', function (ev) {
        var el = ev.target;
        if (!el || !el.getAttribute) return;
        var labCid = el.getAttribute('data-lab');
        var field = el.getAttribute('data-field');
        if (!labCid || !field || !state.labInputs[labCid]) return;
        state.labInputs[labCid][field] = el.value;
        updateLabOnly(labCid);
      });

      document.getElementById('top').addEventListener('change', function (ev) {
        var el = ev.target;
        if (!el || el.tagName !== 'SELECT') return;
        var labCid = el.getAttribute('data-lab');
        var field = el.getAttribute('data-field');
        if (!labCid || !field || !state.labInputs[labCid]) return;
        state.labInputs[labCid][field] = el.value;
        render();
      });

      window.addEventListener('storage', function (ev) {
        if (ev.key === PROGRESS_KEY) {
          state.progress = loadProgress();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
